rules:
  - >-
    Every shape is drawn three times from one contour (fill, shadow, ink), each with its own slow wobble and
    drift, so fills slide under their lines
  - >-
    Each scene in a different animator's hand: clean thin line, painterly flat shapes with no outline, or
    scratchy triple line with hatching
  - >-
    People drawn from a skeleton with naturalistic proportions, posed by gesture keyframes plus breathing and
    weight-shift noise, so they move like traced footage
  - >-
    Finish: the whole frame breathes (low-frequency warp), film softness and grain, washed colour, lifted
    blacks, a hue that drifts all the time
  - Odd sounds in the bed push acid turns (hue jolts, mirrored seep, peeled ghost layer, kaleidoscope fold)
  - All motion is smooth noise in song time, never Math.random; anonymous talkers, no real likeness
palette: []
reference: Richard Linklater's Waking Life (2001), its painted-over-video rotoscope
