rules:
  - >-
    Four papers only: teal ground, antique gold, plum, cream, each in three weights; peacock blue only in a
    feather eye
  - >-
    Every shape goes through cut(): scissor edge, paper grain and mottling, a soft drop shadow that grows with
    lift
  - >-
    Nouveau in paper: whiplash tendrils, scalloped and lace-punched Mucha haloes, lilies, peacock feathers,
    Guimard lamps
  - A cream poster border with an arched top on every frame
  - Paper moves on twos, except the clap shots (smooth, so contact lands on its frame)
  - People are jointed silhouette puppets, one colour per person
  - Every scene change is a match cut on one element that contracts, expands or morphs
