rules:
  - >-
    Paint a flat underpainting with heavy umber contours (12 to 24 px); the brushstroke pass dissolves
    anything under ~8 px
  - >-
    Muted Mucha palette: sage, gold, dusty rose, cream on teal, plum and night blue; ruby and amber for
    lamplight; no pure black or white
  - Curves are whiplash curves ending in a spiral; straight lines are rare
  - "Ornament grows with the music: vines, tendrils and lily petals unfurl"
  - "Lights go on a separate additive layer with bloom: lamps, lit glass, rain glints"
  - A Mucha arched border on every shot; camera always drifting or pushing, shots 1.5 to 4 s
  - Clapping hands as three key drawings (open, three-quarter, palm to palm at the hit)
