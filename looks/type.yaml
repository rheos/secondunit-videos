rules:
  - >-
    Near-black ground (#0a0908), off-white type (#ece6d8), one hot orange-red accent (#ff4a1c); the shader
    blooms only the accent
  - Archivo, JetBrains Mono and Instrument Serif; the lyric words are the set, one idea per shot
  - Interface grammar - terminal prompts, error pop-ups, gauges, radar, forms, stamps - built from the words
  - >-
    The plane is a line technical drawing filled with the ground colour, eyes in the windscreen, mouth opens
    with the vocal
  - Cuts on the beat or the sung word; words only from Bob's sheet; every word fits its box
  - >-
    Finish: slight edge channel split, 24 fps grain, faint scanlines, vignette; glitch tears and white flashes
    on hits
