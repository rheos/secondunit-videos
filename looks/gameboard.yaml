rules:
  - Every printed piece (board, box lid, cards, money, standees) is built once from separate spot-colour plates with halftone tints
  - Plates print slightly off register, with ink voids and worn edges, on cream board
  - A short set of period spot inks (red, blue, yellow, green, black), each a little off, as printed on cream board
  - Turned wooden pawns with faint lathe rings and paint chips showing raw wood; they hop, land with a wobble and topple
  - One world, one plain wooden table; shots are camera moves (top-down, a low 3/4 chase, a tabletop dolly)
  - Seeded randomness only; every frame is a pure function of song time
