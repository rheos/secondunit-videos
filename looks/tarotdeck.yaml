rules:
  - Each card prints in two passes that share its transform, both multiplied onto aged card stock
  - "Colour stencils: flat fills, each colour slipped off register by its own offset, mottled where the ink starved"
  - "Black key block: variable-width cut lines, hatching and lettering, speckled where the paper tooth skipped"
  - Figures move on 8 fps steps, like puppets
  - The camera moves into a card and its picture grows past the frame, wiping the frame and banners away (no fade)
  - Cards are dealt on a green square mat on a light oak table
  - No red or yellow rays from a red disc (they read as the Rising Sun flag); suns are Marseille-style faces
