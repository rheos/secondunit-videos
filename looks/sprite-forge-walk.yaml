rules:
  - "--palette is the 16bit PALDEF: every sprite pixel is one of the 46 colours (test 01: 0 off-palette pixels)"
  - Binary alpha, no soft edges
  - One stride a second at 12 frames; the planted foot must travel at the walk speed or the sprite slides
  - The world follows the 16bit look's rules (320x180 indexed buffer, x4 nearest)
  - Plain image-to-video sees one still, so only a character in profile doing one action; anything that turns or acts needs the character sheet
