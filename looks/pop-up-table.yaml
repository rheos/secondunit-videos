slug: pop-up-table
title: Paper pop-up table
note: >-
  A restaurant table at night where everything is cut card: the place setting pops up into a small city, the cutlery
  stands up as a fence, and flat paper people on little tabs slide along slots in the cloth. It is filmed low and
  close, by candlelight, like a real paper model.
used: My Dinner With Andre monologue reel, test
cost: hybrid
