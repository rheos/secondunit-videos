code:
  path: andre-dinner-monologue/tests/paper-world/js/skin.js
  flag: "?skin=1"
  page: andre-dinner-monologue/tests/paper-world/index.html
  note: >-
    plates.json holds every piece's prompt; paint.sh paints pieces through gptimg in parallel, with the target still
    attached as the style reference (a plate with "ref" is a registered edit of another plate, used for dark and lit
    window pairs and for the bare and capped head; "full" plates carry their whole prompt). Pieces live in gitignored
    work/plates/. js/skin.js stands each piece in the three.js blocking as a card; js/story.js holds the camera keys
    and every event on film frames; tools/render.mjs draws frames in headless Chrome. docs/STORYBOARD.md has the
    grammar (hinge, slot, turn, pull-tab, wheel, string, fold) and the whole film.
rules:
  - "One world, the table; one continuous low camera that never stops and never zooms (a pull-back rises and tilts)"
  - Paint a target still of the key image first; attach it as image 1 to every piece so the medium and finish hold
  - "Every piece is one isolated object on a transparent background, lit warm from the upper left, on its own tab or base"
  - "A painted piece is never relit: draw it unlit and tint it by distance from the candle; the cloth is the only lit surface and the only one that takes shadows"
  - "Solid-looking pieces turn about the vertical axis to face the lens; flat standees and the cutlery fence keep their place and show their edge"
  - "A solid piece that the camera sees from high above must be real geometry wrapped in painted card (the tiered plate towers), never a card painted from table height"
  - "Nobody walks with legs: standees slide along slots drawn in the cloth, rocking a couple of degrees on twos; a turn is the card turning, edge-on for two frames"
  - "Things arrive as pop-ups: a card hinges up from the cloth, windows wipe on from a dark plate to its lit twin, tiers telescope out of a plate"
  - "Soft real tableware close to the lens and a blurred, dimmed restaurant far behind give the lens its depth"
  - No faces, no text; guards wear painted peaked caps
