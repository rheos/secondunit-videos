  flag: null
  page: bobwiseman-rescue-machine/machine.html
  note: >-
    Times come from work/cues.js (gitignored, it quotes the lyrics), built by tools/align.py and tools/cues.py from
    the vocal stem. `LEGS=1 node render.mjs x --stills 1` prints every leg's speed.
rules:
  - One ball on one continuous path; every leg a real roll, fall, rise, hop or ride, with its speed checked
  - The camera follows the ball, smoothed over the ball's own path, close enough that objects fill the frame
  - Every part is a joke about its line, not a generic mechanism; write the joke before drawing the part
  - Parts carry props that extend the joke (a WE CARE certificate, a paper stack marked ON HOLD)
  - Each line is lettered beside its part, word by word on the sung times, where the camera already is
  - A repeated verse runs the machine again and escalates; second-pass lines in red under the first
  - End on a pull-back that gives the whole machine a meaning
  - Looseleaf felt pen, crayon fills, held on twos; motion blur only on fast camera moves
