slug: rescue-machine
title: Lyric chain-reaction machine
note: >-
  One ball runs one long hand-drawn machine, and every part is a joke about the line being sung beside it. On the
  last word the camera pulls back: the whole machine is a ring around one lit window.
used: No One's Coming to the Rescue, Bob Wiseman, test
