rules:
  - Every piece of glass is its own pane, with a seeded shift in value and hue so no two pieces match
  - Panes shade darker toward their lead and read brightest mid-pane
  - Dark lead cames outline every pane; faces and folds in dark brown grisaille paint lines
  - A glass texture over all of it (mottle, drawn-glass streaks, seed bubbles), then bloom, light shafts, vignette and grain
  - One window per verse in a stone nave; the camera trucks pane to pane, one lancet per sung line
  - The light moves from day to night; at the end cracks spread and panes fall out while the lead stays
