title: Coloured paper silhouettes
note: >-
  Matte coloured paper cut flat and lit from the front, with soft drop shadows and four colours a frame.
  People are profile silhouettes in one colour each, jointed like puppets. Here her silhouette fills with
  night sky and the clouds inside it carry her children's profiles.
