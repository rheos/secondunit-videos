rules:
  - A few flat layers of matte cut paper with soft drop shadows, grain and mottling; depth from shadows and gentle parallax, never 3D lighting
  - People are profile silhouette puppets, one paper colour per person, moving at the joints; never rock a stiff figure
  - No faces ever; a small closed-eye crescent only on a big head
  - Her family is navy and nobody else is; at most four colours a frame besides the ground, one or two accents a scene
  - Paper moves on twos; arrivals pop with overshoot or slide in on a slot
  - Poster-grade frames with one focal point and generous negative space; no text unless the story needs it
  - Recurring motifs carry meaning (gold laugh rings, the sun halo, paper birds, the orange)
