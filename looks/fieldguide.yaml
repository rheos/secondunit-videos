rules:
  - Cream paper with grain; wide diagonal stripe grounds, the colour shifting per act
  - "Simple primitive figures: box coats, ellipse heads, stick legs; deadpan faces"
  - "Ink lines are pressure ribbons: width and darkness swell and thin, tapered ends"
  - Each outline and hatch is a darker cut of the fill it sits on, not one brown ink
  - "Opaque fills get a wash: light from the upper left, a darker rim pooled inside the edge"
  - Hatching only for shade, never gradients; drawn on twos
  - Cut hard on the beat against the blueprint schematic look
