rules:
  - >-
    Pieces are procedural steel engravings: parallel lines that bend with the tone, thicken in the dark,
    cross-hatch in the darkest
  - "Hand tinted: flat muted watercolour washes, blotched and slipped off the lines"
  - Cut out with a wobbling scissor edge and a paper margin; each piece casts a soft shadow
  - Pieces are laid on airbrushed skies
  - Movement on single pivots, stepped at 10 fps with a little jitter; gags are instant
  - Paint each piece once at load; per frame only transform and blit
  - "16 mm finish: gate weave, grain, exposure flicker, light vignette"
