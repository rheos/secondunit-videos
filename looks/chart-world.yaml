    (gitignored). The aligner drops numbers, so spell them out for it and set those word times by hand.
rules:
  - One card, one chart, no cuts; the song moves through it by changing what the chart measures
  - Isometric boxes from one projection, three tones per box, thin soft ink, soft floor shadows
  - Density is the charm; rooms are furnished and a yard has a dog, a bench and a bus shelter
  - Tiny people two heads tall, each busy with their own small trouble
  - Every label sits on the card with a leader line to its object, and the lines stay when the objects shrink
  - A live readout and a graph run all the way through, and their wording carries jokes
  - Cream paper on tan, muted colour, one red accent used for the data and the key sung word
  - Each sung line is lettered word by word on its time in one fixed place, one key word in red
