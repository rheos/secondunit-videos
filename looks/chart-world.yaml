slug: chart-world
title: Isometric chart world
note: >-
  A whole verse drawn as one chart: a tiny town cut open on a paper card, its troubles labelled with leader lines,
  and a graph that follows the song. The picture and the data are the same drawing, and the numbers keep the joke going.
