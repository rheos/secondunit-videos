rules:
  - Everything is a torn scrap cut from seeded paper stocks (newsprint, kraft, brick, halftone poster, mustard, tin, rust, tissue)
  - Scraps get a white rim and a soft shadow; torn edges, nothing vector-clean
  - "The plane is built from junk: tin-can fuselage, poster-stripe cheat line, magazine-paper eyes, cereal-box wings, spoon propeller, hubcap wheels"
  - Stop motion on twos (12 a second); one exposure per drawing
  - "Finish: per-drawing misregistration, grain, exposure flicker, uneven table light, dust specks, vignette"
