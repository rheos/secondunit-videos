rules:
  - >-
    The 2D frame is a set of separations: R = pink plate, G = teal, B = yellow; black in the source is bare
    paper
  - Opaque shapes knock out every plate (source-over); overprints use lighten (max per plate)
  - Each plate gets its own registration error, new every drawing; animation on twos (12 a second)
  - Plates screened into rotated halftones, starved in streaks and blotches, speckled with white
  - >-
    Inks multiply over off-white stock, so overlaps go deep (pink x teal = navy line, pink x yellow = red,
    teal x yellow = green)
  - Big moments fly the plates apart and re-register; Warhol-style repeats of his face, one per ink
palette:
