rules:
  - >-
    Every piece is cut from a real public-domain print or photo; Midjourney only for what archives lack,
    prompted as old print
  - >-
    Pieces never match: mixed eras, processes and scales (oil sky, etching, photochrom, lithograph,
    caricature)
  - Each piece keeps a thin cream scissor edge and casts a soft drop shadow
  - "Pieces move like puppets: slide, bob, pivot, swap drawings; never morph"
  - Cut a moving limb off as its own piece pinned at the joint; never rock the whole figure
  - Paint each plate once at load and only move pieces per frame
  - "Finish: paper tooth, warm grade, vignette, a flash wash on lightning"
palette: []
reference: >-
  Sarah Legault's animation for Rheostatics' "The Inland Sea" (painted ships by Robert McGreevy). Pieces from
  PD scans: Ruisdael sky, Aivazovsky sea, photochrom steamer, Currier lithograph, Whistler etching, an 1887
  egret photo, a Vanity Fair caricature.
