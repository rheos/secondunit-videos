rules:
  - >-
    Three layers: front (puppets pressed on the cloth, crisp), back (scenery held away, blurred and paler),
    glow (added light)
  - Puppets are card silhouettes; cut-outs are holes, colour is a multiplied gel
  - "An oil lamp behind the cloth: hotspot with a four-point star, falloff to burnt edges, flicker and sway"
  - Shadows are red-brown, never black; one palette for the whole tale, only the lamp moves
  - Rods run down out of frame; their shadows sit on the soft back layer
  - A speaking puppet shakes its whole body with little hops; listeners stay still
  - Cloth weave and folds, light wrapping the silhouette edges, faint leather grain
