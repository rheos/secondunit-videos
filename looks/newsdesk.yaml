rules:
  - Everything plays on a walnut console TV in a lamp-lit, wood-panelled den, the king watching from his wingback
  - "The broadcast is a 960x720 signal put through a WebGL CRT: NTSC chroma bleed and ringing, 240 scanlines that widen with brightness, barrel curve, phosphor bloom, slot mask, grey-green glass"
  - "The set: navy backdrop, an orange dot-matrix world map, a veneer desk, a generic anchor in glasses, sideburns, brown suit and wide orange tie"
  - An over-the-shoulder picture box carries the story; inserts are slightly warmer news film
  - "Captions are a canary teleprinter strip across the lower third: Courier New Bold capitals typed on each word's onset, ink jitter, a double strike and a riding print head"
  - Cel figures with one dark ink outline, popping on twos; every face stays above the strip
