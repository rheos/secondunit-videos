    wood.js is the carving kit (flick, taper, chisel). The film's sections C and E are
    bobwiseman-airplane-v1/sections/woodcut. Me and Jimi copies the print as
    bobwiseman-me-and-jimi/js/look-woodcut.js with wood.js + wkit.js (page wood.html; build rules in
