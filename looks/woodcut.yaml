    libelous-1 (not merged).
rules:
  - >-
    Draw only three flat values: INK #000, CUT #fff (bare paper), RED #f00 (the one accent plate); no greys,
    no gradients
  - >-
    Carver's marks, not vector art - tapered gouge flicks, parallel cut lines that thin into the light,
    chiselled faceted outlines
  - Fill big areas with ink and carve light into them, or the reverse
  - >-
    Limited animation on twos (a new block every 1/12 s); the print is re-pulled on threes so the gouge
    texture boils
  - >-
    Print pass: edges thresholded against noise (ragged, hard), paper tooth and pressure sag, wood-grain
    streaks in solids, red plate a few px off register, paper margin and block edge
  - Red is reserved for one thing per film (the cheat line in Airplane, Ellen's hair in Me and Jimi)
palette:
