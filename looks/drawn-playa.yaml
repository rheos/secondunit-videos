rules:
  - "One continuous 3D playa through a pinhole camera: flat ground, low horizon, clear sky, hard sun, long shadows"
  - People are flat profile cut-outs placed in the 3D world; never mix in 3D-modelled characters
  - Cracked mud drawn as polygons fixed in the world, so motion reads against them
  - One drone camera that never stops moving; when it slows it hovers and drifts, never still more than 1-2 s, no snaps
  - Nothing blinks in or out; a solid thing only appears or vanishes where the lens can't see it
  - Dali touches (melting props, crutches, egg heads, drawers) on a real Burning Man (the Man, the city map, burn rituals, one-of-a-kind art cars, costumes)
