slug: drawn-playa
title: Drawn surrealist playa
note: >-
  Flat cut-out figures set in a 3D desert under a drifting drone camera: a sax player in a purple striped coat
  cycles past an octopus art car and a long boardroom table where egg-headed suits ride in office chairs. Hard
  sun, long shadows, cracked mud drawn as polygons.
