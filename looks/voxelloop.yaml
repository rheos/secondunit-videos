rules:
  - >-
    A small world turns once in exactly 8 s (or by an angle its symmetry maps onto itself), so the last frame
    runs into the first
  - "Every other motion has a period that divides 8 s: walk 1 s, bob 2 s, rain 0.5 s"
  - Voxel boxes with 16x16 Python-generated textures, sampled Closest in world metres
  - EEVEE at 180x320, scaled x4 nearest-neighbour to 720x1280
  - Sky graded in screen space so it reads at any camera tilt
  - "Check the seam: last-to-first PSNR within 1.5 dB of the median frame step"
