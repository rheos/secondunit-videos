  note: >-
    js/core.js is April Zhu's engine unchanged, MIT, with js/LICENSE-colorfigures.txt and the credit on screen.
    js/player.js models the machine; js/film.js is a pure seek(songSeconds) that drives mountFigure's state and setCam,
    with the viewBox set before the scene draws (labels read it). Lyrics and cues stay in gitignored work/
    (tools/cues.py builds them from the project's Whisper words and vocal stem). render.mjs does 936 frames in about
    2 minutes.
rules:
  - Her buttons become the lyric line; each pill fills as it is sung
  - Every animation is a function of song time, never a button press
  - Layout is for 1280x720, the object framed with room for the lyric row and labels
  - See-through and labels switch on for a sung reason (the "inspect" line, a name) and off again
  - The object is true to the real thing from every side; parts only move along their real path
  - Flat three-tone bodies, heavy ink silhouette, finer inner lines, flat blue cast shadow, warm paper
  - People named in the lyric stay undrawn; objects stand in for them
