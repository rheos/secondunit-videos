  note: >-
    Three stages, run by tape.sh. 1: home.html draws the camcorder video at 960x720 (world.js the park, cast.js the
    kids, camera.js the hand-held camcorder, home.js optics, date stamp and the record-restart glitch). 2: ntsc-rs-cli
    with an NTSCRT preset's ntsc.settings (Mild, Medium or Clean VHS) at 480 lines. 3: tv.html reads the tape frames,
    adds the VCR's blue screen, PLAY, snow and tracking band, then the house CRT shader (js/crt.js, a factory made
    from bobwiseman-libelous/js/tv/crt.js), rounded glass, bezel and screen spill. Stage 3 needs Chrome's
    --allow-file-access-from-files (tools/render.mjs, which also redraws any frame the GPU canvas hands back blank), because WebGL won't take file:// images otherwise.
rules:
  - >-
    Shoot into the sun: everything between it and the camera is one dark shape with a warm rim and a soft halo,
    shadows run long toward the camera, the sun blooms over nearby edges
  - >-
    Kids are silhouettes, never faces: one dark colour, whole poses with tube limbs that bend through knee and elbow,
    identity carried by the outline (ponytail, cap brim, sun hat, dress flare); size follows depth on the ground
  - >-
    Camcorder grammar: drift that never stops (more shake when zoomed), slow pans, an easing zoom rocker, focus that
    hunts after each zoom, auto-iris that darkens with the sun in frame, smear on fast pans, in-camera cuts that
    roll and tear for four frames, a burned-in 5x7 date stamp whose minute jumps at a cut
  - >-
    Draw at 4:3 and leave the tape to ntsc-rs: the strength is a preset choice, never hand-made noise on the picture
  - >-
    What the VCR adds is drawn after the tape (blue screen, PLAY, snow, the tracking band as it locks); what the
    camcorder adds is drawn before it (date stamp, record restart)
  - >-
    The TV is deterministic: house CRT shader at 240 lines, rounded tube, dark bezel, screen colour spilling on a
    dark room, 4:3 tube inside 16:9
