title: VHS home video on a CRT
note: >-
  A family camcorder tape of kids playing in a park into the low sun, played back on an old television. The kids
  are back-lit shapes with warm rims, the camera drifts and hunts for focus, and the tape brings a blue PLAY
  screen, a rolling tracking band, colour bleed and scanlines.
