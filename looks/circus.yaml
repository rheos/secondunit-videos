rules:
  - Four stones (yellow, red, ultramarine, black key), each a flat black mask on its own layer
  - Each layer is grained with a litho-crayon tooth, given a soft roll-ink blotch, coloured and multiplied onto cream paper
  - A fixed misregister per stone, plus short jolts when a stone lands
  - Shading is crayon stipple from the same granules; overprints mix as on press (red over yellow orange, blue over yellow green, red over blue purple)
  - "Wood type: Rockwell 900 condensed to 0.84, red face, blue block shadow, key outline, yellow stipple highlight"
  - No words on the bill except lyric words
