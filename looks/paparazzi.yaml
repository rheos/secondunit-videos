rules:
  - Every frame is drawn in tone (grey, white is bare paper) plus a spot-red layer, then screened pixel by pixel
  - Black ink on a 45 degree amplitude-modulated dot screen, red on 75 degrees, red printed 3 px out of register
  - Ragged dot edges from a paper-fibre field, cream newsprint underneath
  - "Flashbulb pop: a hard white burst of about two frames, then a blue-white afterimage that fades where the bulb fired"
  - On the prints (magazine spread, contact sheet) the screen is pinned to the page, so a push-in grows the dots
  - Stand-ins only; the big man is only seen from behind or as a far-off silhouette
