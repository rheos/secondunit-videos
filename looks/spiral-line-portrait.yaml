slug: spiral-line-portrait
title: One-line spiral engraving
note: >-
  A single spiral line winds out from the middle of a full moon and swells where the photo is dark, until a
  veiled musician and his guitar appear against it. Drawing the line is the whole animation.
used: Hjeron, test
cost: free
group: code
