  note: >-
    tools/build_audio.py turns script.json into one stem per speaker plus cues.js (lines, word times, per-frame
    levels); the page draws every frame from t in one GSAP driver (draw(t)), so any frame renders on its own.
    Swap the audio for a real recording and rerun build_audio.py; the direction (gestures, punch-ins, overrides)
    is the constants block in index.html.
rules:
  - "The frame is the call: dark call window, two rounded tiles, name pills, speaking ring and badge, live captions with speaker labels, a toolbar; our own chrome, never a real app's"
  - Heavy even black ink (5 px at 720) on the characters only; the rooms are flat colour with no outline
  - One room and one colour family per speaker (warm for the artist, cool for the agent)
  - "Faces: white disc or oval, dot eyes in white circles, arched brows, one mouth at a time from seven shapes"
  - Mouth from that speaker's own stem level, one shape per 3 frames (100 ms); listeners smile, nod and glance at the other tile
  - Black mitt hands appear only for a gesture (wave, palms out, hands on head) and leave; no arms at rest
  - Static two-up most of the time; a slow push on a long speech; hard punch-ins of 2 to 3 s, mostly on the listener's reaction
  - Captions roll in chunks of up to 52 characters, word by word from the audio; talk-over shows as two stacked lines
  - Open on one person waiting and the other joining; close on a card that names both
