rules:
  - "A height field contoured with marching squares at load: 50 m interval, an index contour every 250 m"
  - Relief shading from the north-west, hachures down steep fall lines, a cliff with a toothed rock line
  - Map symbols in brown and blue (water lines, a river with flow dashes, tree symbols, a dashed footpath, a kilometre grid, graduated neatline, scale bar)
  - Numbers only, in italic serif (spot heights, grid numbers); no words
  - An old sheet folded in 4 x 3 panels, foxed and stained, on a desk; a rostrum camera pans, zooms and turns over it
  - The surveyor is a small engraved woman in a hatched dress; a real pressed daisy is taped to the sheet
