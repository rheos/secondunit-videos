rules:
  - Warm paper with a soft darker edge; red is the one accent and the only colour
  - "Thin brown ink line work: 1.6 px lines, 1 px hairlines, faint lines at 45% opacity, dashed and perforated strokes"
  - Each chapter is a plate with a ruled border, a chapter label top left, and a scale and counter along the bottom the whole film
  - Archivo for labels and headlines (labels uppercase and wide-tracked), JetBrains Mono for numbers
  - Musician objects only (ticket stubs, tour lists, posters), never tech diagrams
  - Plates overlap so each hands an object to the next, with no blank paper between
