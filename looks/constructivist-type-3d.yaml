slug: constructivist-type-3d
title: Constructivist type in 3D on paper
note: >-
  Sung words printed flat on cards, bars and gateways in a 3D city that the camera skims at steep angles, with real
  buildings, doors and crowds lit from one side and pushed into three inks. Everything sits under a rough card texture
  with depth of field and motion blur, like a moving screen print.
