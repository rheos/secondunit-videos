  flag: "Blender: -- --stills <frames> or blender/render_chunks.sh <take>; three.js: ?v=2, ?pal=<name>, ?finish=print"
  page: bobwiseman-new-city-constructivist/newcity.html
  note: >-
    Blender 4.5 EEVEE is the reference build (Robin's pick, 2026-11-12). newcity_blender.py ports story2.js line for
    line under a y-up root empty: a real sun with cast shadows thresholded into three inks (Diffuse > Shader to RGB >
    two steps, plus world noise), the door wave in geometry nodes off Scene Time, words keyed at their exact onsets,
    EEVEE depth of field matched to the three.js CoC, motion blur, and the paper, weave, projection pass and vignette
    in the compositor. About 1.2 s a frame at 720p; render_chunks.sh renders 78-frame chunks with pauses (long EEVEE
    runs have crashed this Mac). The three.js v2 (js/) is the fast version with the same finish.
    story2.js holds the four shots as pure functions of song time; ink.js thresholds real models into three inks from
    one fixed light (face normals from screen derivatives, so instanced and skinned meshes work); type.js turns Anton
    outlines into flat or extruded meshes; main.js does the colour arc, sub-frame motion blur, depth of field from the
    depth buffer, the embossed paper on multiply, weave and vignette. About 0.2 s a frame at 720p on the Mac's GPU.
    Words and onset times are in gitignored work/words.js.
rules:
  - Three inks by role (paper, accent, dark) plus one motif colour; the ground flips ink at each cut
  - Real models (CC0) lit by one fixed light and thresholded into the inks; no outlines, no lights in the scene
  - Type is printed flat on surfaces (street cards, lintels, bars, slabs), never floating facing the camera
  - Camera low, wide and rolled; it skims printed surfaces at grazing angles and streams past dense rows of objects
  - Each word is stamped on its vocal-stem onset; the camera is placed so the word is ahead of it, not behind a nearer prop
  - Paper is an embossed card tooth fixed to the screen, under the print: full on the open backdrop, about 30% on objects
  - Projected, not painted: inks lifted to charcoal (about 30-55/255) by a veil of the blurred frame, bright paper glowing over dark edges
  - The palette drifts cool to warm across the piece; the motif colour grows on what is being built
palette:
  - "#e6e5dc"
  - "#2c5aa0"
  - "#21252f"
  - "#f2e2ba"
  - "#e9c43a"
reference: >-
  Simon Robson's "What Barry Says" (2004), study references/simon-robson/STUDY-what-barry-says.md: ideas only, none of
  his frames, layouts, emblems, models or sound. Colour arc and motif colour from the Kevin Ngo and Ricks Clips studies;
  cobalt from the cover of Accidentally Acquired Beliefs. The first palette (cream, poster red, near-black) is archived
  as ?pal=oxblood: Robin, 2026-11-12, "very cool, but it's also kind of fascist".
