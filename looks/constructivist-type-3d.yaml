verdict: >-
  Robin, 2026-11-12, on the 19.5 s cobalt cut (v2-cobalt-b): it lands, keep it. Next: the same test in Blender for
  comparison. On v1 (flat silhouettes, words facing the camera) he said it missed the essence: the 3D build, the
  printed type at grazing angles and the paper texture. Engine comparison (#505), same 19.5 s and same finish on both
  (three.js v2-cobalt-d, Blender constructivist-blender-e): Robin picked Blender as closer to What Barry Says. Along the
  way he moved the paper under the print ("more present on the backdrop... the elements are holographically coming
  away from the backdrop") and asked for a projected feel, "not so opaque but not transparent either".
