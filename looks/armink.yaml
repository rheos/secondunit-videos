rules:
  - "One ink for every outline: deep navy (#25264a), heavy and even, about 4.6 to 7 px at 1080p"
  - Flat fills with a screen-anchored dry-brush speckle; no modelling inside objects
  - Each fill sits 1.6 px right and 3 px down of its line, so a sliver of paper shows along the upper edges
  - >-
    Cast shadows are blue-violet coloured-pencil hatching on the paper, down and to the right, cross-hatched
    near the object, never on objects
  - Inside objects only a few light pencil streaks, never ink hatching
  - Plain cream paper (#f3eddc) suits it better than stripe grounds
