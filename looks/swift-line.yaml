project: bobwiseman-swift-noimage
code:
  path: bobwiseman-swift-noimage/scene/miles.rb
  flag: null
  page: null
  note: >-
    Ruby writes scene JSON, makevoid's native renderer draws it (`toolbox/swift-noimage-skill.yaml`), and
    scene/finish_cues.rb puts sound and VFX on the scene's own events. Real time at 1080p on the Intel Mac. Render at
    scene size and scale down, because the renderer crops. Lyric words come from gitignored work/cues.json.
rules:
  - One continuous camera; a scale change carries the story and strokes stay a fixed width on screen
  - Thin glowing lines on navy, one gold light that means the person, one hot accent
  - A live readout runs throughout, and it only tells the truth the song just told
  - Small labelled objects act out the words; big poster words only on the chorus
  - The rocket goes behind the words, and every word fits the frame
  - Sung lines reveal word by word in one fixed place, and a whole word always appears
  - The opening image returns as the payoff
  - Sound and VFX come from events the scene reports, never hand-placed
