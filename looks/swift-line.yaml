slug: swift-line
title: Night-sky line film
note: >-
  One unbroken pull-back from a lit window to the whole Earth, drawn in thin glowing lines on navy, with an odometer
  running, big words slamming in on the chorus and every small move cued to the song.
used: 10,000 Miles, Bob Wiseman, test
