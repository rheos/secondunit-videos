rules:
  - Aida even-weave linen with a hole at every cell corner; world units are stitch cells, integer coordinates are holes
  - Every X is two legs, each leg two twisted thread strands with a sheen
  - Lines in backstitch (smoke, snowflakes), French-knot eyes, cream running stitch round patches
  - A DMC-like thread palette; words in the sampler's 5x7 alphabet
  - Pictures stitch in pass by pass; changes are made by unpicking and restitching (the cold blue heart goes red)
  - One sampler in a wooden hoop on a walnut table; the border runs round as the verse goes on
  - Seeded only, no Math.random, no state carried between frames
