  note: >-
    One Three.js scene on a 1080x1920 canvas under DOM type overlays; the camera is a word-keyed path (cameraPath);
    every pose is a pure function of film time. Finish with tools/devweb-kit/finish.sh (120 fps blended to 60).
rules:
  - One world, one continuous camera; stations keyed to the narrator's words, never a cut
  - Toon shading with a 3-step ramp and a dark outline on the mascot; fog into a near-black navy floor grid
  - Blink, the mascot, has no hands; the harness belt and its carabiner tools do the acting
  - One mass moment per short (a crowd of Blinks), then back in close
  - Type as overlay only (hook, caption fragments, a slam); green model, blue tools, amber results, red failure
  - 1080x1920 at 60 fps with a 180-degree motion blur
palette: ["#0d1117", "#6ad08a", "#4f93d6", "#d6a45a", "#e0675a", "#eef2f6"]
reference: cinetic's gallery films (Leon Lin), for the continuous camera, the mass moment and the finish
