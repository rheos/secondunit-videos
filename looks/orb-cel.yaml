rules:
  - "Cel shading: Diffuse, Shader to RGB, a CONSTANT colour ramp (shadow, base, light), Emission; every shadow leans violet"
  - Inverted-hull outlines (Solidify with flipped normals and a backface-culled ink material)
  - Standard view transform so the palette hexes come out exact; convert sRGB hexes to linear in Python
  - Mist-pass fog, Glare bloom and a little lens dispersion in the compositor
  - One energy curve drives the orb glow, light, bloom and geometry on the beat
  - Scene changes hide in a fog swell before each drop, where the sky colour changes
