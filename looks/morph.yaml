rules:
  - "Both looks share one ANCHOR framing: side on, the plane fixed at the same screen position and size, road and horizon at the same heights, so across the window only the style changes"
  - Seam frames come straight from the renderer as lossless PNGs (outgoing look at the window start, incoming look at the window end)
  - A video model fills the window from start frame to end frame (Kling 3.0 std, 5 s here; mostly Wan 3.0 Prime, 2 s, in the final)
  - Splice the clip at the seam and drop its last frame (it equals the next segment's first frame); in the final, overlay with alpha fades
  - A fade must not overlap a different shot underneath; generate only after every look's character is locked
  - "Shared hybrid finish: cream stock #efe6d2 on a dark table, one red accent #cf2a28 only on the plane, motion on twos, re-pulled on threes"
