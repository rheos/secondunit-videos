  flag: null
  page: null
  note: >-
    About 2,000 dashes recomputed 8 times a second from a designed field, written as one path per colour, 26 MB of
    scene JSON and still real time at 1080p on the Intel Mac. A Metal nebula underpaints the gaps. No lyrics on screen.
rules:
  - Every dash takes its angle from a designed field, sky rivers plus a swirl round each light; no random noise
  - Every dash takes its colour from heat, nine paints from ultramarine to cream
  - Paint redraws 8 times a second so the sky is always wet
  - Dashes thicken as they warm; the climax is the biggest and brightest image, on the sung word
  - Each person is one dab of their own colour with a dark edge; the gold dab is her
  - Lights arrive on sung words
  - Keep away from the Starry Night composition; a flat row of plain houses, no hills, spire or cypress
