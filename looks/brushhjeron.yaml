    ANIMATION_GUIDE.md first.
rules:
  - The paint mood changes only at section boundaries, one look and one location per chapter, locations never return
  - "Section looks: scratchboard ink night, sepia worn-film fog, rock-wall painting on sandstone, blazing sunset oil, indigo dream night, silver-grey storm, back to ink on glowing cracks"
  - One character only, drawn with wyrd(); the face never shows behind the black veil; at most one eye, gated by EYE_WINDOWS
  - Guitar strapped high and steep, hunched over it, rocking with the beat, the lean pivots at the boots; fretting arm behind the neck
  - Long tattered duster with wind in most shots; all fire through the shared flameShape()
  - No text on screen, no skeletons; every frame a pure function of song time
  - Stage shots on a 1920x1920 world so 9:16 and 16:9 share every drawing
palette: []
