rules:
  - Only inside device screens (phones, the app, the hold screen); cinema screens stay in the paper hand
  - About 2.5 screen pixels per art pixel, stepped edges
  - 216-colour cube palette through a 4x4 Bayer ordered dither
  - One-pixel outlines in a darker shade of the fill
  - Whole-screen black grounds become dithered indigo gradients, never black
  - Illustrated, as drawn in a 1989 paint program, never ASCII or 8-bit game art
