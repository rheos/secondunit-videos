slug: toon-cards
title: Bean-head cards in an inked world
note: >-
  Flat cartoon cards with round bean heads, dot eyes and stick legs stand in a painted 3D world with ink lines on every
  edge. The camera moves through the world while the cards stay flat, like paper puppets on a model set.
