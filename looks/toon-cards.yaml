slug: toon-cards
title: Toon cards in an inked world
note: >-
  Flat bean-head cartoon people and side-view animals standing in a painted 3D world with black ink lines and real lens
  blur. The camera glides through one place and every line is acted out literally with a prop, down to a stamp on the
  last word.
