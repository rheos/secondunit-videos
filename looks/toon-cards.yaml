code:
  path: bobwiseman-toon-cards/js/
  flag: null
  page: bobwiseman-toon-cards/toon.html
  note: >-
    toon.js draws the cards (from claude-animated-shorts, MIT, with our crown, stetson, straw hat, wig and money sack);
    beasts.js has our cow, chicken and mouse as IK sprites; world.js and paint.js build the world from primitives and
    canvas-painted textures; story.js holds every camera, actor and prop as a pure function of song time; main.js does
    colour, normal and depth, ink, grade and lens. About 70 ms a frame at 720x1280 on the Mac's GPU, so it renders
    locally. The words on the props quote the lyric and stay in gitignored work/words.js.
rules:
  - Characters are flat cards that always face the camera; the world around them is real 3D
  - Ink from normal and depth edges on the world; the cards carry their own outline
  - Sprites and dust write to the normal and depth pass too, or the world's ink draws over them
  - One place and one earthy late-summer palette; frames packed with repeated objects (fields, coins, crowds)
  - Costume detail on the cards (crowns, ermine, epaulettes, sashes) so a small figure still reads
  - Action lands on the sung word; a flight shot chases its object instead of tilting through empty sky
  - No black horizon band; compare depth across neighbours in 1/z
