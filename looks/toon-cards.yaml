  note: >-
    Plain three.js, a pure seek by song time, rendered in headless Chrome at about 70 ms a frame on the Mac's GPU at 720p.
    Cards come from claude-animated-shorts (MIT); the creatures are ours. Prop words that quote a lyric live in gitignored
    work/words.js.
rules:
  - Characters are camera-facing cards with their own plum ink; the world's black ink never outlines them
  - The world is primitives with canvas-painted textures and a hard two-step toon ramp
  - Prefer one continuous camera move; cut only on a jump in place or time, and every hold creeps
  - Blur on close-ups and mediums, focus on the eyes; wides stay sharp
  - Light carries the story from day to golden to dusk
  - Every line is acted literally with a prop, and the reaction lands on its word
  - Herds are side-view sprites with 2-bone IK, cached by pose
  - New story and cast each time; never copy a channel's scripts, characters or shots
