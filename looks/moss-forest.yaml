  note: >-
    js/px.js is the 16bit look's indexed pixel engine, copied unchanged. js/core.js holds the palette (59 base
    colours plus LIGHT, LIGHT2 and FOG blends, 150 entries) and the remap tables; js/forest.js the camera, the
    baked planes, sky, haze, shafts, spores and leaves; js/piano.js the giant (baked cabinet and moss sprites, IK
    legs, clods, mound, dust); js/main.js the frame order and the palette fade. README has the numbers brief.
rules:
  - Draw into an indexed 320x180 buffer and blow it up x4 nearest-neighbour; every element at 1x, whole-pixel positions, no rotation
  - Foliage and moss are ragged clumps lit per pixel from the sun direction plus value noise, quantized to a 4-7 step ramp with a Bayer threshold
  - Many planes, each baked once and blitted at round(camera x rate) - sky 0.05, far 0.12, far-mid 0.25, mid 0.42, clearing 0.6, near 1.0, foreground 1.5
  - Atmosphere is palette remaps by dither - FOG for haze bands (densest at the sun), LIGHT2/LIGHT for shafts fanning from the sun, DARK for shadows
  - One light arc as a palette fade (dim and muted to full warm gold); rim colours switch on in short runs as the sun climbs
  - Backlit - the sun sits behind the subject, front faces stay dark, rims and lid moss catch the light
  - The giant moves in whole poses with feet planted (two-bone IK to fixed floor points, 0 px slide), follow-through on its sapling and hanging moss
