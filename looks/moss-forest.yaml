rules:
  - Background is painted, not drawn - clumps of overlapping brush dabs lit from the sun side, baked once per plane
  - Every plane further back is blurred more and tinted further toward the fog colour (56%, 38%, 20%, 8% on the giant)
  - Bright sky and deep darks - match the reference's measured values (mean luma 130-150, p10 under 65), never pale all over
  - The sun sits behind the subject; shafts read because the air between them is shaded, not because they are bright
  - The creature is a cel - flat tones, one shadow shape, cast shadows, tapered ink lines, a backlit rim, no paint texture
  - Moss is one blanket shape with a scalloped hem and flat patches, never stacks of lit balls
  - The creature moves on twos in whole poses with planted feet; camera and particles run on ones
  - No face on the creature; nothing that reads as teeth or fingers
