rules:
  - Only characters get outlines, in thick dark-brown ink, 5 px on screen at any zoom
  - "Characters are whole poses: big round head, small pear body, tube limbs bending in one curve, mitts, big flat feet; no visible joints"
  - The face does the acting (eye shapes, brows, mouths)
  - "Backgrounds have no outlines: layered gradient shapes, lighter and bluer with distance, light rays, a stepped sun halo, flowers, tufts, ferns"
  - One paper grain and vignette over the whole frame
  - Eased moves with overshoot, ringing impacts, sparkles on surprises, a cartoon dust cloud for scuffles
  - A light arc over the song, dawn to day to dusk to moonlit night to sunrise
