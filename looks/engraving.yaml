rules:
  - Shapes are painted into three tone maps (darkness, hatch angle, form height); a WebGL pass turns them into line engraving
  - Parallel lines whose width carries the tone, cross-hatch in the darks, lines swelling over the form
  - Guilloche rosettes, lettering, features and serials are crisp 2D ink drawn on top in the same camera
  - One currency-green ink plus red-brown serials, on cream security paper with fibres and a watermark
  - Portraits sit in oval vignettes; a numbering machine stamps serials; the note's border bows as he swells
