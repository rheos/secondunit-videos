rules:
  - Ink line (2 to 4 px) over flat greys on cream; hatching for shadow; no gradients except sky
  - "Colour is a story beat: blue only for real sky or a dream of it, rose only for her; everything else grey"
  - >-
    Shader boils the line on twos, lays it on newsprint, crushes colour toward grey (sat .32) and slips the
    red plate a hair
  - >-
    A 1940s office grown into a machine: ducts, hoses, pneumatic tubes, numbered queues; people small and
    identical
  - >-
    Composed like constructivist posters: strong silhouettes, symmetry, big negative space, scale jokes, match
    cuts between shapes
  - Lyrics appear as things in the world (forms, split-flap boards, stamps, ticker tape), never captions
