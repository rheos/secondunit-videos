slug: relief-box
title: Sculpted shadowbox relief
note: >-
  A deep box of sculpted pastel pieces filmed by a slow camera: a doll that splits down the middle, a column of
  small ornaments that stacks up through the gap, plumes, floating islands and a thought bubble on a lead. Every
  piece is cut in tiers so it reads as rounded clay, and casts a soft shadow on what sits behind it.
