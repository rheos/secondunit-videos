slug: relief-box
title: Sculpted shadowbox relief
note: >-
  A deep box of sculpted pastel pieces at dawn, filmed by a camera that slides across it: a sun made of lit
  windows rises over stepped hills, trees bloom rosette by rosette, a train of beads rolls along piping between
  two portholes. Every piece is cut in tiers so it reads as rounded clay, and casts a soft shadow on what sits
  behind it.
