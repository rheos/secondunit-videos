  path: indieagent-cable-and-stub/js/kit.js
  flag: null
  page: indieagent-cable-and-stub/index.html
  note: >-
    kit.js holds the marks (marker fills as stroke bands, one-weight ink, the paper frame mask, faces, the ticket
    stub, and the cable as morphing spline poses); scenes.js the stage and the exteriors; shots.js the thirteen
    one-bar shots. Textures are seeded per element, never per frame, so fills hold still.
rules:
  - One ink line at one weight (5 px at 1080) around every solid object; nothing seen in the distance gets an outline
  - Fills are parallel marker strokes with ragged ends and a little tone variation; stroke direction is the texture (vertical sky, horizontal floor, diagonal hatch on paper things)
  - One highlight per material (a pale band on brass, one white streak on the cable, a lighter underside on a lifted corner); no gradients except pools of light
  - Exteriors inside a ragged paper-frame mask, the same seed for the whole run; interiors full bleed with walls the colour of the paper
  - Faces are two dots and a mouth on the object's flattest plane, four states (calm, worry, shock, happy), readable at 60 px
  - The shape-shifter is one spline morphed between poses (coil, hook, wheel, spring, pole, lasso, line); the drifter only moves and turns
  - Cuts on the bar (2.5 s at 96 BPM), one shot per bar, locked camera; interiors drawn through a 1.25x camera so the objects fill the square
  - IndieAgent red is the only accent (the stub's ADMIT ONE and star, the amp's pilot lamp); one colour arc from night navy to warm stage light
