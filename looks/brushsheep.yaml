rules:
  - "Two layers per frame: an underpainting the GPU repaints with thousands of edge-following brushstrokes, and an additive light layer with bloom"
  - Big clear shapes and value contrast; detail under about 8 px dissolves into paint, flat areas get swirl for free
  - Lamps, eyes, moonlight and sparks go on the light layer; repaint a silhouette in black on it to block light
  - "Paint settings per chapter or shot: boil 6 to 12 re-rolls a second, bloom about 1 to 2, flowK 0.5 to 1.5"
  - Night blues with cream wool; the sheep is a round cloud of wool with a black face and heavy lids
  - No text on screen, no real likeness; short shots (1.2 to 3.5 s), camera always moving, hits on beats and sung words
  - Every frame a pure function of song time, rendered at 24 fps on the song grid
