code:
  path: bobwiseman-10000-miles/render.py
  flag: null
  page: null
  note: >-
    tk/kit.py (toon material, shapes, keying), tk/cast.py (the figures), tk/scenes_*.py (one function per
    portal scene), comp.py (paper, rings, portals, mosaics, outlines; --workers 4), timeline.json (every cue in
    song seconds). The look test is blender-orb-visualizer/rocket_portals.py (lab take 05).
rules:
  - "The anchor never leaves frame centre; it is its own transparent render layer, composited last"
  - "A scene is shown only inside a circle at frame centre; radius keyed per cue, eased; a cobalt ring runs just ahead of it as it opens"
  - "Sound rings pulse out of the anchor on the sung words, every other one dashed; they grow past the frame in 2.6 s and fade"
  - "Keep faces and key action below or beside the frame centre, where the anchor sits"
  - "Toon material: Diffuse, Shader to RGB, three-step EASE ramp, Emission; shadows lean cool; a hot fourth step (gloss) for the plastic figures"
  - "Figures: big head, dot eyes, small smile, snap-on hair cut along a smooth arc, neck peg, trapezoid torso with rounded shoulders and a belt, tube limbs that bend as one curve, mitt hands, square feet"
  - "One dark outer outline per figure, drawn by the compositor from a holdout alpha pass (the Chars collection on its own view layer), grown by a blur, never a pixel kernel; no stair steps anywhere"
  - "A sad face is lids plus a gentle brow tilt and a small downturn, never a flipped smile"
  - "Mosaic: nine square stills per scene, laid in hex rings of 6/12/18/24 cells, flown in from far out, packed inside a sky-blue planet with a cobalt rim"
  - "Scenery carries no outline; cream paper with light blotches and 4.5% grain over everything"
