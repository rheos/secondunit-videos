slug: rocket-portals
title: Toon dioramas in circle portals
note: >-
  One object stays in the middle of the frame for a whole song while small toon-shaded 3D scenes open around it
  as circles on cream paper and close again; on each chorus they pack together into a planet. The people are
  moulded-plastic toy figures with one dark outline.
