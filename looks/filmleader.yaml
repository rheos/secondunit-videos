rules:
  - "Academy-style leader on grey stock: a darker clock-wipe wedge once per number, crosshair, two rings, aperture corner ticks, a big Helvetica numeral, a cue flash on each number's first frame"
  - "Film damage every frame: density flicker, gate weave, wandering white and dark scratches, dust, a hair in the gate, fibres, emulsion flecks, grain"
  - "One place in three framings: the dark cinema with the beam through smoke, the strip in the projector gate, the projected frame"
  - Pictures are small frames of old black-and-white film painted in tone, laid in the leader circle under the wedge and crosshair
  - On each picture word the numeral shrinks and lifts to the top of the ring
  - Black and white only
