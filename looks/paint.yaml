rules:
  - "Scene code draws a flat 960x540 underpainting; the GPU repaints it with instanced brushstrokes that sample its colour and follow its edges"
  - Eyes and mouth go on an unbrushed full-res ink layer so the strokes never dissolve his face; a mask shrinks strokes on the plane
  - Warm cream gesso ground shows in gaps between broad loaded strokes; impasto ridges lit from the upper left
  - "Fauve colour: high key, full chroma, no black (darkest note indigo), shadows violet and ultramarine, lights cadmium lemon"
  - Long horizontal strokes in flat areas and skies (flow bias), no swirl
  - No text anywhere; billboards carry pictures, signs carry shapes
