    pencil and boil in js/hand.js. ?play=1 plays, ?notext=1 for the words-off check, check.mjs is the gate.
rules:
  - The chart's layout comes from pele and its numbers stay true; decoration never moves a node or a band
  - Each node is drawn as an object from the subject's world (ticket stubs on a spindle, a tally post), never a box
  - One warm-black pen; colour only as light coloured pencil under the ink, through the paper's tooth
  - Tone only from hatching that follows the form (along bands, down the fall of a slope, along a board); sky left bare
  - Count marks are the data where they can be (one pen line, one stub, one tally notch per unit)
  - Hand-lettered single-stroke words (Hershey Serif for names, italic for notes), measured for layout; nothing touches
  - Draws itself far to near after a blue construction pencil pass, chart last, words last; the hold boils on twos
