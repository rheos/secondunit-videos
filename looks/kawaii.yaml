rules:
  - >-
    Two layers: flat pastel fills on the paint canvas, black felt-marker outlines on their own ink canvas,
    sharing every transform
  - >-
    The paint becomes a wash on cold-press paper: pigment pools at the drying edge, mottles, granulates,
    blooms into damp paper
  - Ink sits on top, crisp, wobbly, re-drawn on twos, with felt-tip density and tooth skips
  - Boxy characters with kaomoji faces (^ ^ or dot eyes, tiny mouth, blush); nothing ever covers the face
  - "It is a copied style: cross-look face rules (FACE.md) do not apply to kawaii"
  - Music notes for singing, not lettering; pastel palette (kawaii.js PAL), ink
