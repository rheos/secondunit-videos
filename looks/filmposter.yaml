rules:
  - All painting is baked at load with seeded bristle strokes; frames only composite
  - Gouache planes in soft steps, dry-brush edges, paper tooth
  - Landscape posters fill the frame, one saturated flat ground each, a big three-quarter head plus a small full figure
  - Heads are shaded per pixel into a few flat tones with a hard terminator, deep violet shadow, warm edge and reflected light; features crisp on top
  - Hand-brushed capitals on a tilted band, one baseline per word
  - Shots change by pasting, ripping and tearing sheets on a Roman night wall of old bills under a street lamp
