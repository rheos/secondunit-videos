    Camera keys in story.js, town in world.js, render passes in main.js. A seamless 10 s loop; frames from render.mjs, sound
    muxed with ffmpeg. Method from the simcraft perspective-illusion skill (no licence, so ideas only); all code is ours.
rules:
  - The camera never rolls; a level telephoto of about 1.6 degrees reads as a flat drawing
  - Every move holds the framed width while the lens changes, so the subject stays put and the space opens behind it
  - Objects change depth only along the camera's own rays while the view is flat, so the next reveal shows a new arrangement
  - Ink from part edges at a fixed weight; two tones per form; hatching only inside cast shadows, anchored to the world
  - Swing back onto the street axis before pulling out, so no facade crosses the lens
  - Camera keys on the song's beats; flat holds creep so they never read as a freeze
