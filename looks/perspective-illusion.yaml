slug: perspective-illusion
title: Flat to deep street
note: >-
  A winter tour town drawn in clean ink with two-tone shading reads as a flat poster, then the lens widens while the camera
  moves in and the street opens into depth. Road cases that stood in a row turn out to run down the middle of the road.
