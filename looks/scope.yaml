rules:
  - Line only, no fills; scenes emit polylines (screen space or 3D through a camera) that one beam strokes on black
  - Intensity in red = green P31 phosphor, in green = amber phosphor; the tube shader colours, blooms and mixes them
  - Strokes use lighten so crossings don't double; corners and line ends get a brighter dwell dot; each path jitters a hair
  - "Afterglow: the last 9 sub-frames redrawn, each dimmer, as a pure function of t"
  - "Losing sync: the picture tears and rolls, turns amber and collapses into one Lissajous figure, then a single trace"
  - "Tube finish: white-hot cores, halation, dark faceplate glass, etched graticule, bulged rounded-square tube in a metal bezel, mains hum"
