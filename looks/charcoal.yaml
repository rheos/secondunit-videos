rules:
  - Grey newsprint with mottling, pulp grain, fibres and an aged edge; a tooth map where charcoal skips
  - "Two layers take marks with 'darken' so overlaps never pile up: a line layer and a blurred smudge layer"
  - Hand-drawn strokes that boil; side-of-the-stick tone, thumb smudges, rubbed-in masses for the dark
  - Hatched walls; erasing lifts back toward paper but leaves a grey remnant, never clean paper
  - "Palimpsest: the last drawing stays on the sheet as a rubbed-back ghost for about a second after each cut"
  - Greyscale only
