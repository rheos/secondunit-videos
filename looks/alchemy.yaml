rules:
  - Warm cream paper and brown-black copperplate lines; colour sits under the ink as transparent washes whose uneven edges leave paper showing
  - Azure sky, ultramarine and rose robes, gamboge sun, sap-green leaves; no brown vignette, no brown-on-brown grading
  - Figures are cut-outs from real 17th-century engravings with their faces kept; boughs, roots, birds and rays are code-drawn with matching hatching
  - Roots are substantial tapered wood (filled silhouettes, bark hatching, short thick forks) and they visibly join
  - Character poses update on twos; the camera and the wash reveals move every frame
  - Cloud angels hide their trumpets until the brass comes in and play only on the trumpet phrases
  - No doll proportions, locked arms, cartoon vector people or unreadable detail
