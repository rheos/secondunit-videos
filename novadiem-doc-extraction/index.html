    <script>
      // DX.sheet(parent): the 2026-layout statement (synthetic values, no vendor), drawn into a <g> at local
      // coords 0-440 x 0-570. Plate IV draws its own older layout. Returns the parts for cueing and each
      // field's value box (local coords) for highlights, stencils and lifts.
      window.DX = (() => {
        const { el, text } = BP;
        const ADV = 9.9; // 15px Plex Mono advance + 0.06em tracking
        const FIELDS = {
          bill_date: [420, 96, "2026-03-14"],
          due_date: [414, 270, "2026-04-04"],
          total_due: [414, 210, "73.75"],
          unpaid_balance: [414, 240, "12.50"],
          current_charges: [206, 362, "61.25"],
          late_payment_charge: [414, 300, "0.00"],
          device_payment: [204, 232, "12.00"],
          adjustments: [204, 288, "-5.00"],
          usage_charges: [420, 434, "1.40"],
          data_used_mb: [420, 404, "2310.4 MB"],
        };
        const ORDER = Object.keys(FIELDS);
        function box(name) {
          const [x, y, v] = FIELDS[name];
          const w = v.length * ADV + 10;
          return { x: x - w + 5, y: y - 15, w, h: 21, endX: x, baseY: y, value: v };
        }
        function sheet(parent) {
          const P = { rules: [], boxes: [], groups: [], hatch: [] };
          // the sheet is opaque paper, so sheets stacked behind it stay hidden
          P.paper = el("rect", { class: "fill-bg", x: 0, y: 0, width: 440, height: 570, opacity: 0.92 }, parent);
          P.frame = el("rect", { class: "ln ink", x: 0, y: 0, width: 440, height: 570 }, parent);
          const g = (cls) => {
            const n = el("g", cls ? { class: cls } : {}, parent);
            P.groups.push(n);
            return n;
          };
          const t = (str, x, y, cls, p, anchor) => text(str, Object.assign({ class: `sht ${cls || ""}`, x, y }, anchor ? { "text-anchor": anchor } : {}), p);
          const head = g();
          t("MONTHLY STATEMENT", 24, 42, "val", head);
          P.rules.push(el("path", { class: "ln thin ink", d: "M0 62H440" }, parent));
          const id = g();
          t("ACCOUNT ····", 24, 96, "dim", id);
          t("BILL DATE", 218, 96, "dim", id);
          t("2026-03-14", 420, 96, "val", id, "end");
          P.rules.push(el("path", { class: "ln thin ink", d: "M0 116H440" }, parent));
          // charges on the LEFT, summary on the RIGHT (the old layout swaps these)
          P.boxes.push(el("rect", { class: "ln thin ink", x: 16, y: 136, width: 198, height: 190 }, parent));
          P.rules.push(el("path", { class: "ln thin ink", d: "M16 174H214" }, parent));
          const ch = g();
          t("CHARGES", 30, 162, "dim", ch);
          [["PLAN", "52.85", 204], ["DEVICE", "12.00", 232], ["LONG DIST", "1.40", 260], ["CREDIT", "-5.00", 288]].forEach(([a, b, y]) => {
            t(a, 30, y, "", ch);
            t(b, 204, y, "val", ch, "end");
          });
          P.boxes.push(el("rect", { class: "ln thin ink", x: 230, y: 136, width: 194, height: 190 }, parent));
          P.rules.push(el("path", { class: "ln thin ink", d: "M230 174H424" }, parent));
          const su = g();
          t("SUMMARY", 244, 162, "dim", su);
          [["TOTAL DUE", "73.75", 210], ["UNPAID", "12.50", 240], ["DUE", "2026-04-04", 270], ["LATE FEE", "0.00", 300]].forEach(([a, b, y]) => {
            t(a, 244, y, "dim", su);
            t(b, 414, y, "val", su, "end");
          });
          const cu = g();
          t("CURRENT", 24, 362, "dim", cu);
          t("61.25", 206, 362, "val", cu, "end");
          t("DATA USED", 24, 404, "dim", cu);
          t("2310.4 MB", 420, 404, "val", cu, "end");
          t("USAGE", 24, 434, "dim", cu);
          t("LONG DIST 1.40", 420, 434, "val", cu, "end");
          P.rules.push(el("path", { class: "ln thin ink", d: "M0 452H440" }, parent));
          [372, 300, 388, 250].forEach((w, i) => P.hatch.push(el("path", { class: "ln thin ink", d: `M24 ${478 + i * 24}h${w}`, opacity: 0.4 }, parent)));
          return P;
        }
        return { sheet, box, FIELDS, ORDER };
      })();
