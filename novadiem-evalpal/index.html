    <script>
      // EP.card(parent, spec): an instrument definition drawn as a data card, local coords 0-460 x 0-596.
      // Item wording is never shown: each item is a ruled line. Returns the parts for cueing and the
      // card's zones (local coords) for callouts and highlights.
      window.EP = (() => {
        const { el, text } = BP;
        const W = 460,
          H = 596;
        // prisma/instruments/phq9.ts (public domain per the file): structure only
        const PHQ9 = {
          name: "PHQ-9",
          meta: "v1.0 · PUBLIC DOMAIN",
          scale: "FREQUENCY  0–3",
          options: [["0", "Not at all"], ["1", "Several days"], ["2", "More than half the days"], ["3", "Nearly every day"]],
          itemsNote: "9 SCORED + 1",
          items: [1, 1, 1, 1, 1, 1, 1, 1, 1, 0].map((s, i) => ({ n: String(i + 1).padStart(2, "0"), scored: !!s, tag: "" })),
          scoring: "SUM · TOTAL",
          bands: ["0–4", "5–9", "10–14", "15–19", "20–27"],
          safety: "ITEM 09 > 0",
        };
        // a made-up definition: different scale type, reverse items, two subscales
        const EXAMPLE = {
          name: "YOUR INSTRUMENT",
          meta: "EXAMPLE · MADE UP",
          scale: "ORDINAL  1–4",
          options: [["1", "Never"], ["2", "Sometimes"], ["3", "Often"], ["4", "Always"]],
          itemsNote: "8 · 2 SUBSCALES",
          items: ["A", "A", "B", "A  R", "B", "B  R", "A", "B"].map((tag, i) => ({ n: String(i + 1).padStart(2, "0"), scored: true, tag })),
          scoring: "SUM · PER SUBSCALE",
          bands: ["4–7", "8–11", "12–16"],
          safety: "NONE",
        };
        const HATCH = [250, 300, 210, 280, 190, 320, 296, 330, 236, 270];
        const ZONES = {
          scale: [12, 72, 436, 140],
          items: [12, 232, 436, 248],
          scoring: [12, 494, 436, 30],
          bands: [12, 526, 436, 34],
          safety: [12, 562, 436, 26],
        };
        function card(parent, spec) {
          const P = { rules: [], groups: [], items: [] };
          P.paper = el("rect", { class: "fill-bg", x: 0, y: 0, width: W, height: H, opacity: 0.94 }, parent);
          P.frame = el("rect", { class: "ln ink", x: 0, y: 0, width: W, height: H }, parent);
          const g = () => {
            const n = el("g", {}, parent);
            P.groups.push(n);
            return n;
          };
          const t = (str, x, y, cls, p, anchor) => text(str, Object.assign({ class: `sht ${cls || ""}`, x, y }, anchor ? { "text-anchor": anchor } : {}), p);
          const rule = (y) => P.rules.push(el("path", { class: "ln thin ink", d: `M0 ${y}H${W}` }, parent));

          P.head = g();
          t(spec.name, 24, 40, "val", P.head);
          t(spec.meta, 436, 40, "dim tiny", P.head, "end");
          rule(60);

          P.scale = g();
          t("SCALE", 24, 92, "dim", P.scale);
          t(spec.scale, 436, 92, "val", P.scale, "end");
          P.opts = spec.options.map(([v, label], i) => {
            const og = el("g", {}, P.scale);
            t(v, 44, 122 + i * 26, "val", og);
            t(label, 76, 122 + i * 26, "", og);
            return og;
          });
          rule(222);

          P.itemsHead = g();
          t("ITEMS", 24, 252, "dim", P.itemsHead);
          t(spec.itemsNote, 436, 252, "val", P.itemsHead, "end");
          spec.items.forEach((it, i) => {
            const y = 278 + i * 21;
            const row = el("g", {}, parent);
            t(it.n, 44, y, "tiny", row);
            el("path", { class: "ln thin ink", d: `M84 ${y - 5}h${HATCH[i % HATCH.length]}`, opacity: 0.45 }, row);
            if (it.tag) t(it.tag, 436, y, "tiny val", row, "end");
            else if (it.scored) el("circle", { class: "fill-ink", cx: 428, cy: y - 5, r: 4.5 }, row);
            else el("circle", { class: "ln thin ink", cx: 428, cy: y - 5, r: 4.5 }, row);
            P.items.push(row);
          });
          rule(488);

          P.scoring = g();
          t("SCORING", 24, 516, "dim", P.scoring);
          t(spec.scoring, 436, 516, "val", P.scoring, "end");

          P.bands = g();
          t("BANDS", 24, 548, "dim", P.bands);
          const bw = (436 - 128 - (spec.bands.length - 1) * 4) / spec.bands.length;
          P.bandBoxes = spec.bands.map((b, i) => {
            const x = 128 + i * (bw + 4);
            el("rect", { class: "ln thin ink", x, y: 530, width: bw, height: 24 }, P.bands);
            t(b, x + bw / 2, 547, "tiny", P.bands, "middle");
            return x;
          });

          P.safety = g();
          t("SAFETY", 24, 580, "dim", P.safety);
          t(spec.safety, 436, 580, "val", P.safety, "end");
          return P;
        }
        return { card, PHQ9, EXAMPLE, ZONES, W, H };
      })();
