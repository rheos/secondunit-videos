<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b4 {
          position: absolute;
          inset: 0;
        }
        #b4 svg text.nt {
          font-family: var(--font-mono);
          font-size: 16px;
          font-weight: 400;
          letter-spacing: 0.06em;
          fill: var(--ink-field);
        }
        #b4 svg text.nt.val {
          font-weight: 700;
        }
        #b4 svg text.nt.dim {
          opacity: 0.65;
        }
        #b4 svg text.nt.big {
          font-size: 22px;
          font-weight: 700;
          font-family: var(--font-mono);
          letter-spacing: 0.04em;
        }
        #b4 svg text.mono.head {
          font-size: 22px;
        }
        #b4 svg text.mono.gold-t {
          fill: var(--line-field);
        }
        #b4 .statement.two {
          top: 790px;
          flex-direction: column;
          align-items: center;
          font-size: 60px;
          row-gap: 6px;
        }
        #b4 .statement.two .row {
          display: flex;
          column-gap: 0.3em;
        }
      </style>
      <div id="b4" data-composition-id="b4" data-width="1920" data-height="1080">
        <div id="b4-night" class="layer field" data-layout-allow-overlap data-layout-allow-occlusion>
          <svg class="full" viewBox="0 0 1920 1080">
            <defs>
              <pattern id="b4-grid" width="60" height="60" patternUnits="userSpaceOnUse" x="48" y="48">
                <path d="M60 0H0V60" fill="none" stroke="#c9a54a" stroke-width="1" opacity="0.07" />
              </pattern>
            </defs>
            <rect x="48" y="48" width="1824" height="984" fill="url(#b4-grid)" />
            <rect class="ln thin gold-n" x="48" y="48" width="1824" height="984" opacity="0.6" />

            <!-- night copy of the furniture bar: the tick sits at SCORE, sheet 04 / 07 -->
            <g id="b4-bar" data-layout-allow-overlap data-layout-allow-occlusion>
              <path class="ln thin paper-s" d="M260 985H1520" opacity="0.35" />
              <path class="ln gold-n" d="M260 985H1100" />
              <g id="b4-stations"></g>
              <path d="M-9 -14H9L0 0Z" fill="#c9a54a" transform="translate(1100 971)" />
              <rect class="ln thin gold-n" x="1610" y="958" width="230" height="50" />
              <path class="ln thin gold-n" d="M1690 958V1008" opacity="0.6" />
              <text class="mono small" x="1650" y="990" text-anchor="middle">SHEET</text>
              <text class="mono" x="1765" y="991" text-anchor="middle">04 / 07</text>
            </g>

            <!-- the app side and the database side -->
            <path id="b4-div" class="ln gold-n construct" d="M1160 150V720" style="opacity: 0.7" />
            <text id="b4-app" class="mono head" x="150" y="200">APP</text>
            <text id="b4-db" class="mono head" x="1220" y="200">DATABASE</text>

            <!-- the answer -->
            <text id="b4-p-cap" class="nt dim" x="150" y="290">ITEM 01 · THE ANSWER</text>
            <rect id="b4-p-box" class="ln paper-s" x="150" y="306" width="320" height="60" />
            <text id="b4-p-val" class="nt big" x="172" y="344">{"selected": 1}</text>
            <rect id="b4-p-flash" class="ln gold-n" x="144" y="300" width="332" height="72" />
            <text id="b4-p-again" class="nt dim" x="150" y="402">SAME ANSWER, SAVED AGAIN</text>

            <!-- the cipher -->
            <rect id="b4-c-box" class="ln gold-n" x="600" y="286" width="400" height="100" />
            <text id="b4-c-head" class="mono head" x="800" y="332" text-anchor="middle">AES-256-GCM</text>
            <text id="b4-c-sub" class="nt dim" x="800" y="362" text-anchor="middle">node:crypto</text>
            <path id="b4-a1" class="ln paper-s" d="M474 336H596" />

            <!-- a fresh IV on every save -->
            <rect id="b4-iv-box" class="ln paper-s" x="150" y="470" width="420" height="80" />
            <text id="b4-iv-head" class="nt val" x="170" y="500">IV · 12 RANDOM BYTES, EVERY SAVE</text>
            <text id="b4-iv-1" class="nt" x="170" y="532">4c 1e 88 0b 9a f2 31 d7 05 6e a0 c9</text>
            <text id="b4-iv-2" class="nt" x="170" y="532" opacity="0">e3 57 0d 92 6b 1f c4 a8 39 70 2e b6</text>
            <path id="b4-a2" class="ln paper-s" d="M574 510C590 510 590 380 604 380" />

            <!-- the key stays in the app's environment -->
            <rect id="b4-k-box" class="ln paper-s" x="610" y="470" width="380" height="80" />
            <text id="b4-k-head" class="nt val" x="630" y="500">KEY · FROM THE APP ENV</text>
            <text id="b4-k-name" class="nt" x="630" y="532">RESPONSE_ENC_KEYS</text>
            <path id="b4-a3" class="ln paper-s" d="M800 466V390" />

            <!-- into the database: one Response row -->
            <path id="b4-a4" class="ln gold-n" d="M1004 336H1216" />
            <rect id="b4-r-frame" class="ln paper-s" x="1220" y="250" width="540" height="230" />
            <text id="b4-r-head" class="nt val" x="1244" y="284">Response row</text>
            <path id="b4-r-rule" class="ln thin paper-s" d="M1220 302H1760" />
            <g id="b4-r-rows">
              <text class="nt dim" x="1244" y="342">valueCiphertext</text>
              <text class="nt dim" x="1244" y="382">iv</text>
              <text class="nt dim" x="1244" y="422">authTag</text>
              <text class="nt dim" x="1244" y="462">keyVersion</text>
            </g>
            <g id="b4-r-v1">
              <text class="nt val" x="1736" y="342" text-anchor="end">b7 21 9e 4d 03 c8 5a …</text>
              <text class="nt val" x="1736" y="382" text-anchor="end">4c 1e 88 0b 9a f2 …</text>
            </g>
            <g id="b4-r-v2" opacity="0">
              <text class="nt val" x="1736" y="342" text-anchor="end">0f d4 62 b9 e8 17 c3 …</text>
              <text class="nt val" x="1736" y="382" text-anchor="end">e3 57 0d 92 6b 1f …</text>
            </g>
            <g id="b4-r-v0">
              <text class="nt val" x="1736" y="422" text-anchor="end">16 BYTES</text>
              <text class="nt val" x="1736" y="462" text-anchor="end">1</text>
            </g>
            <text id="b4-nokey" class="mono small gold-t" x="1220" y="530">NO KEY ON THIS SIDE</text>
            <text id="b4-new" class="mono small gold-t" x="1220" y="600">SAME ANSWER · NEW IV · NEW CIPHERTEXT</text>
            <text id="b4-tamper" class="mono small gold-t" x="1220" y="640">A CHANGED BYTE WILL NOT DECRYPT</text>
          </svg>
          <div id="b4-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate IV</div>
          <div id="b4-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>At Rest</div>
          <div class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
            <div class="row">
              <span id="b4-st-a" class="phrase">Every answer is</span>
              <span id="b4-st-b" class="phrase red">encrypted</span>
            </div>
            <div class="row">
              <span id="b4-st-c" class="phrase">before it is stored.</span>
            </div>
          </div>
        </div>
        <div id="b4-edge" class="wipe-edge"></div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 37.9);

          // night bar stations (same x as the furniture: 260 + i * 420)
          const st = K.$("b4-stations");
          ["DEFINITION", "FORM", "SCORE", "REPORT"].forEach((s, i) => {
            const x = 260 + i * 420;
            el("path", { class: "ln thin paper-s", d: `M${x} 979V991` }, st);
            text(s, { class: "mono small", x, y: 1014, "text-anchor": "middle" }, st);
          });

          // ---- the plate turns to night from the left (38.13 -> 38.78) ----
          const inA = K.T(38.13),
            inB = K.T(38.78);
          tl.fromTo("#b4-night", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: inB - inA, ease: "power2.inOut" }, inA);
          tl.fromTo("#b4-edge", { x: 0 }, { x: 1918, duration: inB - inA, ease: "power2.inOut" }, inA);
          tl.fromTo("#b4-edge", { opacity: 0 }, { opacity: 1, duration: 0.08 }, inA);
          tl.fromTo("#b4-edge", { opacity: 1 }, { opacity: 0, duration: 0.12, immediateRender: false }, inB - 0.08);
          K.fade(K.$("b4-label-l"), K.T(39.4), 0.4);
          K.fade(K.$("b4-label-r"), K.T(39.4), 0.4);

          // app | database
          K.sweep(K.$("b4-div"), K.T(39.4), 0.5);
          K.fade(K.$("b4-app"), K.T(39.4) + 0.2, 0.3);
          K.fade(K.$("b4-db"), K.T(39.4) + 0.3, 0.3);

          // the answer, the cipher, the IV, the key
          K.fade(K.$("b4-p-cap"), K.T(40.08), 0.3);
          K.draw(K.$("b4-p-box"), K.T(40.08), 0.4, "none");
          K.fade(K.$("b4-p-val"), K.T(40.08) + 0.2, 0.3);
          K.draw(K.$("b4-c-box"), K.T(40.73), 0.5, "none");
          K.fade(K.$("b4-c-head"), K.T(40.73) + 0.2, 0.3);
          K.fade(K.$("b4-c-sub"), K.T(40.73) + 0.35, 0.3);
          K.draw(K.$("b4-a1"), K.T(40.73) + 0.1, 0.3, "none");
          K.draw(K.$("b4-iv-box"), K.T(41.38), 0.4, "none");
          K.fade(K.$("b4-iv-head"), K.T(41.38) + 0.15, 0.3);
          K.fade(K.$("b4-iv-1"), K.T(41.38) + 0.3, 0.3);
          K.draw(K.$("b4-a2"), K.T(41.38) + 0.4, 0.35);
          K.draw(K.$("b4-k-box"), K.T(42.03), 0.4, "none");
          K.fade(K.$("b4-k-head"), K.T(42.03) + 0.15, 0.3);
          K.fade(K.$("b4-k-name"), K.T(42.03) + 0.3, 0.3);
          K.draw(K.$("b4-a3"), K.T(42.03) + 0.4, 0.3, "none");

          // ciphertext crosses into the database
          K.draw(K.$("b4-a4"), K.T(42.68), 0.5, "none");
          K.draw(K.$("b4-r-frame"), K.T(42.68) + 0.3, 0.6, "none");
          K.fade(K.$("b4-r-head"), K.T(43.33), 0.3);
          K.draw(K.$("b4-r-rule"), K.T(43.33), 0.3, "none");
          K.fade(K.$("b4-r-rows"), K.T(43.33) + 0.2, 0.3);
          K.fade(K.$("b4-r-v1"), K.T(43.98), 0.3);
          K.fade(K.$("b4-r-v0"), K.T(43.98) + 0.2, 0.3);

          K.reveal(K.$("b4-st-a"), K.T(44.63), 0.6);
          K.reveal(K.$("b4-st-b"), K.T(45.28), 0.6);
          K.reveal(K.$("b4-st-c"), K.T(45.95), 0.6);
          K.fade(K.$("b4-nokey"), K.T(46.6), 0.4);

          // autosave again: same answer, a new IV, a new ciphertext
          K.draw(K.$("b4-p-flash"), K.T(47.25), 0.4, "none");
          K.fade(K.$("b4-p-again"), K.T(47.25) + 0.2, 0.3);
          tl.set(K.$("b4-iv-1"), { opacity: 0 }, K.T(47.9));
          tl.set(K.$("b4-iv-2"), { opacity: 1 }, K.T(47.9));
          tl.set(K.$("b4-r-v1"), { opacity: 0 }, K.T(47.9) + 0.2);
          tl.set(K.$("b4-r-v2"), { opacity: 1 }, K.T(47.9) + 0.2);
          K.fade(K.$("b4-new"), K.T(48.55), 0.4);
          K.fade(K.$("b4-tamper"), K.T(49.2), 0.4);

          // ---- the cutaway closes onto plate V (51.8 -> 52.45) ----
          const outA = K.T(51.8),
            outB = K.T(52.45);
          tl.fromTo("#b4-night", { clipPath: "inset(0 0 0 0%)" }, { clipPath: "inset(0 0 0 100%)", duration: outB - outA, ease: "power2.inOut", immediateRender: false }, outA);
          tl.fromTo("#b4-edge", { x: 0 }, { x: 1918, duration: outB - outA, ease: "power2.inOut", immediateRender: false }, outA);
          tl.fromTo("#b4-edge", { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, outA);
          tl.fromTo("#b4-edge", { opacity: 1 }, { opacity: 0, duration: 0.12, immediateRender: false }, outB - 0.08);

          window.__timelines["b4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
