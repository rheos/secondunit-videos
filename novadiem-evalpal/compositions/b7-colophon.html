<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b7 {
          position: absolute;
          inset: 0;
        }
        #b7 svg text.mono.faint {
          fill: var(--ink-dim);
          font-weight: 400;
        }
      </style>
      <div id="b7" data-composition-id="b7" data-width="1920" data-height="1080">
        <svg class="full" viewBox="0 0 1920 1080">
          <g id="b7-pipe"></g>
          <text id="b7-site" class="mono" x="960" y="600" text-anchor="middle">evalpal.app · novadiem.com</text>
        </svg>
        <div id="b7-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate VII</div>
        <div id="b7-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>Colophon</div>
        <div class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="row"><span id="b7-st-a" class="phrase">Questions are data.</span></div>
          <div class="row"><span id="b7-st-b" class="phrase red">Answers are encrypted.</span></div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 78);

          K.fade(K.$("b7-label-l"), K.T(78.53), 0.4);
          K.fade(K.$("b7-label-r"), K.T(78.53), 0.4);

          // the four stations, left as construction lines; answers sit encrypted between form and score
          const pipe = K.$("b7-pipe");
          ["DEFINITION", "FORM", "SCORE", "REPORT"].forEach((s, i) => {
            const cx = 420 + i * 360;
            const box = el("rect", { class: "ln line construct", x: cx - 130, y: 330, width: 260, height: 80 }, pipe);
            const lab = text(s, { class: "mono faint", x: cx, y: 377, "text-anchor": "middle" }, pipe);
            const at = K.T(79.2) + i * 0.2;
            K.sweep(box, at, 0.4);
            K.fade(lab, at + 0.2, 0.3, 0.85);
            if (i < 3) {
              const arrow = el("path", { class: "ln line construct", d: `M${cx + 138} 370H${cx + 222}` }, pipe);
              K.sweep(arrow, at + 0.3, 0.25);
            }
          });
          const enc = text("ENCRYPTED AT REST", { class: "mono small gold-t", x: 960, y: 456, "text-anchor": "middle" }, pipe);
          const brk = el("path", { class: "ln thin line-strong", d: "M790 426V434H1130V426" }, pipe);
          K.draw(brk, K.T(79.85) + 0.3, 0.4, "none");
          K.fade(enc, K.T(79.85) + 0.5, 0.3);

          K.reveal(K.$("b7-st-a"), K.T(80.5), 0.6);
          K.reveal(K.$("b7-st-b"), K.T(81.15), 0.8);
          K.fade(K.$("b7-site"), K.T(82.45), 0.5);

          window.__timelines["b7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
