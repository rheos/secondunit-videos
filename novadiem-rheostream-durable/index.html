    <script>
      // JB.table(parent, opts): the core.job table, the film's one device. Columns are the real ones
      // (docs/architecture/intake-and-events.md, § Jobs and the worker); the rows hold synthetic jobs.
      // Returns the parts for cueing, P.cell(r, c, value, cls) to place a value, P.rowY(r) for a row's centre.
      window.JB = (() => {
        const { el, text } = BP;
        const COLS = [["JOB", 170], ["STATE", 230], ["LEASE_OWNER", 250], ["LEASE_UNTIL", 250], ["ATTEMPTS", 180]];
        const W = 1080, HH = 52, RH = 64;
        function table(parent, { x = 420, y = 206, rows = 1, title = "core.job" } = {}) {
          const P = { x, y, W, HH, RH, colX: [], heads: [], rules: [], divs: [] };
          let cx = x;
          COLS.forEach(([, w]) => { P.colX.push(cx); cx += w; });
          const H = HH + rows * RH;
          P.title = title ? text(title, { class: "mono", x, y: y - 20 }, parent) : null;
          P.frame = el("rect", { class: "ln line", x, y, width: W, height: H }, parent);
          P.headRule = el("path", { class: "ln thin line", d: `M${x} ${y + HH}H${x + W}` }, parent);
          COLS.forEach(([n], i) => P.heads.push(text(n, { class: "mono small dim", x: P.colX[i] + 18, y: y + 33 }, parent)));
          for (let r = 1; r < rows; r++) P.rules.push(el("path", { class: "ln thin line", d: `M${x} ${y + HH + r * RH}H${x + W}`, opacity: 0.5 }, parent));
          P.colX.slice(1).forEach((c) => P.divs.push(el("path", { class: "ln thin line", d: `M${c} ${y}V${y + H}`, opacity: 0.35 }, parent)));
          P.cell = (r, c, v, cls) => text(v, { class: `mono cell ${cls || ""}`, x: P.colX[c] + 18, y: y + HH + r * RH + 40 }, parent);
          P.rowY = (r) => y + HH + r * RH + RH / 2;
          P.colMid = (c) => P.colX[c] + COLS[c][1] / 2;
          return P;
        }
        // rule the table in: title, frame, header, dividers, row rules
        function draw(K, P, at) {
          if (P.title) K.fade(P.title, at, 0.35);
          K.draw(P.frame, at, 0.8);
          K.draw(P.headRule, at + 0.3, 0.6, "none");
          P.divs.forEach((d, i) => K.draw(d, at + 0.35 + i * 0.06, 0.4));
          P.heads.forEach((h, i) => K.fade(h, at + 0.45 + i * 0.08, 0.3));
          P.rules.forEach((r, i) => K.draw(r, at + 0.5 + i * 0.1, 0.5, "none"));
        }
        // one row of values, each faded in a beat-fraction apart
        function row(K, P, r, values, at, cls) {
          return values.map((v, c) => {
            const n = P.cell(r, c, v, v === "null" ? "dim" : cls);
            K.fade(n, at + c * 0.08, 0.3);
            return n;
          });
        }
        // swap a cell: the old value goes, the new one lands in its place
        function swap(K, P, oldNode, r, c, v, at, cls) {
          K.out(oldNode, at, 0.2);
          const n = P.cell(r, c, v, v === "null" ? "dim" : cls);
          K.fade(n, at + 0.15, 0.3);
          return n;
        }
        // a box with a centred mono caption
        function box(parent, x, y, w, h, label, cls = "ln line", tcls = "mono") {
          const r = el("rect", { class: cls, x, y, width: w, height: h }, parent);
          const t = label ? text(label, { class: tcls, x: x + w / 2, y: y + h / 2 + 7, "text-anchor": "middle" }, parent) : null;
          return { r, t };
        }
        return { table, draw, row, swap, box, COLS };
      })();
