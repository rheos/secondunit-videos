<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #r6 {
          position: absolute;
          inset: 0;
        }
        #r6 svg text.cl {
          font-family: var(--font-mono);
          font-size: 19px;
          letter-spacing: 0.05em;
          fill: var(--ink);
        }
        #r6 svg text.cl.never {
          fill: var(--ink-dim);
        }
        #r6 .limit {
          position: absolute;
          left: 0;
          right: 0;
          top: 762px;
          text-align: center;
          font-size: 22px;
          color: var(--ink-dim);
        }
      </style>
      <div id="r6" data-composition-id="r6" data-width="1920" data-height="1080">
        <div class="layer">
          <svg class="full" viewBox="0 0 1920 1080">
            <g id="r6-dim"><g id="r6-sb"></g><g id="r6-top"></g></g>
            <g id="r6-cards"></g>
          </svg>
          <div class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate VI</div>
          <div class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>Separate Rooms</div>
          <div id="r6-limit" class="limit mono">A fresh context still misses what nobody wrote down.</div>
          <div id="r6-st" class="statement">
            <span id="r6-st-a" class="phrase">If it matters,</span>
            <span id="r6-st-b" class="phrase red">it has to be written.</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 63.58);
          const P = RT.build(K.$("r6-sb"));
          const top = K.$("r6-top");
          const FEAT = [
            ["feature", "analizer", "1 · 3"],
            ["feature", "architect", "2"],
            ["feature", "challenger", "5 · 9"],
            ["feature", "cleric", "6 · 7"],
            ["feature", "spellwright", "8"],
          ];
          RT.scene(P, top, {
            route: "feature",
            ticket: "feature",
            workflow: "feature",
            files: [[1, "spec.md"], [2, "plan.md"], [3, "prompts.md"]],
            lit: ["feature"],
            lamps: FEAT,
            reticle: [RT.col("challenger").cx, RT.RY(0)],
          });
          // the switchboard steps back
          tl.fromTo(K.$("r6-dim"), { opacity: 1 }, { opacity: 0.12, duration: 0.6, ease: "power1.inOut" }, 0.05);

          // why the jobs are separate: what each one does, and what it never does
          const cards = K.$("r6-cards");
          const CARDS = [
            { x: 250, name: "DELEGATE", glyph: "gate", lines: ["holds the gates", "never grades:", "a fresh cold reviewer", "gives the verdict"] },
            { x: 740, name: "CONDUCTOR", glyph: "reticle", lines: ["dispatches, adjudicates", "never writes the spec,", "the plan or the review:", "it spawns a specialist"] },
            { x: 1230, name: "SPECIALIST", glyph: "room", lines: ["one job, fresh context", "sees its persona file", "and its input files,", "never the conversation"] },
          ];
          const NEVER = [1, 1, 3];
          CARDS.forEach((c, i) => {
            const T0 = [K.T(64.16), K.T(66.5), K.T(68.87)][i];
            const g = el("g", {}, cards);
            const fill = el("rect", { class: "fill-bg", x: c.x, y: 200, width: 440, height: 390 }, g);
            const box = el("rect", { class: "ln ink", x: c.x, y: 200, width: 440, height: 390 }, g);
            const cx = c.x + 220;
            const gl = el("g", {}, g);
            if (c.glyph === "gate") {
              el("circle", { class: "ln ink", cx: cx - 80, cy: 280, r: 7 }, gl);
              el("rect", { class: "ln ink", x: cx - 72, y: 273, width: 150, height: 14 }, gl);
              [0, 1, 2].forEach((k) => el("rect", { class: "fill-ink", x: cx - 58 + k * 46, y: 273, width: 22, height: 14 }, gl));
            } else if (c.glyph === "reticle") {
              el("circle", { class: "ln ink", cx, cy: 280, r: 30 }, gl);
              el("circle", { class: "ln thin ink", cx, cy: 280, r: 22 }, gl);
              el("path", { class: "ln line", d: `M${cx - 44} 280H${cx + 44}M${cx} 236V324` }, gl);
            } else {
              el("rect", { class: "ln ink", x: cx - 50, y: 248, width: 100, height: 64 }, gl);
              el("rect", { class: "ln thin ink", x: cx - 44, y: 254, width: 88, height: 52 }, gl);
              text("CTX", { class: "mono small", x: cx, y: 286, "text-anchor": "middle" }, gl);
            }
            const nm = text(c.name, { class: "mono head", x: cx, y: 378, "text-anchor": "middle" }, g);
            const rule = el("path", { class: "ln thin line", d: `M${c.x + 40} 398H${c.x + 400}` }, g);
            K.fade(fill, T0, 0.4);
            K.draw(box, T0, 0.6, "none");
            K.fade(gl, T0 + 0.3, 0.4);
            K.fade(nm, T0 + 0.4, 0.35);
            K.draw(rule, T0 + 0.5, 0.4);
            c.lines.forEach((ln, j) => {
              const t = text(ln, { class: "cl" + (j >= NEVER[i] ? " never" : ""), x: cx, y: 444 + j * 34, "text-anchor": "middle" }, g);
              K.reveal(t, T0 + 0.7 + j * 0.25, 0.5);
            });
          });

          // the limit: only what is written gets in
          const okP = el("path", { class: "ln ink", d: "M1340 690V612" }, cards);
          const okH = el("path", { class: "ln ink", d: "M1332 622L1340 610L1348 622" }, cards);
          const okL = text("spec.md", { class: "mono small", x: 1340, y: 716, "text-anchor": "middle" }, cards);
          const noP = el("path", { class: "ln ink", d: "M1560 690V630", style: "stroke-dasharray: 8 7" }, cards);
          const noX = el("path", { class: "ln ink", d: "M1548 610L1572 634M1572 610L1548 634" }, cards);
          const noL = text("said only in chat", { class: "mono small dim", x: 1560, y: 716, "text-anchor": "middle" }, cards);
          K.draw(okP, K.T(71.22), 0.5);
          K.draw(okH, K.T(71.22) + 0.45, 0.2);
          K.fade(okL, K.T(71.22), 0.3);
          K.sweep(noP, K.T(71.82), 0.5);
          K.fade(noL, K.T(71.82), 0.3);
          K.draw(noX, K.T(72.4), 0.3);

          K.reveal(K.$("r6-st-a"), K.T(72.98), 0.6);
          K.reveal(K.$("r6-st-b"), K.T(73.56), 0.8);
          K.fade(K.$("r6-limit"), K.T(74.16), 0.5);

          window.__timelines["r6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
