<script>
// The gorilla film, unchanged, drawn to #c; the style's finishing pass prints it to #o. ?style=pinball|riso|woodcut&t=129
const C = document.getElementById('c'), G = C.getContext('2d'), O = document.getElementById('o');
buildTextures(); buildShots();
const present = POST.init(O, C), STEP = POST.step[STYLE];
window.__draw = (t) => {
  const td = Math.floor(t * STEP + 1e-6) / STEP; // the drawing on ones or twos; the print still reseeds per its own clock
  G.save(); G.setTransform(1, 0, 0, 1, 0, 0); G.clearRect(0, 0, W, H); drawFrame(G, td); G.restore();
  present(t);
};
window.__frameJPEG = (t, q) => { window.__draw(t); return O.toDataURL('image/jpeg', q); };
window.__ready = document.fonts.ready.then(() => true);
const qs = new URLSearchParams(location.search);
if (!qs.has('offline')) window.__draw(Number(qs.get('t') || 129));
