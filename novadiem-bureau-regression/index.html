    <script>
      // TW: the one device of this film, a failure travelling into a committed check. The slip is the
      // failure (a typed round-hour stamp); the card is fixture 135, the check it became; the drawer is
      // the standing suite; the gate is the next run's prior-fixture re-run gate. Real case: commits
      // 0e2983c and 5070dee on the Bureau's main branch. The run log and the later edit are ILLUSTRATIVE.
      window.TW = (() => {
        const { el, text } = BP;
        const hidden = (n) => (n.setAttribute("opacity", "0"), n);

        // a document card: paper, frame, a small head and a rule under it
        function card(parent, x, y, w, h, head, o = {}) {
          const C = { g: el("g", {}, parent), x, y, w, h };
          C.paper = el("rect", { class: "fill-bg", x, y, width: w, height: h }, C.g);
          C.frame = el("rect", { class: `ln ${o.cls || "ink"}`, x, y, width: w, height: h }, C.g);
          C.head = text(head, { class: `mono small ${o.headCls || "dim"}`, x: x + 24, y: y + 34 }, C.g);
          if (o.right) C.right = text(o.right, { class: "mono small dim", x: x + w - 24, y: y + 34, "text-anchor": "end" }, C.g);
          C.rule = el("path", { class: "ln thin ink", d: `M${x + 24} ${y + 50}H${x + w - 24}` }, C.g);
          return C;
        }
        function drawCard(K, C, at, dur = 0.7) {
          K.fade(C.paper, at, 0.15);
          K.draw(C.frame, at, dur, "none");
          K.fade(C.head, at + 0.15, 0.3);
          if (C.right) K.fade(C.right, at + 0.25, 0.3);
          K.draw(C.rule, at + 0.25, 0.4);
        }

        // the slip: the failure itself, a torn log line carrying a typed stamp
        function slip(parent, label = "T03:00:00Z") {
          const g = el("g", { "data-layout-allow-overlap": "" }, parent);
          const d = "M-92 -22H92L86 -14L92 -6L86 2L92 10L86 18L92 22H-92Z";
          el("path", { class: "fill-bg", d }, g);
          el("path", { class: "ln accent-s", d, style: "stroke-width:2" }, g);
          text(label, { class: "mono code b red-t", x: 0, y: 7, "text-anchor": "middle" }, g);
          return g;
        }
        // a small fixture card in transit (the 135 card, seen small)
        function chip(parent, label = "135") {
          const g = el("g", {}, parent);
          el("rect", { class: "fill-bg", x: -34, y: -44, width: 68, height: 88 }, g);
          el("rect", { class: "ln ink", x: -34, y: -44, width: 68, height: 88 }, g);
          el("path", { class: "ln thin ink", d: "M-22 -8H22M-22 4H22M-22 16H12" }, g);
          text(label, { class: "mono code b", x: 0, y: -18, "text-anchor": "middle" }, g);
          return g;
        }
        function outAll(tl, nodes, at, dur = 0.35) {
          nodes.forEach((n) => tl.fromTo(n, { opacity: 1 }, { opacity: 0, duration: dur, immediateRender: false }, at));
        }
        // a stamp, tilted
        function stamp(parent, word, cx, cy, w = 220, red = false) {
          const tilt = el("g", { transform: `rotate(-5 ${cx} ${cy})`, "data-layout-allow-overlap": "" }, parent);
          const g = el("g", {}, tilt);
          el("rect", { class: "fill-bg", x: cx - w / 2, y: cy - 30, width: w, height: 60, opacity: 0.94 }, g);
          el("rect", { class: `ln ${red ? "accent-s" : "ink"}`, x: cx - w / 2, y: cy - 30, width: w, height: 60, style: "stroke-width:3" }, g);
          text(word, { class: `stamp-t${red ? " red" : ""}`, x: cx, y: cy + 11, "text-anchor": "middle" }, g);
          return { g, cx, cy };
        }
        function slam(tl, S, at) {
          tl.fromTo(S.g, { opacity: 0, scale: 1.25, svgOrigin: `${S.cx} ${S.cy}` }, { opacity: 1, scale: 1, svgOrigin: `${S.cx} ${S.cy}`, duration: 0.25, ease: "power2.in" }, at);
        }
        const cross = (parent, x, y, s = 12, cls = "accent-s") => el("path", { class: `ln ${cls}`, d: `M${x - s} ${y - s}l${2 * s} ${2 * s}M${x + s} ${y - s}l${-2 * s} ${2 * s}`, style: "stroke-width:3" }, parent);
        const check = (parent, x, y, cls = "line-strong") => el("path", { class: `ln ${cls}`, d: `M${x - 12} ${y}l8 9l16 -20`, style: "stroke-width:3" }, parent);
        const arrow = (parent, x, y, dir = "r", cls = "ink") => {
          const d = { r: `M${x - 12} ${y - 8}L${x} ${y}L${x - 12} ${y + 8}`, d: `M${x - 8} ${y - 12}L${x} ${y}L${x + 8} ${y - 12}`, l: `M${x + 12} ${y - 8}L${x} ${y}L${x + 12} ${y + 8}` }[dir];
          return el("path", { class: `ln ${cls}`, d }, parent);
        };

        return { card, drawCard, slip, chip, outAll, stamp, slam, cross, check, arrow, hidden };
      })();
    </script>
