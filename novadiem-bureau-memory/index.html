    <script>
      // AM: the one device of this film. Above the disk line, the session: context chambers that hold
      // conversation and vanish when the session ends. Below it, the run dir: artifact plates that stay.
      // Each plate (sub-composition) rebuilds the standing parts statically and animates its own events.
      window.AM = (() => {
        const { el, text } = BP;
        // the run dir's artifact plates, left to right (README "Run artifacts"; docs/run-protocol.md)
        const PLATES = { state: [420, "state.json"], log: [690, "log.md"], spec: [960, "spec.md"], plan: [1230, "plan.md"], prompts: [1500, "prompts.md"] };
        // specialists that already ran, each in its own fresh context, and the file each wrote (workflows/feature.md)
        const SPECS = [
          ["ANALIZER 2000", "CTX·01", "spec"],
          ["ARCHITECT", "CTX·02", "plan"],
          ["CHALLENGER", "CTX·03", "log"],
          ["SPELLWRIGHT", "CTX·04", "prompts"],
        ];
        const g = (parent) => el("g", {}, parent);

        function session(parent, n) {
          const S = { g: g(parent) };
          S.frame = el("rect", { class: "ln thin ink", x: 260, y: 136, width: 1400, height: 318 }, S.g);
          S.label = text(`SESSION ${n}`, { class: "mono small", x: 284, y: 168 }, S.g);
          return S;
        }
        function conductor(parent, ctx = "CTX·00") {
          const C = { g: g(parent) };
          C.outer = el("rect", { class: "ln ink", x: 300, y: 190, width: 560, height: 240 }, C.g);
          C.inner = el("rect", { class: "ln thin ink", x: 308, y: 198, width: 544, height: 224 }, C.g);
          C.label = text("CONDUCTOR", { class: "mono", x: 836, y: 228, "text-anchor": "end" }, C.g);
          C.ctx = text(ctx, { class: "mono tiny", x: 326, y: 226, opacity: 0.6 }, C.g);
          return C;
        }
        // the conversation inside a context: short lines, alternating sides like a chat
        function chat(parent) {
          const L = [360, 230, 400, 290, 380, 200];
          return L.map((w, i) => {
            const x = i % 2 ? 470 : 334;
            return el("path", { class: "ln thin ink", d: `M${x} ${250 + i * 22}H${x + Math.min(w, 826 - x)}` }, parent);
          });
        }
        function specialists(parent) {
          return SPECS.map(([name, ctx, file], i) => {
            const x0 = 900 + i * 185,
              cx = x0 + 82.5;
            const R = { g: g(parent), cx, file };
            R.outer = el("rect", { class: "ln ink", x: x0, y: 190, width: 165, height: 240 }, R.g);
            R.inner = el("rect", { class: "ln thin ink", x: x0 + 6, y: 196, width: 153, height: 228 }, R.g);
            R.label = text(name, { class: "mono tiny", x: cx, y: 412, "text-anchor": "middle" }, R.g);
            R.ctx = text(ctx, { class: "mono tiny", x: x0 + 16, y: 224, opacity: 0.6 }, R.g);
            R.check = el("path", { class: "ln line-strong", d: `M${cx - 18} 300l12 12 24 -26` }, R.g);
            R.ended = text("ENDED", { class: "mono tiny dim", x: cx, y: 350, "text-anchor": "middle" }, R.g);
            return R;
          });
        }
        function plate(parent, k) {
          const [cx, name] = PLATES[k];
          const F = { g: g(parent), cx };
          F.body = el("path", { class: "ln line", d: `M${cx - 40} 560H${cx + 22}L${cx + 40} 578V680H${cx - 40}Z` }, F.g);
          F.fold = el("path", { class: "ln thin line", d: `M${cx + 22} 560V578H${cx + 40}` }, F.g);
          F.lines = el("path", { class: "ln thin line", d: `M${cx - 26} 600H${cx + 20}M${cx - 26} 616H${cx + 26}M${cx - 26} 632H${cx + 10}M${cx - 26} 648H${cx + 22}` }, F.g);
          F.label = text(name, { class: "mono small", x: cx, y: 712, "text-anchor": "middle" }, F.g);
          return F;
        }
        // the disk line and the run dir below it; `which` lists the plates already standing
        function disk(parent, which = Object.keys(PLATES)) {
          const D = { g: g(parent), hatch: [], plates: {} };
          D.line = el("path", { class: "ln ink", d: "M220 486H1700" }, D.g);
          D.word = text("DISK", { class: "mono tiny dim", x: 1690, y: 474, "text-anchor": "end" }, D.g);
          for (let x = 232; x <= 280; x += 12) D.hatch.push(el("path", { class: "ln thin ink", d: `M${x} 490l-10 14`, opacity: 0.6 }, D.g));
          for (let x = 1652; x <= 1700; x += 12) D.hatch.push(el("path", { class: "ln thin ink", d: `M${x} 490l-10 14`, opacity: 0.6 }, D.g));
          D.walls = el("path", { class: "ln ink", d: "M260 486V770H1660V486" }, D.g);
          D.label = text("RUN DIR", { class: "mono", x: 284, y: 526 }, D.g);
          D.path = text(".bureau/runs/<date>-<task>/", { class: "mono small dim", x: 392, y: 526 }, D.g);
          which.forEach((k) => (D.plates[k] = plate(D.g, k)));
          return D;
        }
        // what the new Conductor rebuilds from the files, one row per line, inside its chamber
        const READ = [
          ["phase", "prompts · complete"],
          ["done", "analyst · architect"],
          ["", "challenger · prompts"],
          ["next", "challenger, round 2"],
          ["canonical", "prompts.md"],
        ];
        function row(parent, k, v, i) {
          const y = 254 + i * 23;
          return [text(k, { class: "mono tiny dim", x: 332, y }, parent), text(v, { class: "mono small", x: 470, y }, parent)];
        }
        // a sheet of paper in transit, drawn around (0,0)
        function sheet(parent) {
          const t = el("g", { opacity: 0 }, parent);
          el("path", { class: "fill-bg", d: "M-12 -15H5L12 -8V15H-12Z" }, t);
          el("path", { class: "ln line", d: "M-12 -15H5L12 -8V15H-12Z" }, t);
          el("path", { class: "ln thin line", d: "M-6 -4H6M-6 3H6M-6 9H2" }, t);
          return t;
        }
        // cue helpers that need a plate's kit
        function cues(K, tl, top) {
          const carry = (d, at, dur = 0.9) => {
            const s = sheet(top);
            tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.15 }, at);
            K.travel(s, el("path", { d }), at, dur);
            tl.to(s, { opacity: 0, duration: 0.2 }, at + dur);
            return s;
          };
          const fileIn = (f, at) => {
            K.draw(f.body, at, 0.5, "none");
            K.draw(f.fold, at + 0.4, 0.2);
            K.draw(f.lines, at + 0.45, 0.3);
            K.fade(f.label, at + 0.3, 0.3);
          };
          const ghost = (nodes, op = 0.22) => nodes.forEach((n) => n.setAttribute("opacity", op));
          return { carry, fileIn, ghost };
        }
        return { PLATES, SPECS, READ, row, session, conductor, chat, specialists, plate, disk, sheet, cues };
      })();
    </script>
