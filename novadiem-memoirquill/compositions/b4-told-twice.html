<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b4 {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="b4" data-composition-id="b4" data-width="1920" data-height="1080">
        <svg class="full" viewBox="0 0 1920 1080">
          <g id="b4-card" transform="translate(130 150)"></g>
          <path class="ln ink" d="M826 216H840V423H826" />
          <path class="ln thin ink" d="M840 320C860 320 860 265 880 265" />
          <g>
            <rect class="ln ink fill-bg" x="880" y="205" width="320" height="120" />
            <text class="hd" x="900" y="238">FRAGMENT 1</text>
            <text class="tt dim" x="900" y="274">turn_span</text>
            <text class="tt" x="1180" y="274" text-anchor="end">12–15</text>
            <text class="tt" x="900" y="306">Coming of Age</text>
          </g>

          <g id="b4-s2">
            <g id="b4-card2" transform="translate(130 500)"></g>
            <path id="b4-brk2" class="ln ink" d="M826 566H840V623H826" />
            <path id="b4-c3" class="ln thin ink" d="M840 595H880" />
            <g id="b4-frag2">
              <rect class="ln ink fill-bg" x="880" y="540" width="320" height="110" />
              <text class="hd" x="900" y="573">FRAGMENT 2</text>
              <text class="tt dim" x="900" y="609">turn_span</text>
              <text class="tt" x="1180" y="609" text-anchor="end">31</text>
              <text class="tt" x="900" y="637">Coming of Age</text>
            </g>
            <path id="b4-ret" class="ln ink" d="M1040 540V333" />
            <path id="b4-ret-h" class="ln ink" d="M1031 345L1040 331L1049 345" />
            <text id="b4-ret-t" class="key" x="1056" y="446">is_retelling_of</text>
          </g>
          <g id="b4-words"></g>

          <g id="b4-con">
            <path id="b4-c4" class="ln thin ink" d="M1200 265C1255 265 1255 382 1310 382" />
            <path id="b4-c5" class="ln thin ink" d="M1200 595C1255 595 1255 448 1310 448" />
            <rect id="b4-tag-f" class="ln line-strong fill-bg" x="1310" y="330" width="460" height="164" style="stroke-width: 2" />
            <text id="b4-tag-1" class="hd" x="1336" y="368">CONTRADICTION</text>
            <text id="b4-tag-2" class="tt dim" x="1336" y="404">same event, conflicting fact</text>
            <text id="b4-tag-3" class="jval" x="1336" y="442">fourteen  /  thirteen</text>
            <text id="b4-tag-4" class="mono small gold-t" x="1336" y="476">UNRESOLVED · NEITHER DELETED</text>
            <text id="b4-flag" class="mono small" x="1336" y="532">REVIEW FLAG · FOR A PERSON</text>
          </g>
        </svg>
        <div id="b4-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate IV</div>
        <div id="b4-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>Told Twice</div>
        <div class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="row"><span id="b4-st-a" class="phrase">The same story, told again.</span></div>
          <div class="row"><span id="b4-st-b" class="phrase red">Both versions kept.</span></div>
        </div>
      </div>

      <script>
        (() => {
          const { el, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 33.8);
          const C1 = MQ.card(K.$("b4-card"), MQ.S1);

          K.fade(K.$("b4-label-l"), K.T(33.8) + 0.1, 0.4);
          K.fade(K.$("b4-label-r"), K.T(33.8) + 0.1, 0.4);

          // a later session: the same truck, told again
          const C2 = MQ.card(K.$("b4-card2"), MQ.S4);
          K.draw(C2.frame, K.T(35.04), 0.6, "none");
          K.fade(C2.paper, K.T(35.04), 0.3, 0.92);
          [C2.head, C2.lock].forEach((n) => K.fade(n, K.T(35.04) + 0.3, 0.3));
          K.draw(C2.rule, K.T(35.04) + 0.3, 0.3, "none");
          K.fade(C2.rows[0].g, K.T(35.67), 0.4);

          // retelling_detect points the new fragment at the earlier one
          K.draw(K.$("b4-brk2"), K.T(36.92), 0.4, "none");
          K.draw(K.$("b4-c3"), K.T(36.92) + 0.3, 0.2, "none");
          K.fade(K.$("b4-frag2"), K.T(36.92) + 0.4, 0.4);
          K.draw(K.$("b4-ret"), K.T(37.55), 0.6);
          K.fade(K.$("b4-ret-h"), K.T(37.55) + 0.5, 0.2);
          K.fade(K.$("b4-ret-t"), K.T(38.17), 0.4);
          K.reveal(K.$("b4-st-a"), K.T(37.55), 0.7);

          // contradiction_detect: same event, a different fact. Both kept, a person decides.
          const w1 = C1.word(1, 1, MQ.S1.turns[1][2][1].indexOf("fourteen"), 8);
          const w2 = C2.word(0, 1, 0, 8);
          const m1 = el("rect", { class: "ln line-strong", x: 130 + w1.x, y: 150 + w1.y, width: w1.w, height: w1.h, style: "stroke-width: 3" }, K.$("b4-words"));
          const m2 = el("rect", { class: "ln line-strong", x: 130 + w2.x, y: 500 + w2.y, width: w2.w, height: w2.h, style: "stroke-width: 3" }, K.$("b4-words"));
          K.draw(m1, K.T(40.04), 0.35, "none");
          K.draw(m2, K.T(40.67), 0.35, "none");
          K.draw(K.$("b4-c4"), K.T(41.29), 0.4, "none");
          K.draw(K.$("b4-c5"), K.T(41.29), 0.4, "none");
          K.draw(K.$("b4-tag-f"), K.T(41.29) + 0.3, 0.6, "none");
          K.fade(K.$("b4-tag-f"), K.T(41.29) + 0.3, 0.3);
          ["b4-tag-1", "b4-tag-2", "b4-tag-3"].forEach((id, i) => K.fade(K.$(id), K.T(41.91) + i * 0.2, 0.3));
          K.fade(K.$("b4-tag-4"), K.T(42.54), 0.4);
          K.reveal(K.$("b4-st-b"), K.T(42.54), 0.6);
          K.fade(K.$("b4-flag"), K.T(43.79), 0.4);

          // clear to the first card; plate V keeps it
          tl.to("#b4 svg > :not(#b4-card)", { opacity: 0, duration: 0.4, ease: "power1.in" }, K.T(46.3));
          ["b4-label-l", "b4-label-r"].forEach((id) => K.out(K.$(id), K.T(46.3), 0.4));
          tl.to("#b4 .statement", { opacity: 0, duration: 0.4, ease: "power1.in" }, K.T(46.3));

          window.__timelines["b4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
