    <script>
      // MQ: the shared pieces every plate redraws in the same place, so a hand-over between plates is invisible.
      // Everything here is synthetic: a made-up speaker (Nell) and a made-up memory. No real recordings.
      window.MQ = (() => {
        const { el, text } = BP;
        const ADV = 10.88; // 17px Plex Mono advance (0.6em) + 0.04em tracking
        const TX = 170; // text column inside a transcript card
        const W = 690;

        const S1 = {
          title: "SESSION 1 · TRANSCRIPT",
          turns: [
            [12, "INTERVIEWER", ["What was the first thing you ever drove?"]],
            [13, "NELL", ["Oh, the, the grain truck. Dad's truck, out at", "the Birch Creek place. I was fourteen."]],
            [14, "NELL", ["He said, if you can reach the pedals, you can", "haul the barley."]],
            [15, "NELL", ["I put it in the ditch the first day. Twice."]],
          ],
        };
        const S4 = {
          title: "SESSION 4 · TRANSCRIPT",
          turns: [[31, "NELL", ["Did I tell you about Dad's truck? I was", "thirteen. Went straight in the ditch."]]],
        };

        // card(parent, data): a frozen transcript, local coords 0-690 wide. Returns parts and geometry.
        function card(parent, data) {
          const P = { rows: [] };
          let y = 88;
          const layout = data.turns.map(([n, spk, lines]) => {
            const row = { n, spk, lines, base: y, top: y - 22 };
            y += lines.length * 27;
            row.bot = y - 27 + 8;
            y += 14;
            return row;
          });
          P.H = layout[layout.length - 1].bot + 22;
          P.paper = el("rect", { class: "fill-bg", x: 0, y: 0, width: W, height: P.H, opacity: 0.92 }, parent);
          P.frame = el("rect", { class: "ln ink", x: 0, y: 0, width: W, height: P.H }, parent);
          P.head = text(data.title, { class: "hd", x: 20, y: 34 }, parent);
          P.lock = text("WRITE-ONCE", { class: "mono small gold-t", x: W - 20, y: 34, "text-anchor": "end" }, parent);
          P.rule = el("path", { class: "ln thin ink", d: `M0 52H${W}` }, parent);
          layout.forEach((r) => {
            const g = el("g", {}, parent);
            text(String(r.n), { class: "idx", x: 20, y: r.base }, g);
            text(r.spk, { class: "spk", x: 56, y: r.base - 1 }, g);
            r.lines.forEach((ln, i) => text(ln, { class: "tt", x: TX, y: r.base + i * 27 }, g));
            r.g = g;
            P.rows.push(r);
          });
          // box around a run of characters: row r, line l, from char c, len n (local coords)
          P.word = (r, l, c, n) => {
            const row = P.rows[r];
            const b = row.base + l * 27;
            return { x: TX + c * ADV - 4, y: b - 18, w: n * ADV + 8, h: 25, base: b };
          };
          return P;
        }

        // the chapter passage, as prose_draft writes it (one passage, its own words only)
        const PASSAGE = [
          "Her dad's grain truck was the first thing",
          "she ever drove, out at the Birch Creek place.",
          "She was fourteen.",
          "\"If you can reach the pedals, you can haul",
          "the barley,\" he said.",
          "She put it in the ditch the first day. Twice.",
        ];
        // passage(parent): local coords 0-810 x 0-370
        function passage(parent) {
          const P = { lines: [] };
          P.paper = el("rect", { class: "fill-bg", x: 0, y: 0, width: 810, height: 370, opacity: 0.92 }, parent);
          P.frame = el("rect", { class: "ln ink", x: 0, y: 0, width: 810, height: 370 }, parent);
          P.head = text("CHAPTER DRAFT · COMING OF AGE", { class: "hd", x: 30, y: 38 }, parent);
          P.rule = el("path", { class: "ln thin ink", d: "M0 58H810" }, parent);
          PASSAGE.forEach((s, i) => P.lines.push(text(s, { class: "prose", x: 40, y: 104 + i * 40 }, parent)));
          P.foot = el("path", { class: "ln thin ink", d: "M0 330H810" }, parent);
          return P;
        }

        // wave(parent, x0, x1, cy, segs): a speech waveform as vertical bars; segs = [[x0, x1, amp], ...]
        function wave(parent, x0, x1, cy, segs, cls, step = 7) {
          let seed = 17;
          const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
          let d = "";
          for (let x = x0; x <= x1; x += step) {
            const s = segs.find(([a, b]) => x >= a && x <= b);
            const amp = s ? s[2] * (0.25 + 0.75 * rnd()) * Math.sin(Math.PI * Math.min(1, (x - s[0]) / 40, (s[1] - x) / 40) / 2 + 0.0001) : 1.5;
            const h = Math.max(1.5, amp);
            d += `M${x} ${(cy - h).toFixed(1)}V${(cy + h).toFixed(1)}`;
          }
          return el("path", { class: cls, d }, parent);
        }

        return { card, passage, wave, S1, S4, PASSAGE, ADV, TX, W };
      })();
