<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b1 {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="b1" data-composition-id="b1" data-width="1920" data-height="1080">
        <svg class="full" viewBox="0 0 1920 1080">
          <g id="b1-rig" data-layout-allow-overlap data-layout-allow-occlusion></g>
          <!-- the three entry points, as client/README.md imports them -->
          <text id="b1-i1" class="code" x="560" y="440"><tspan class="dim">import</tspan> { FoafAuthClient } <tspan class="dim">from</tspan> <tspan class="blue">'@protocol/foaf-client/auth'</tspan>;</text>
          <text id="b1-i2" class="code" x="560" y="484"><tspan class="dim">import</tspan> { FoafContactsClient } <tspan class="dim">from</tspan> <tspan class="blue">'@protocol/foaf-client/contacts'</tspan>;</text>
          <text id="b1-i3" class="code" x="560" y="528"><tspan class="dim">import</tspan> { FoafLedgerClient } <tspan class="dim">from</tspan> <tspan class="blue">'@protocol/foaf-client/ledger'</tspan>;</text>
          <path id="b1-rule" class="ln line construct" d="M560 572H1360" />
          <text id="b1-tag" class="mono small" x="960" y="636" text-anchor="middle">FOAF-CLIENT · ONE SDK FOR APPS ON FOAF</text>
        </svg>
        <div id="b1-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate I</div>
        <div id="b1-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>What Does One SDK Give Your App?</div>
        <div class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="row"><span id="b1-st-a" class="phrase">Your app needs a login, contacts and a ledger.</span></div>
          <div class="row"><span id="b1-st-b" class="phrase red">What does one SDK give it?</span></div>
        </div>
      </div>

      <script>
        (() => {
          const { kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 0);
          const R = FC.rig(K.$("b1-rig"));

          K.fade(K.$("b1-label-l"), K.T(0.7), 0.4);
          K.fade(K.$("b1-label-r"), K.T(0.7), 0.4);

          // the viewer's app, dashed, then the SDK band and its three modules, then the two FOAF services
          K.sweep(R.app, K.T(1.3), 0.7);
          K.fade(R.appT, K.T(1.3) + 0.4, 0.4);
          K.draw(R.w0, K.T(1.95), 0.4, "none");
          K.draw(R.band, K.T(1.95) + 0.2, 0.9, "none");
          K.fade(R.bandT, K.T(2.55), 0.4);
          ["auth", "contacts", "ledger"].forEach((k, i) => {
            K.draw(R.cells[k], K.T(2.55) + i * 0.3, 0.6);
            K.fade(R.cellT[k], K.T(2.55) + i * 0.3 + 0.3, 0.35);
          });
          K.draw(R.w1, K.T(3.8), 0.6, "none");
          K.draw(R.svcA, K.T(4.4), 0.6, "none");
          K.fade(R.svcAT, K.T(4.4) + 0.3, 0.35);
          K.draw(R.svcL, K.T(4.4) + 0.3, 0.6, "none");
          K.fade(R.svcLT, K.T(4.4) + 0.6, 0.35);

          ["b1-i1", "b1-i2", "b1-i3"].forEach((id, i) => K.reveal(K.$(id), K.T(5.05) + i * 0.32, 0.6));
          K.sweep(K.$("b1-rule"), K.T(6.3), 0.6);
          K.fade(K.$("b1-tag"), K.T(6.3) + 0.3, 0.4);

          K.reveal(K.$("b1-st-a"), K.T(5.7), 0.8);
          K.reveal(K.$("b1-st-b"), K.T(6.95), 0.8);

          // clear down to the rig; plate II redraws it whole at 10.0
          ["b1-i1", "b1-i2", "b1-i3", "b1-rule", "b1-tag", "b1-label-l", "b1-label-r"].forEach((id) => K.out(K.$(id), K.T(9.5), 0.35));
          tl.to("#b1 .statement", { opacity: 0, duration: 0.35, ease: "power1.in" }, K.T(9.5));

          window.__timelines["b1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
