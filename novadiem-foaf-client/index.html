    <script>
      // FC: the one device of the film. Your app (dashed: it's the viewer's, not built), the foaf-client band with its
      // three modules, and the two FOAF services it talks to. Fixed positions across the top of every plate.
      // FC.rig(parent, { active }) draws it; plate I animates it in, later plates redraw it whole and light a module.
      window.FC = (() => {
        const { el, text } = BP;
        const CELLS = [
          ["auth", "AUTH", 580],
          ["contacts", "CONTACTS", 800],
          ["ledger", "LEDGER", 1020],
        ];
        function rig(parent) {
          const R = { cells: {}, cellT: {}, parent };
          R.app = el("rect", { class: "ln planned", x: 160, y: 176, width: 300, height: 128 }, parent);
          R.appT = text("YOUR APP", { class: "mono dim", x: 310, y: 247, "text-anchor": "middle" }, parent);
          R.w0 = el("path", { class: "ln line", d: "M464 240H560" }, parent);
          R.band = el("rect", { class: "ln line", x: 560, y: 160, width: 680, height: 160 }, parent);
          R.bandT = text("FOAF-CLIENT", { class: "mono small gold-t", x: 576, y: 186 }, parent);
          R.under = el("g", {}, parent); // highlight fills sit under the cell lines and labels
          CELLS.forEach(([k, label, x]) => {
            R.cells[k] = el("rect", { class: "ln line", x, y: 198, width: 200, height: 104 }, parent);
            R.cellT[k] = text(label, { class: "mono", x: x + 100, y: 257, "text-anchor": "middle" }, parent);
          });
          R.w1 = el("path", { class: "ln line", d: "M1240 240H1290V194H1340M1290 240V286H1340" }, parent);
          R.svcUnder = el("g", {}, parent);
          R.svcA = el("rect", { class: "ln ink", x: 1340, y: 160, width: 420, height: 68 }, parent);
          R.svcAT = text("auth.foaf.io", { class: "code b", x: 1550, y: 201, "text-anchor": "middle" }, parent);
          R.svcL = el("rect", { class: "ln ink", x: 1340, y: 252, width: 420, height: 68 }, parent);
          R.svcLT = text("api.foaf.io", { class: "code b", x: 1550, y: 293, "text-anchor": "middle" }, parent);
          return R;
        }
        // light(R, key): the module a plate is about. A raised fill under the cell and a heavier edge over it.
        function light(R, key) {
          const x = CELLS.find((c) => c[0] === key)[2];
          const fill = el("rect", { class: "fill-raised", x, y: 198, width: 200, height: 104 }, R.under);
          const edge = el("rect", { class: "ln line-strong", x: x - 6, y: 192, width: 212, height: 116, style: "stroke-width: 3" }, R.parent);
          return { fill, edge };
        }
        // lightSvc(R, which): the same treatment for a FOAF service box ("auth" or "api")
        function lightSvc(R, which) {
          const y = which === "auth" ? 160 : 252;
          const fill = el("rect", { class: "fill-raised", x: 1340, y, width: 420, height: 68 }, R.svcUnder);
          const edge = el("rect", { class: "ln line-strong", x: 1334, y: y - 6, width: 432, height: 80, style: "stroke-width: 3" }, R.parent);
          return { fill, edge };
        }
        // on(K, L, at): bring a light up
        function on(K, L, at) {
          K.fade(L.fill, at, 0.4);
          K.draw(L.edge, at, 0.6, "power2.inOut");
        }
        return { rig, light, lightSvc, on };
      })();
    </script>
