verdict: 'Claude, 2026-11-02 (#387): do not install the plugin, it claims every styled film request and runs its own pipeline. Take vocabulary, rules and a few MIT tools (readcheck.mjs, footage.py, sru.py, final_asr.py). 7 of 66 styles we have, 39 partial, 20 lack. Looks worth building first: archive light table and evidence board (Achbar), marker briefing wall and marker over screen recordings (devweb), a tour as a transit map (IndieAgent), one line in motion (Bob). Demo films are CC BY 4.0, not MIT.'
