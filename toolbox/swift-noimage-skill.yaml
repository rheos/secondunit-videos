how: 'Clone the repo, run its scripts/mv.rb with Homebrew Ruby (`/usr/local/opt/ruby/bin`). Skip ImageMagick by tiling sheets with ffmpeg. Run Demucs with our pinned recipe, not media:stems_local. Example: `bobwiseman-swift-noimage/`.'
cost: free
url: https://github.com/makevoid/motion-graphics-music-video-skill-noimage
detail: 860 frames at 1080p in 36 s at nice 15 with JOBS=5 on the Intel Mac. The renderer crops to --width and --height instead of scaling, so render at scene size and scale down. Output came out 2 frames short of the 862 asked for.
