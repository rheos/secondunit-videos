verdict: 'Recommended by Claude, 2026-11-09: try it on the next look choice for a client song. The board fixes the medium, not the subject, so a client chooses a look without being swayed by which draft had the better scene. Use our own medium names and our own scenes; never his three styles as a set or his San Francisco plates.'
