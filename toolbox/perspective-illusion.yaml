slug: perspective-illusion
name: perspective-illusion (simcraft)
kind: toolkit
status: available
does: A Claude skill plus three.js templates for a looping ink line-art scene that a level telephoto camera squashes flat, then dolly-zooms and swings to corner views so the depth opens up, while objects swap depth unseen during the flat moments.
keywords:
- dolly-zoom
- perspective
- illusion
- telephoto
- loop
- three.js
- line-art
- motion-blur
- flicker
- audit
fits:
- a seamless loop or Canvas for a song (a street or a venue that opens from a flat poster into depth)
- one hero move inside a code-drawn film, as the reveal of a place
- devweb-world style one-camera films, for the flat-to-deep reveal and the blink check
deterministic: yes
how: 'Our own build of the method is bobwiseman-10000-miles-perspective/ (three.js r160, render.mjs, about 0.3 s a frame). The simcraft repo is not installed; it was only read. Pages expose render(ms), probe(ms), setJitter and renderMany; render_fast.mjs averages 4 jittered sub-renders per frame and up to 32 on fast moves, sized from how far probe points move on screen. blink_map.py counts pixels that flicker in near-still frames.'
cost: 'free, but the repo has no licence: ideas and method only, write our own code'
url: https://github.com/dotslashsimran/simcraft/tree/main/skills/video/perspective-illusion
source: x.com/simranrambles/status/2119097166191096197 (Nov 7 2026), a remake of a @garments__ clip; sent by Robin
verdict: 'Recommended by Claude, 2026-11-07: worth one look test. The camera rig is the new part for us: a shot is {x, y, focus plane, framed width, fov}, and holding the framed width while the fov changes is the dolly zoom. Also worth taking anywhere: motion blur sized from probe points, merging static meshes by material (7,654 draw calls to 530), and the blink-map check on finals. No licence, so no templates or cutouts copied; never copy the garments__ artwork.'
related:
- hyperframes
- motion-lab
added: '2026-11-07'
