<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Series kit (tools/blueprint-kit, copied by sync.sh). Theme first, then structure. -->
    <link rel="stylesheet" href="kit/themes/rheo.css" />
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/kit.js"></script>
    <script>
      // Placeholder grid until the score exists: 96 BPM from 0. Then BP.grid({ beats: <beats.json> }).
      BP.grid({ bpm: 96, offset: 0, length: 103 });
    </script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="102.5"
      data-width="1920"
      data-height="1080"
    >
      <!-- Score goes here once generated (score-library drafting-table-rheostream), track 9, the clock for every cue. -->

      <div id="slot-furniture" data-composition-id="furniture" data-composition-src="compositions/furniture.html" data-start="0" data-duration="102.5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="slot-b1" data-composition-id="b1" data-composition-src="compositions/b1-title.html" data-start="0" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="slot-b3" data-composition-id="b3" data-composition-src="compositions/b3-building.html" data-start="20" data-duration="20" data-track-index="3" data-width="1920" data-height="1080"></div>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
