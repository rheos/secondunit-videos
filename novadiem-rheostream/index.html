    <style>
      /* type on the sheets */
      svg text.lab { font-family: var(--font-label); font-size: 22px; font-weight: 500; letter-spacing: 0.14em; fill: var(--line-strong); }
      svg text.lab.sm { font-size: 18px; letter-spacing: 0.12em; }
      svg text.lab.dim { fill: var(--ink-dim); }
      svg text.ty { font-family: var(--font-mono); font-size: 22px; fill: var(--ink); }
      svg text.ty.sm { font-size: 18px; fill: var(--ink-dim); }
      svg text.ty.b { font-weight: 700; }
      svg text.acc { fill: var(--accent); }
      svg text.stamp-t { font-family: var(--font-label); font-size: 22px; font-weight: 700; letter-spacing: 0.14em; fill: var(--accent); }
      svg text.stamp-t.ok { fill: var(--line-strong); }
      .fill-strong { fill: var(--line-strong); }
      .fill-ink { fill: var(--ink); }
      .fill-acc { fill: var(--accent); }
      .acc-s { stroke: var(--accent); }
      .water { fill: var(--line); opacity: 0.16; }
      .solid { fill: var(--bg-raised); }
      .statement { font-size: 66px; top: 812px; }
      .statement.two { top: 772px; flex-direction: column; align-items: center; font-size: 58px; row-gap: 4px; }
      .plate-label { font-weight: 500; }
    </style>
    <script>
      // RS: the film's drawing parts, shared by the plates: hydraulic works drawn in section, and the inquiry,
      // one bright particle that carries every hand-off. Everything shown on screen is made up.
      window.RS = (() => {
        const { el, text } = BP;
        // the inquiry: a bright core and a ring. Moved with x/y (gsap) from its own origin at 0 0.
        function dot(parent) {
          const g = el("g", { opacity: 0 }, parent);
          const halo = el("circle", { class: "fill-strong", cx: 0, cy: 0, r: 22, opacity: 0.18 }, g);
          const ring = el("circle", { class: "ln line-strong", cx: 0, cy: 0, r: 17 }, g);
          const core = el("circle", { class: "fill-ink", cx: 0, cy: 0, r: 9 }, g);
          return { g, halo, ring, core, x: 0, y: 0 };
        }
        // place the dot at (x, y) at time `at` (shown), with an arrival chime when asked
        function put(K, tl, P, x, y, at, o = {}) {
          tl.set(P.g, { x, y }, at);
          if (o.show !== false) tl.fromTo(P.g, { opacity: 0 }, { opacity: 1, duration: o.fade || 0.25, immediateRender: false }, at);
          P.x = x; P.y = y;
          if (o.chime) arrive(K, P, at);
        }
        // ride: straight segments through pts at `speed` px/s; returns the plate time it arrives
        function ride(K, P, pts, at, o = {}) {
          const speed = o.speed || 700;
          let t = at, x = P.x, y = P.y;
          const total = pts.reduce((a, [px, py], i) => a + Math.hypot(px - (i ? pts[i - 1][0] : x), py - (i ? pts[i - 1][1] : y)), 0);
          if (o.sound !== false) K.sfx(o.sound || "water", at, { d: Math.min(3, total / speed) });
          pts.forEach(([px, py], i) => {
            const d = Math.max(0.05, Math.hypot(px - x, py - y) / speed);
            const ease = pts.length === 1 ? "power2.inOut" : i === 0 ? "power1.in" : i === pts.length - 1 ? "power1.out" : "none";
            K.move(P.g, t, d, { x, y }, { x: px, y: py }, { ease });
            t += d; x = px; y = py;
          });
          P.x = x; P.y = y;
          if (o.chime) arrive(K, P, t);
          return t;
        }
        function arrive(K, P, at) {
          K.sfx("chime", at);
          K.move(P.halo, at, 0.5, { scale: 1, opacity: 0.5, svgOrigin: "0 0" }, { scale: 2.6, opacity: 0, svgOrigin: "0 0" }, { ease: "power2.out" });
        }
        // a channel or basin in section: a U of wall, the water body and its surface. Returns parts for drawing.
        function basin(parent, x, y, w, h, o = {}) {
          const g = el("g", {}, parent);
          const lvl = o.level == null ? 0.55 : o.level;
          const wy = y + h * (1 - lvl);
          const water = el("rect", { class: "water", x: x + 2, y: wy, width: w - 4, height: y + h - wy - 2 }, g);
          const wall = el("path", { class: `ln ${o.cls || "line"}`, d: `M${x} ${y}V${y + h}H${x + w}V${y}` }, g);
          const lip = el("path", { class: `ln ${o.cls || "line"}`, d: `M${x - 14} ${y}H${x}M${x + w} ${y}H${x + w + 14}` }, g);
          const surf = el("path", { class: "ln thin line-strong", d: `M${x + 2} ${wy}H${x + w - 2}` }, g);
          return { g, water, wall, lip, surf, x, y, w, h, wy };
        }
        function showBasin(K, B, at, dur = 0.6) {
          K.draw(B.wall, at, dur);
          K.draw(B.lip, at + dur * 0.6, 0.2, "power2.out", false);
          K.fade(B.water, at + dur * 0.5, 0.4, 0.16);
          K.draw(B.surf, at + dur * 0.5, 0.4, "power2.out", false);
          return at + dur;
        }
        // a sluice or lock gate: a plate in a frame. Returns { g, frame, plate }; move plate with y to open
        function gate(parent, x, y, h, o = {}) {
          const g = el("g", {}, parent);
          const frame = el("path", { class: "ln thin line", d: `M${x - 16} ${y - 30}V${y + h}M${x + 16} ${y - 30}V${y + h}M${x - 30} ${y - 30}H${x + 30}` }, g);
          const plate = el("rect", { class: `ln ${o.cls || "line-strong"} solid`, x: x - 10, y, width: 20, height: h }, g);
          return { g, frame, plate };
        }
        // a small house on the works (a mill house, a building), with an optional label under its roof
        function house(parent, x, y, w, h, label, o = {}) {
          const g = el("g", {}, parent);
          const body = el("path", { class: `ln ${o.cls || "line"}`, d: `M${x} ${y + h}V${y + h * 0.32}L${x + w / 2} ${y}L${x + w} ${y + h * 0.32}V${y + h}` }, g);
          const t = label ? text(label, { class: "lab sm", x: x + w / 2, y: y + h * 0.72, "text-anchor": "middle" }, g) : null;
          return { g, body, t };
        }
        // a record card: a header and lines of mono text
        function card(parent, x, y, w, head, lines, o = {}) {
          const g = el("g", {}, parent);
          const h = o.h || 56 + lines.length * 32;
          const bg = el("rect", { class: "solid", x, y, width: w, height: h }, g);
          const box = el("rect", { class: `ln ${o.cls || "line"}`, x, y, width: w, height: h }, g);
          const rule = el("path", { class: "ln thin line", d: `M${x} ${y + 40}H${x + w}` }, g);
          const hd = text(head, { class: "lab sm", x: x + 16, y: y + 28 }, g);
          const ls = lines.map((s, i) => text(s, { class: "ty sm", x: x + 16, y: y + 72 + i * 32 }, g));
          return { g, bg, box, rule, hd, ls, x, y, w, h };
        }
        function showCard(K, C, at, o = {}) {
          K.stamp(C.g, at, { origin: `${C.x + C.w / 2} ${C.y + C.h / 2}`, sound: o.sound || "card", from: 1.2, dur: 0.24 });
          K.draw(C.rule, at + 0.15, 0.3, "power2.out", false);
          let t = K.typed(C.hd, at + 0.2, { cps: o.cps || 40, cursor: false }) + 0.06;
          C.ls.forEach((n) => { t = K.typed(n, t, { cps: o.cps || 44, cursor: false }) + 0.06; });
          return t;
        }
        // a callout: a leader line from a point to a label, the label typed after the line lands
        function callout(parent, x1, y1, x2, y2, label, o = {}) {
          const g = el("g", {}, parent);
          const dotc = el("circle", { class: "fill-strong", cx: x1, cy: y1, r: 5 }, g);
          const line = el("path", { class: "ln thin line-strong", d: `M${x1} ${y1}L${x2} ${y2}H${x2 + (o.left ? -20 : 20)}` }, g);
          const t = text(label, { class: o.cls || "lab sm", x: x2 + (o.left ? -28 : 28), y: y2 + 7, "text-anchor": o.left ? "end" : "start" }, g);
          const sub = o.sub ? text(o.sub, { class: "ty sm", x: x2 + (o.left ? -28 : 28), y: y2 + 36, "text-anchor": o.left ? "end" : "start" }, g) : null;
          return { g, dot: dotc, line, t, sub };
        }
        function showCallout(K, c, at) {
          K.fade(c.dot, at, 0.15);
          K.draw(c.line, at, 0.3, "power2.out", false);
          K.sfx("tick", at);
          let e = K.typed(c.t, at + 0.3, { cps: 34, cursor: false });
          if (c.sub) e = K.typed(c.sub, e + 0.1, { cps: 40, cursor: false });
          return e;
        }
        // an arrowhead pointing r, l, u or d at (x, y)
        function head(parent, x, y, dir, cls) {
          const d = { l: `M${x + 14} ${y - 8}L${x} ${y}L${x + 14} ${y + 8}`, r: `M${x - 14} ${y - 8}L${x} ${y}L${x - 14} ${y + 8}`,
            u: `M${x - 8} ${y + 14}L${x} ${y}L${x + 8} ${y + 14}`, d: `M${x - 8} ${y - 14}L${x} ${y}L${x + 8} ${y - 14}` }[dir];
          return el("path", { class: cls || "ln line-strong", d }, parent);
        }
        // a stamp: a box of text, turned a little (accent unless o.ok)
        function stampBox(parent, label, cx, cy, w, o = {}) {
          const g = el("g", { transform: `rotate(${o.rot == null ? -4 : o.rot} ${cx} ${cy})` }, parent);
          el("rect", { class: "solid", x: cx - w / 2, y: cy - 22, width: w, height: 44 }, g);
          el("rect", { class: `ln ${o.ok ? "line-strong" : "acc-s"}`, x: cx - w / 2, y: cy - 22, width: w, height: 44, style: "stroke-width: 3" }, g);
          text(label, { class: `stamp-t${o.ok ? " ok" : ""}`, x: cx, y: cy + 8, "text-anchor": "middle" }, g);
          return { g, cx, cy };
        }
        const cross = (parent, x, y, s = 16) => el("path", { class: "ln acc-s", d: `M${x - s} ${y - s}L${x + s} ${y + s}M${x + s} ${y - s}L${x - s} ${y + s}`, style: "stroke-width: 3" }, parent);
        const check = (parent, x, y) => el("path", { class: "ln line-strong", d: `M${x - 10} ${y}L${x - 3} ${y + 8}L${x + 12} ${y - 10}`, style: "stroke-width: 3" }, parent);
        return { dot, put, ride, arrive, basin, showBasin, gate, house, card, showCard, callout, showCallout, head, stampBox, cross, check };
      })();
    </script>

  <body>
