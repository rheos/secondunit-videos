<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b4 {
          position: absolute;
          inset: 0;
        }
      </style>
      <div data-hf-id="hf-8nev" id="b4" data-composition-id="b4" data-width="1920" data-height="1080">
        <div data-hf-id="hf-opnj" id="b4-content" class="layer">
          <div data-hf-id="hf-4aya" id="b4-lab-l" class="plate-label left">PLATE IV</div>
          <div data-hf-id="hf-t4bo" id="b4-lab-r" class="plate-label right">ONE DOOR</div>
          <svg data-hf-id="hf-cvdx" id="b4-svg" class="full" viewBox="0 0 1920 1080"></svg>
          <div data-hf-id="hf-mwwv" class="statement">
            <span data-hf-id="hf-9it1" id="b4-s1" class="phrase">Every client.</span>
            <span data-hf-id="hf-sa8c" id="b4-s2" class="phrase accent">One door.</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text } = BP;
          const tl = gsap.timeline({ paused: true });
          const S = 40;
          const K = BP.kit(tl, S);
          const svg = K.$("b4-svg");

          // the building again, small, in elevation: x 240-700
          const X0 = 240,
            X1 = 700,
            G = 700;
          const ground = el("path", { class: "ln line", d: `M150 ${G}H790` }, svg);
          el("rect", { class: "fill-raised", x: X0, y: G, width: X1 - X0, height: 40 }, svg);
          const found = el("rect", { class: "ln line", x: X0, y: G, width: X1 - X0, height: 40 }, svg);
          const core = el("rect", { class: "ln line", x: X0, y: 640, width: X1 - X0, height: 60 }, svg);
          const W = (X1 - X0) / 4;
          const walls = el("path", { class: "ln line", d: `M${X0} 640V440H${X1}V640M${X0 + W} 440V640M${X0 + 2 * W} 440V640M${X0 + 3 * W} 440V640` }, svg);
          const shell = el("rect", { class: "ln line", x: X0, y: 400, width: X1 - X0, height: 40 }, svg);
          const roomT = ["MEMORY", "LEADS", "CURRENT", "PEOPLE"].map((n, i) =>
            text(n, { class: "mono small dim", x: X0 + W * i + W / 2, y: 548, "text-anchor": "middle", style: "font-size:13px" }, svg)
          );

          // the door, in the core's right wall
          const door = el("path", { class: "ln line-strong", d: `M${X1 - 4} 700V650H${X1 + 22}V700` }, svg);
          const doorT = text("MCP", { class: "mono", x: X1 + 34, y: 632 }, svg);
          const doorT2 = text("STREAMABLE HTTP", { class: "mono small dim", x: X1 + 34, y: 612 }, svg);

          // four clients come in from the right; voice is planned
          const END = `${X1 + 24} 676`;
          const LANES = [
            ["CLAUDE.AI  ·  OAUTH", 300, false],
            ["CLAUDE CODE  ·  SESSION MEMORY", 420, false],
            ["TELEGRAM  ·  RHEO BOT", 540, false],
            ["VOICE  ·  PLANNED", 760, true],
          ];
          const lanes = LANES.map(([name, y, planned]) => {
            const path = el("path", { class: planned ? "ln planned" : "ln line", d: `M1740 ${y}C1300 ${y} 1080 676 ${END.replace(" ", " ")}` }, svg);
            const lab = text(name, { class: planned ? "mono small planned-t" : "mono small", x: 1740, y: y - 16, "text-anchor": "end" }, svg);
            let tok = null;
            if (!planned) {
              tok = el("circle", { r: 8, class: "fill-line", opacity: 0, transform: `translate(1740 ${y})` }, svg);
            }
            return { path, lab, tok, planned };
          });

          // inside: one corridor, fanning to every room
          const corridor = el("path", { class: "ln line-strong", d: `M${X1 - 6} 676H${X0 + W / 2}` }, svg);
          const risers = el("path", { class: "ln thin line-strong", d: [0, 1, 2, 3].map((i) => `M${X0 + W * i + W / 2} 676V600`).join("") }, svg);

          K.fade(K.$("b4-lab-l"), K.T(40.68), 0.4);
          K.fade(K.$("b4-lab-r"), K.T(40.68), 0.4);
          K.draw(ground, K.T(40.68), 0.8, "none");
          K.draw(found, K.T(41.31), 0.5);
          K.draw(core, K.T(41.31), 0.6);
          K.draw(walls, K.T(41.91), 0.9);
          K.draw(shell, K.T(42.54), 0.5);
          roomT.forEach((t, i) => K.fade(t, K.T(42.54) + i * 0.1, 0.3));
          K.draw(door, K.T(43.17), 0.5);
          K.fade(doorT, K.T(43.79), 0.35);
          K.fade(doorT2, K.T(43.79) + 0.15, 0.35);
          lanes.forEach((l, i) => {
            const at = K.T(44.42 + i * 0.63);
            if (l.planned) K.sweep(l.path, at, 1.0);
            else K.draw(l.path, at, 1.0, "none");
            K.fade(l.lab, at + 0.3, 0.35);
          });
          lanes
            .filter((l) => l.tok)
            .forEach((l, i) => {
              const at = K.T(46.93 + i * 0.63);
              tl.to(l.tok, { opacity: 1, duration: 0.15 }, at);
              K.travel(l.tok, l.path, at, 1.6);
              tl.to(l.tok, { opacity: 0, duration: 0.2 }, at + 1.55);
            });
          K.draw(corridor, K.T(49.41), 0.7);
          K.draw(risers, K.T(50.04), 0.5);
          K.reveal(K.$("b4-s1"), K.T(50.67), 0.6);
          K.reveal(K.$("b4-s2"), K.T(51.29), 0.6);

          K.out(K.$("b4-content"), K.R(54.43), 0.45);
          window.__timelines["b4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
