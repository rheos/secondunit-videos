<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b5 {
          position: absolute;
          inset: 0;
        }
        /* the light drafting sheet, laid on the board inside the plate border; the bar stays visible */
        #b5-sheet {
          position: absolute;
          left: 140px;
          top: 130px;
          width: 1640px;
          height: 800px;
          background: var(--field);
        }
        #b5-field {
          background: transparent;
        }
        #b5 .statement {
          top: 806px;
        }
        #b5 svg text.acc {
          fill: var(--accent-field);
        }
      </style>
      <div data-hf-id="hf-rbut" id="b5" data-composition-id="b5" data-width="1920" data-height="1080">
        <div data-hf-id="hf-m046" id="b5-labels" class="layer">
          <div data-hf-id="hf-awva" id="b5-lab-l" class="plate-label left">PLATE V</div>
          <div data-hf-id="hf-f2t9" id="b5-lab-r" class="plate-label right">DURABLE WORK</div>
        </div>
        <div data-hf-id="hf-j4rd" id="b5-field" class="layer field">
          <div data-hf-id="hf-cjc4" id="b5-sheet"></div>
          <svg data-hf-id="hf-52yk" id="b5-svg" class="full" viewBox="0 0 1920 1080"></svg>
          <div data-hf-id="hf-mwwv" class="statement">
            <span data-hf-id="hf-o5at" id="b5-s1" class="phrase">Nothing lost</span>
            <span data-hf-id="hf-o4nb" id="b5-s2" class="phrase accent">mid-job.</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text } = BP;
          const tl = gsap.timeline({ paused: true });
          const S = 55;
          const K = BP.kit(tl, S);
          const svg = K.$("b5-svg");
          const L = "ln line-field";

          // sheet border, a drafting sheet's own inner frame
          const sheetLine = el("rect", { class: "ln thin line-field", x: 160, y: 150, width: 1600, height: 760 }, svg);

          // left: the job lane and two workers
          const jobsT = text("JOBS", { class: "mono", x: 220, y: 214 }, svg);
          const cards = [0, 1, 2, 3, 4].map((i) => {
            const x = 220 + i * 140;
            const r = el("rect", { class: L, x, y: 240, width: 120, height: 70 }, svg);
            const t = text(`JOB ${i + 1}`, { class: "mono small", x: x + 60, y: 282, "text-anchor": "middle" }, svg);
            return { r, t, x };
          });
          const cx2 = cards[1].x + 60;

          const wa = el("rect", { class: L, x: 280, y: 430, width: 200, height: 80 }, svg);
          const waT = text("WORKER A", { class: "mono", x: 380, y: 477, "text-anchor": "middle" }, svg);
          const leaseA = el("path", { class: L, d: `M380 430L${cx2} 312` }, svg);
          const leaseAT = text("LEASE  ·  SKIP LOCKED", { class: "mono small", x: 428, y: 380 }, svg);
          const crash = el("path", { class: "ln accent-s", d: "M292 502L326 488L352 505L390 486L420 503L468 490", style: "stroke: var(--accent-field)" }, svg);
          const crashT = text("PROCESS DIES", { class: "mono small acc", x: 380, y: 540, "text-anchor": "middle" }, svg);

          // the lease clock
          const dial = el("circle", { class: L, cx: 640, cy: 470, r: 40 }, svg);
          const dialTicks = el("path", { class: "ln thin line-field", d: "M640 430v8M680 470h-8M640 510v-8M600 470h8" }, svg);
          const hand = el("path", { class: L, d: "M640 470V440" }, svg);
          const dialT = text("LEASE EXPIRES", { class: "mono small", x: 640, y: 540, "text-anchor": "middle" }, svg);

          const wb = el("rect", { class: L, x: 780, y: 430, width: 200, height: 80 }, svg);
          const wbT = text("WORKER B", { class: "mono", x: 880, y: 477, "text-anchor": "middle" }, svg);
          const leaseB = el("path", { class: L, d: `M880 430L${cx2 + 20} 312` }, svg);
          const done = el("path", { class: "ln", d: `M${cx2 + 34} 256l8 8l16 -18`, style: "stroke: var(--line-field); stroke-width: 3" }, svg);
          const noteT = text("A WORKER WHOSE LEASE EXPIRED CANNOT COMMIT", { class: "mono small", x: 220, y: 600 }, svg);

          // right: state change and its event in one transaction
          const txOuter = el("rect", { class: L, x: 1100, y: 220, width: 400, height: 250 }, svg);
          const txInner = el("rect", { class: "ln thin line-field", x: 1108, y: 228, width: 384, height: 234 }, svg);
          const txT = text("ONE TRANSACTION", { class: "mono", x: 1300, y: 206, "text-anchor": "middle" }, svg);
          const st = el("rect", { class: L, x: 1140, y: 262, width: 320, height: 64 }, svg);
          const stT = text("STATE CHANGE", { class: "mono", x: 1300, y: 300, "text-anchor": "middle" }, svg);
          const ob = el("rect", { class: L, x: 1140, y: 362, width: 320, height: 64 }, svg);
          const obT = text("OUTBOX EVENT", { class: "mono", x: 1300, y: 400, "text-anchor": "middle" }, svg);
          const arrow = el("path", { class: L, d: "M1460 394H1560M1560 394L1610 300M1560 394H1610M1560 394L1610 488" }, svg);
          const cons = [300, 394, 488].map((y) => el("rect", { class: L, x: 1610, y: y - 22, width: 110, height: 44 }, svg));
          const consT = [300, 394, 488].map((y) => text("CONSUMER", { class: "mono small", x: 1665, y: y + 6, "text-anchor": "middle", style: "font-size:13px" }, svg));
          const dedupT = text("DEDUPLICATED", { class: "mono small", x: 1665, y: 545, "text-anchor": "middle" }, svg);

          const foot = text("EVERY MUTATING CALL HAS AN AUDIT PATH, OR THE SERVICE WON'T START", { class: "mono small", x: 960, y: 690, "text-anchor": "middle" }, svg);
          const footRule = el("path", { class: "ln thin line-field", d: "M420 660H1500", opacity: 0.6 }, svg);

          // cues
          K.reveal(K.$("b5-sheet"), K.T(55.05), 0.63);
          K.fade(K.$("b5-lab-l"), K.T(55.05), 0.4);
          K.fade(K.$("b5-lab-r"), K.T(55.05), 0.4);
          K.draw(sheetLine, K.T(55.68), 0.9, "none");
          K.fade(jobsT, K.T(56.29), 0.35);
          cards.forEach((c, i) => {
            K.draw(c.r, K.T(56.29) + 0.3 + i * 0.15, 0.4);
            K.fade(c.t, K.T(56.29) + 0.5 + i * 0.15, 0.3);
          });
          K.draw(wa, K.T(57.54), 0.5);
          K.fade(waT, K.T(57.54) + 0.3, 0.3);
          K.draw(leaseA, K.T(58.19), 0.5);
          K.fade(leaseAT, K.T(58.82), 0.35);
          tl.to(cards[1].r, { strokeWidth: 3, duration: 0.2 }, K.T(58.82));
          K.draw(crash, K.T(59.42), 0.3, "none");
          K.fade(crashT, K.T(60.05), 0.3);
          tl.to([wa, waT, leaseA], { opacity: 0.35, duration: 0.4 }, K.T(60.05));
          K.draw(dial, K.T(60.67), 0.5);
          K.fade(dialTicks, K.T(60.67) + 0.3, 0.3);
          K.fade(hand, K.T(60.67) + 0.3, 0.2);
          tl.fromTo(hand, { rotation: 0, svgOrigin: "640 470" }, { rotation: 360, svgOrigin: "640 470", duration: 1.8, ease: "none" }, K.T(60.67) + 0.4);
          K.fade(dialT, K.T(61.93), 0.35);
          tl.to(leaseA, { opacity: 0, duration: 0.3 }, K.T(61.93));
          K.draw(wb, K.T(62.55), 0.5);
          K.fade(wbT, K.T(62.55) + 0.3, 0.3);
          K.draw(leaseB, K.T(63.18), 0.5);
          K.draw(done, K.T(64.44), 0.4);
          K.fade(noteT, K.T(65.04), 0.4);
          K.draw(txOuter, K.T(65.67), 0.6);
          K.draw(txInner, K.T(65.67) + 0.2, 0.6);
          K.fade(txT, K.T(65.67) + 0.4, 0.3);
          K.draw(st, K.T(66.29), 0.45);
          K.fade(stT, K.T(66.29) + 0.25, 0.3);
          K.draw(ob, K.T(66.92), 0.45);
          K.fade(obT, K.T(66.92) + 0.25, 0.3);
          K.draw(arrow, K.T(67.55), 0.6);
          cons.forEach((c, i) => K.draw(c, K.T(68.17) + i * 0.15, 0.35));
          consT.forEach((t, i) => K.fade(t, K.T(68.17) + 0.2 + i * 0.15, 0.3));
          K.fade(dedupT, K.T(68.8), 0.35);
          K.draw(footRule, K.T(69.43), 0.6, "none");
          K.fade(foot, K.T(69.43) + 0.2, 0.4);
          K.reveal(K.$("b5-s1"), K.T(70.05), 0.6);
          K.reveal(K.$("b5-s2"), K.T(70.68), 0.6);

          K.out(K.$("b5-field"), K.R(74.43), 0.45);
          K.out(K.$("b5-labels"), K.R(74.43), 0.45);
          window.__timelines["b5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
