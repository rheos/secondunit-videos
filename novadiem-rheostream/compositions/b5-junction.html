<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b5 { position: absolute; inset: 0; }
      </style>
      <div data-hf-id="hf-rs60" id="b5" data-composition-id="b5" data-width="1920" data-height="1080">
        <div data-hf-id="hf-rs61" id="b5-content" class="layer">
          <div data-hf-id="hf-rs62" id="b5-lab-l" class="plate-label left">FIG. V</div>
          <div data-hf-id="hf-rs63" id="b5-lab-r" class="plate-label right">THE JUNCTION</div>
          <svg data-hf-id="hf-rs64" id="b5-svg" class="full" viewBox="0 0 1920 1080"></svg>
          <div data-hf-id="hf-rs65" class="statement">
            <span data-hf-id="hf-rs66" id="b5-s1" class="phrase">A wrong match is</span>
            <span data-hf-id="hf-rs67" id="b5-s2" class="phrase accent">a privacy event.</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text } = BP;
          const tl = gsap.timeline({ paused: true });
          const S = 69.58;
          const K = BP.kit(tl, S, "V");
          const R = (t) => K.R(t);
          const W = (w, n) => R(VO.w("V", w, n));
          const svg = K.$("b5-svg");

          // the inquiry's channel, running on; a branch up to an existing party's channel, with a gate in it
          const main = el("path", { class: "ln line-strong", d: "M60 420H790M850 420H1872M60 480H1872" }, svg);
          const mainW = el("rect", { class: "water", x: 60, y: 440, width: 1812, height: 39 }, svg);
          const branch = el("path", { class: "ln line", d: "M790 420V300M850 420V300" }, svg);
          const party = el("path", { class: "ln line", d: "M790 300V240H1700M850 300H1700" }, svg);
          const partyW = el("rect", { class: "water", x: 792, y: 262, width: 908, height: 37 }, svg);
          const partyT = text("A PARTY ON RECORD: AVERY LUND", { class: "lab sm", x: 880, y: 220 }, svg);
          const hist = [960, 1140, 1320].map((x) => el("rect", { class: "ln line solid", x, y: 266, width: 140, height: 28 }, svg));
          const histT = text("THEIR HISTORY", { class: "ty sm", x: 1490, y: 287 }, svg);
          const gate = el("rect", { class: "ln line-strong solid", x: 782, y: 352, width: 76, height: 16 }, svg);
          const rule1 = text("OPENS ONLY ON EVIDENCE", { class: "lab sm", x: 880, y: 352 }, svg);
          const rule2 = text("A CONNECTION PROVED", { class: "lab sm", x: 880, y: 382 }, svg);
          // what came in: a name and an address, nothing proved
          const tag = RS.card(svg, 110, 540, 400, "THE INQUIRY", ["Avery Lund", "avery@lund.example"]);
          const tagLine = el("path", { class: "ln thin line", d: "M310 540V476" }, svg);
          const eq = text("SAME NAME", { class: "lab sm", x: 600, y: 300, "text-anchor": "middle" }, svg);
          const eqLine = el("path", { class: "ln thin line-strong", d: "M440 560C560 520 560 300 880 228" }, svg);
          const review = RS.card(svg, 110, 150, 470, "A QUESTION FOR YOU", ["same name, no evidence", "same person? you decide"], { cls: "line-strong" });
          const notT = text("NOT AN ANSWER", { class: "lab sm dim", x: 345, y: 336, "text-anchor": "middle" }, svg);
          // the wrong match: their history pouring into this lead
          const xx = RS.cross(svg, 820, 400, 18);
          const leak = text("ONE PERSON'S HISTORY, SHOWN TO ANOTHER", { class: "lab sm acc", x: 880, y: 530 }, svg);
          // a merge is an alias: a stop log that lifts out
          const inset = el("path", { class: "ln line", d: "M1190 600H1440M1190 680H1440M1500 600H1750M1500 680H1750" }, svg);
          const insetW = el("rect", { class: "water", x: 1190, y: 625, width: 560, height: 54 }, svg);
          const log = el("rect", { class: "ln line-strong solid", x: 1452, y: 588, width: 36, height: 104 }, svg);
          const aliasT = text("A MERGE IS AN ALIAS", { class: "lab sm", x: 1190, y: 576 }, svg);
          const undoT = text("LIFT IT OUT: UNDONE", { class: "lab sm", x: 1750, y: 722, "text-anchor": "end" }, svg);
          const P = RS.dot(svg);

          // the inquiry rides in from plate IV
          K.draw(main, R(69.7), 0.8, "power1.out");
          K.fade(mainW, R(70.0), 0.5, 0.16);
          RS.put(K, tl, P, -30, 450, R(70.1), { fade: 0.1 });
          RS.ride(K, P, [[700, 450]], R(70.2), { speed: 1100, chime: true });
          K.fade(K.$("b5-lab-l"), R(70.4), 0.4);
          K.fade(K.$("b5-lab-r"), R(70.4), 0.4);
          // "who sent it?"
          K.draw(tagLine, W("sent") - 0.2, 0.2, "power2.out", false);
          RS.showCard(K, tag, W("sent"), { cps: 50 });
          // "links a person only on evidence a connection proved"
          K.draw(branch, W("rio"), 0.4);
          K.draw(party, W("rio") + 0.3, 0.8);
          K.fade(partyW, W("rio") + 0.6, 0.5, 0.16);
          K.typed(partyT, W("links"), { cps: 46, cursor: false });
          hist.forEach((h, i) => K.stamp(h, W("person") + i * 0.12, { origin: `${1030 + i * 180} 280`, sound: "card", from: 1.3 }));
          K.typed(histT, W("person") + 0.4, { cps: 40, cursor: false });
          K.move(gate, W("only") - 0.1, 0.3, { opacity: 0, y: -40 }, { opacity: 1, y: 0 }, { ease: "power3.in" });
          K.sfx("gate", W("only") + 0.2);
          K.typed(rule1, W("evidence") - 0.1, { cps: 40, cursor: false });
          K.typed(rule2, W("connection"), { cps: 40, cursor: false });
          // "a matching name is a question for you, not an answer"
          K.draw(eqLine, W("matching") - 0.1, 0.6);
          K.typed(eq, W("name"), { cps: 34, cursor: false });
          RS.showCard(K, review, W("question") - 0.1, { cps: 54 });
          K.typed(notT, W("answer") - 0.1, { cps: 34, cursor: false });
          // "because a wrong match shows one person's history to another"
          hist.forEach((h, i) => K.move(h, W("wrong") + i * 0.1, 0.8, { x: 0, y: 0 }, { x: [-100, -230, -360][i], y: 0 }, { ease: "power2.inOut", sound: i ? undefined : "slide" }));
          K.stamp(xx, W("shows"), { origin: "820 400", from: 2 });
          K.typed(leak, W("person's") - 0.1, { cps: 44, cursor: false });
          K.slam(K.$("b5-s1"), W("history") - 0.1, { stagger: 0.035 });
          K.slam(K.$("b5-s2"), W("another") + 0.1, { stagger: 0.04 });
          hist.forEach((h, i) => tl.fromTo(h, { x: [-100, -230, -360][i], y: 0 }, { x: 0, y: 0, duration: 0.6, ease: "power2.inOut", immediateRender: false }, W("another") + 0.5 + i * 0.08));
          // "and every merge can be undone"
          K.draw(inset, W("and") - 0.2, 0.5);
          K.fade(insetW, W("and"), 0.4, 0.16);
          K.move(log, W("every"), 0.3, { opacity: 0, y: -60 }, { opacity: 1, y: 0 }, { ease: "power3.in" });
          K.sfx("gate", W("every") + 0.3);
          K.typed(aliasT, W("merge") - 0.1, { cps: 40, cursor: false });
          tl.fromTo(log, { y: 0 }, { y: -90, duration: 0.45, ease: "power2.out", immediateRender: false }, W("undone") - 0.1);
          K.sfx("valve", W("undone") - 0.1, { d: 0.5 });
          K.typed(undoT, W("undone") - 0.3, { cps: 50, cursor: false });

          // hand-off: the inquiry runs on along its own channel, to plate VI's door
          RS.ride(K, P, [[1880, 450]], R(85.8), { speed: 1500 });
          K.out(K.$("b5-content"), R(86.0), 0.45);
          window.__timelines["b5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
