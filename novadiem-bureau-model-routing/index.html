    <script>
      // CB: the one device of this film, a casting board. Each row is a Bureau role, each column one
      // choice made for it per run. Values are the docs' own (docs/model-routing-and-cast.md,
      // config/model-policy.v2.json, config/runtimes/claude.json and openai.json on origin/main).
      window.CB = (() => {
        const { el, text } = BP;
        const ROLES = [
          ["THE CONDUCTOR", "runs the workflow"],
          ["ANALIZER 2000", "requirements"],
          ["THE SPELLWRIGHT", "writes build prompts"],
          ["THE ARCHITECT", "design"],
          ["THE CHALLENGER", "cold review"],
          ["SCOOT", "one-line look-ups"],
          ["THE COUNSELOR", "voice and copy"],
        ];
        // config/model-policy.v2.json roles.<role>.default_tier and fresh_context_required
        const TIER = ["strong", "standard", "standard", "strong", "strong", "cheap", "frontier"];
        const FRESH = [false, true, true, true, true, true, true];
        // config/runtimes/claude.json and openai.json: tier -> model (+ reasoning effort on Codex)
        const CLAUDE = { cheap: "haiku", standard: "sonnet", strong: "opus", frontier: "fable", escalated: "fable" };
        const OPENAI = {
          cheap: ["gpt-5.6-terra", "low"],
          standard: ["gpt-5.6-terra", "medium"],
          strong: ["gpt-5.6-sol", "high"],
          frontier: ["gpt-5.6-sol", "xhigh"],
          escalated: ["gpt-6-astra", "max"],
        };
        const COLS = {
          role: { x: 150, w: 310, h: "ROLE" },
          tier: { x: 460, w: 210, h: "TIER" },
          model: { x: 670, w: 260, h: "MODEL" },
          effort: { x: 930, w: 180, h: "EFFORT" },
          host: { x: 1110, w: 180, h: "HOST" },
          fresh: { x: 1290, w: 180, h: "FRESH CONTEXT" },
        };
        const X0 = 150, X1 = 1470, HY = 186, Y0 = 240, RH = 76;
        const rowTop = (r) => Y0 + r * RH;
        const rowMid = (r) => Y0 + r * RH + RH / 2;

        // board(parent) -> B: the frame, headers, rules and role names. Cells are added with B.cell().
        function board(parent) {
          const B = { g: el("g", {}, parent) };
          B.hl = el("g", {}, B.g); // highlight layer, under everything
          B.paper = el("rect", { class: "fill-bg", x: X0, y: HY, width: X1 - X0, height: rowTop(7) - HY }, B.g);
          B.frame = el("rect", { class: "ln ink", x: X0, y: HY, width: X1 - X0, height: rowTop(7) - HY }, B.g);
          B.headRule = el("path", { class: "ln ink", d: `M${X0} ${Y0}H${X1}` }, B.g);
          B.rules = [];
          for (let r = 1; r < 7; r++) B.rules.push(el("path", { class: "ln thin ink", d: `M${X0} ${rowTop(r)}H${X1}`, style: "opacity:0.45" }, B.g));
          B.colRules = [];
          Object.values(COLS).slice(1).forEach((c) => B.colRules.push(el("path", { class: "ln thin ink", d: `M${c.x} ${HY}V${rowTop(7)}`, style: "opacity:0.45" }, B.g)));
          B.heads = {};
          for (const k in COLS) B.heads[k] = text(COLS[k].h, { class: "mono head", x: COLS[k].x + 18, y: HY + 34 }, B.g);
          B.names = ROLES.map(([n, j], r) => {
            const g = el("g", {}, B.g);
            text(n, { class: "mono", x: X0 + 22, y: rowMid(r) - 3 }, g);
            text(j, { class: "mono small dim", x: X0 + 22, y: rowMid(r) + 21 }, g);
            return g;
          });
          B.cells = {};
          B.layer = el("g", {}, B.g); // cell values on top
          return B;
        }
        // a cell value: B.cell(r, col, str, cls) -> text node
        function cell(B, r, col, str, cls = "") {
          return text(str, { class: `mono cellv ${cls}`, x: COLS[col].x + 22, y: rowMid(r) + 8 }, B.layer);
        }
        // a yes / no mark in the fresh-context column
        function freshMark(B, r, yes) {
          const x = COLS.fresh.x + 40, y = rowMid(r);
          if (yes) return el("path", { class: "ln ink", d: `M${x - 12} ${y}l8 9l16 -20`, style: "stroke-width:3" }, B.layer);
          return text("no", { class: "mono cellv w4", x: x - 14, y: y + 8 }, B.layer);
        }
        // the whole board in one state: fill(B, { tiers, host, models, efforts, fresh }) -> {tier:[], model:[], effort:[], host:[], fresh:[]}
        function fill(B, s) {
          const out = { tier: [], model: [], effort: [], host: [], fresh: [] };
          for (let r = 0; r < 7; r++) {
            const t = (s.tiers || TIER)[r];
            if (s.tier !== false) out.tier.push(cell(B, r, "tier", t));
            if (s.host) {
              const m = s.host === "openai" ? OPENAI[t][0] : CLAUDE[t];
              const e = s.host === "openai" ? OPENAI[t][1] : "—";
              out.model.push(cell(B, r, "model", m));
              out.effort.push(cell(B, r, "effort", e, "w4"));
              out.host.push(cell(B, r, "host", s.host, "w4"));
            }
            if (s.fresh) out.fresh.push(freshMark(B, r, FRESH[r]));
          }
          return out;
        }
        function drawBoard(K, B, at, step = 0.58) {
          K.fade(B.paper, at, 0.2);
          K.draw(B.frame, at, 0.9, "none");
          K.draw(B.headRule, at + 0.4, 0.6);
          B.colRules.forEach((n, i) => K.draw(n, at + 0.5 + i * 0.08, 0.5));
          Object.values(B.heads).forEach((n, i) => K.fade(n, at + 0.6 + i * 0.08, 0.3));
          B.rules.forEach((n, i) => K.draw(n, at + 0.7 + i * 0.06, 0.4));
          B.names.forEach((n, i) => K.reveal(n, at + 1.2 + i * step, 0.5));
        }
        // a gold band behind one row or one column (fades in to 0.18)
        function rowBand(B, r) {
          return el("rect", { class: "fill-gold", x: X0 + 2, y: rowTop(r) + 2, width: X1 - X0 - 4, height: RH - 4, opacity: 0.2 }, B.hl);
        }
        function colBand(B, col) {
          const c = COLS[col];
          return el("rect", { class: "fill-gold", x: c.x + 2, y: HY + 2, width: c.w - 4, height: rowTop(7) - HY - 4, opacity: 0.2 }, B.hl);
        }
        // swap one cell's value: old fades, new wipes in
        function swap(K, tl, a, b, at) {
          tl.fromTo(a, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, at);
          K.reveal(b, at + 0.15, 0.4);
        }

        // a stamp, tilted: stamp(parent, word, cx, cy, w)
        function stamp(parent, word, cx, cy, w = 220, red = false) {
          const tilt = el("g", { transform: `rotate(-6 ${cx} ${cy})`, "data-layout-allow-overlap": "" }, parent);
          const g = el("g", {}, tilt);
          el("rect", { class: "fill-bg", x: cx - w / 2, y: cy - 25, width: w, height: 50, opacity: 0.94 }, g);
          el("rect", { class: `ln ${red ? "red-s" : "ink"}`, x: cx - w / 2, y: cy - 25, width: w, height: 50, style: "stroke-width:3" }, g);
          text(word, { class: `stamp-t${red ? " red-f" : ""}`, x: cx, y: cy + 9, "text-anchor": "middle" }, g);
          return { g, cx, cy };
        }
        function slam(tl, S, at) {
          tl.fromTo(S.g, { opacity: 0, scale: 1.25, svgOrigin: `${S.cx} ${S.cy}` }, { opacity: 1, scale: 1, svgOrigin: `${S.cx} ${S.cy}`, duration: 0.25, ease: "power2.in" }, at);
        }
        // a sheet in transit
        function sheet(parent, x, y) {
          const t = el("g", { transform: `translate(${x} ${y})` }, parent);
          el("path", { class: "fill-bg", d: "M-12 -15H5L12 -8V15H-12Z" }, t);
          el("path", { class: "ln line-strong", d: "M-12 -15H5L12 -8V15H-12Z" }, t);
          el("path", { class: "ln thin line-strong", d: "M-6 -4H6M-6 3H6M-6 10H2" }, t);
          return t;
        }
        function carry(K, tl, parent, d, at, dur) {
          const s = sheet(parent, 0, 0);
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.15 }, at);
          K.travel(s, el("path", { d }), at, dur);
          tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, at + dur);
          return s;
        }
        // a small file card for the right-hand margin: fileCard(parent, x, y, w, name, lines)
        function fileCard(parent, x, y, w, name, lines) {
          const h = 50 + lines.length * 26;
          const C = { g: el("g", {}, parent), x, y, w, h };
          C.paper = el("path", { class: "fill-bg", d: `M${x} ${y}H${x + w - 18}L${x + w} ${y + 18}V${y + h}H${x}Z` }, C.g);
          C.body = el("path", { class: "ln ink", d: `M${x} ${y}H${x + w - 18}L${x + w} ${y + 18}V${y + h}H${x}Z` }, C.g);
          C.name = text(name, { class: "mono small", x: x + 16, y: y + 28, style: "font-weight:700" }, C.g);
          C.lines = lines.map((l, i) => text(l, { class: "mono small dim", x: x + 16, y: y + 56 + i * 26 }, C.g));
          return C;
        }
        function drawFile(K, C, at) {
          K.fade(C.paper, at, 0.2);
          K.draw(C.body, at, 0.6, "none");
          K.fade(C.name, at + 0.2, 0.3);
          C.lines.forEach((n, i) => K.reveal(n, at + 0.35 + i * 0.12, 0.4));
        }

        return { ROLES, TIER, FRESH, CLAUDE, OPENAI, COLS, X0, X1, HY, Y0, RH, rowTop, rowMid, board, cell, freshMark, fill, drawBoard, rowBand, colBand, swap, stamp, slam, sheet, carry, fileCard, drawFile };
      })();
    </script>
