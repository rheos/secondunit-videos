    <script>
      // Shared helpers for every plate. Cues are written in SCORE seconds and snapped to its beat grid.
      window.CR = (() => {
        const BEATS = [1.63, 2.25, 2.88, 3.51, 4.13, 4.76, 5.39, 6.01, 6.64, 7.27, 7.89, 8.52, 9.15, 9.75, 10.38, 11.01, 11.63, 12.26, 12.89, 13.51, 14.14, 14.77, 15.39, 16.0, 16.63, 17.25, 17.88, 18.51, 19.13, 19.76, 20.39, 21.01, 21.64, 22.27, 22.87, 23.5, 24.13, 24.75, 25.38, 26.01, 26.63, 27.26, 27.89, 28.51, 29.14, 29.77, 30.39, 31.0, 31.63, 32.25, 32.88, 33.51, 34.13, 34.76, 35.39, 36.01, 36.64, 37.27, 37.87, 38.5, 39.13, 39.75, 40.38, 41.01, 41.8, 42.56, 43.19, 43.82, 44.44, 45.07, 45.7, 46.32, 46.95, 47.58, 48.18, 48.81, 49.46, 50.06, 50.69, 51.32, 51.94, 52.57, 53.2, 53.82, 54.45, 55.08, 55.68, 56.31, 56.96, 57.56, 58.19, 58.82, 59.44, 60.07, 60.7, 61.32, 61.95, 62.58, 63.18, 63.81, 64.44, 65.06, 65.69, 66.32, 66.94, 67.57, 68.2, 68.82, 69.45, 70.08, 70.68, 71.31, 71.96, 72.56, 73.19, 73.82, 74.44, 75.07, 75.7, 76.32, 76.95, 77.58, 78.18, 78.81, 79.46, 80.06, 80.69, 81.32, 81.94, 82.57, 83.2, 83.82, 84.45, 85.08, 85.68, 86.31, 86.94, 87.56, 88.19, 88.82, 89.44, 90.07, 90.7, 91.32]; // librosa beat grid of take-01 (beats.json)
        const NS = "http://www.w3.org/2000/svg";
        const snap = (a) => BEATS.reduce((b, x) => (Math.abs(x - a) < Math.abs(b - a) ? x : b));
        function el(tag, attrs, parent) {
          const n = document.createElementNS(NS, tag);
          for (const k in attrs) n.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(n);
          return n;
        }
        function text(str, attrs, parent) {
          const n = el("text", attrs, parent);
          n.textContent = str;
          return n;
        }
        function prime(node) {
          const len = node.getTotalLength() * 1.02;
          node.style.strokeDasharray = `${len}`;
          node.style.strokeDashoffset = `${len}`;
          return node;
        }
        // kit(tl, slotStart): cue helpers bound to one plate's timeline
        function kit(tl, slotStart) {
          const T = (a) => snap(a) - slotStart; // score time -> plate time, on the beat
          const R = (a) => a - slotStart; // score time -> plate time, unsnapped
          const draw = (node, at, dur = 0.7, ease = "power2.out") =>
            tl.to(prime(node), { strokeDashoffset: 0, duration: dur, ease }, at);
          const fade = (node, at, dur = 0.4, to) => {
            const target = to !== undefined ? to : Number(node.getAttribute("opacity") || 1) || 1;
            return tl.fromTo(node, { opacity: 0 }, { opacity: target, duration: dur, ease: "power1.out" }, at);
          };
          const reveal = (node, at, dur = 0.7) =>
            tl.fromTo(node, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "power2.out" }, at);
          const out = (node, at, dur = 0.45) => tl.to(node, { opacity: 0, duration: dur, ease: "power1.in" }, at);
          const travel = (node, path, at, dur, ease = "power1.inOut") => {
            const len = path.getTotalLength();
            const p = { t: 0 };
            return tl.fromTo(
              p,
              { t: 0 },
              {
                t: 1,
                duration: dur,
                ease,
                onUpdate: () => {
                  const pt = path.getPointAtLength(p.t * len);
                  node.setAttribute("transform", `translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)})`);
                },
              },
              at
            );
          };
          return { T, R, draw, fade, reveal, out, travel, $: (id) => document.getElementById(id) };
        }
        return { BEATS, snap, el, text, prime, kit };
      })();
      window.__timelines["main"] = gsap.timeline({ paused: true });
