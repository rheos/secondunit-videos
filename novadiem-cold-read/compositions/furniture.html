<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #furniture {
          position: absolute;
          inset: 0;
          background: var(--paper);
        }
      </style>
      <div id="furniture" data-composition-id="furniture" data-width="1920" data-height="1080">
        <!-- paper: fixed seeded grain, aged mottle, faint 60px grid -->
        <svg class="full" viewBox="0 0 1920 1080" aria-hidden="true" style="will-change: transform">
          <defs>
            <filter id="fu-grain-fine" x="0" y="0" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" />
              <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.18  0.55 0 0 0 -0.18" />
            </filter>
            <filter id="fu-grain-mottle" x="0" y="0" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency="0.0035" numOctaves="3" seed="11" />
              <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.2  0.26 0 0 0 -0.09" />
            </filter>
            <pattern id="fu-grid" width="60" height="60" patternUnits="userSpaceOnUse" x="48" y="48">
              <path d="M60 0H0V60" fill="none" stroke="#1c1a17" stroke-width="1" opacity="0.06" />
            </pattern>
          </defs>
          <rect width="1920" height="1080" filter="url(#fu-grain-mottle)" />
          <rect width="1920" height="1080" filter="url(#fu-grain-fine)" />
          <rect id="fu-grid-rect" x="48" y="48" width="1824" height="984" fill="url(#fu-grid)" />
        </svg>

        <svg class="full" viewBox="0 0 1920 1080">
          <rect id="fu-border" class="ln thin gold" x="48" y="48" width="1824" height="984" />
          <g id="fu-reg"></g>
          <g id="fu-bar">
            <path id="fu-bar-base" class="ln thin ink" d="M260 985H1660" opacity="0.4" />
            <path id="fu-bar-progress" class="ln gold" d="M260 985H1660" />
            <g id="fu-stations"></g>
            <path id="fu-tick" d="M-9 -14H9L0 0Z" fill="#a8862f" />
          </g>
        </svg>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.CR;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 0);

          const reg = K.$("fu-reg");
          const marks = [];
          [
            [48, 48],
            [1872, 48],
            [48, 1032],
            [1872, 1032],
          ].forEach(([x, y]) => {
            marks.push(el("circle", { class: "ln thin gold", cx: x, cy: y, r: 10 }, reg));
            marks.push(el("path", { class: "ln thin gold", d: `M${x - 18} ${y}H${x + 18}M${x} ${y - 18}V${y + 18}` }, reg));
          });

          const STATIONS = ["SPEC", "PLAN", "BUILD", "CRITIC", "MERGE"];
          const SX = (i) => 260 + i * 350;
          const st = K.$("fu-stations");
          const ticks = [],
            labels = [];
          STATIONS.forEach((s, i) => {
            ticks.push(el("path", { class: "ln thin ink", d: `M${SX(i)} 979V991` }, st));
            labels.push(text(s, { class: "mono small", x: SX(i), y: 1014, "text-anchor": "middle" }, st));
          });

          // the plate is ruled at the start of the film
          K.fade(K.$("fu-grid-rect"), 0.1, 1.2);
          K.draw(K.$("fu-border"), 0.2, 1.4, "none");
          marks.forEach((m, i) => K.draw(m, 1.0 + (i >> 1) * 0.12, 0.4));
          K.draw(K.$("fu-bar-base"), 0.9, 1.0, "none");
          ticks.forEach((t, i) => K.draw(t, 1.3 + i * 0.12, 0.2));
          labels.forEach((t, i) => K.fade(t, 1.4 + i * 0.12, 0.35));

          // progress: one station per stage of the run
          const prog = K.$("fu-bar-progress");
          const len = prog.getTotalLength();
          prog.style.strokeDasharray = `${len}`;
          prog.style.strokeDashoffset = `${len}`;
          gsap.set("#fu-tick", { x: SX(0), y: 971, opacity: 0 });
          tl.to("#fu-tick", { opacity: 1, duration: 0.3 }, K.T(1.63));
          [
            [7.89, 1],
            [20.39, 2],
            [55.08, 3],
            [85.08, 4],
          ].forEach(([at, i]) => {
            tl.to(prog, { strokeDashoffset: len * (1 - i / 4), duration: 0.6, ease: "power2.inOut" }, K.T(at));
            tl.to("#fu-tick", { x: SX(i), duration: 0.6, ease: "power2.inOut" }, K.T(at));
          });

          window.__timelines["furniture"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
