<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b3 {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="b3" data-composition-id="b3" data-width="1920" data-height="1080">
        <!-- PAPER: failures that announce themselves -->
        <div id="b3-paper" class="layer">
          <svg class="full" viewBox="0 0 1920 1080">
            <path id="b3-bracket" class="ln thin ink" d="M300 262V250H940V262" />
            <text id="b3-bracket-label" class="mono small" x="620" y="236" text-anchor="middle">ANNOUNCES ITSELF</text>

            <rect id="b3-crash-frame" class="ln ink" x="300" y="300" width="260" height="170" />
            <path id="b3-crash-bar" class="ln thin ink" d="M300 324H560" />
            <path id="b3-crash-break" class="ln ink" d="M300 404L360 380L400 424L450 372L500 414L560 388" stroke-width="3" />
            <path id="b3-alarm-1" class="ln gold" d="M574 298L592 280" />
            <path id="b3-alarm-2" class="ln gold" d="M582 312L606 304" />
            <path id="b3-alarm-3" class="ln gold" d="M566 290L572 266" />
            <text id="b3-crash-label" class="mono" x="430" y="508" text-anchor="middle">CRASH</text>

            <rect id="b3-ui-frame" class="ln ink" x="680" y="300" width="260" height="170" />
            <path id="b3-ui-bar" class="ln thin ink" d="M680 324H940" />
            <rect id="b3-ui-ok" class="ln thin ink" x="700" y="342" width="220" height="36" />
            <rect id="b3-ui-bad" class="ln ink" x="770" y="398" width="210" height="40" transform="rotate(-4 875 418)" />
            <text id="b3-ui-label" class="mono" x="810" y="508" text-anchor="middle">BROKEN UI</text>
          </svg>
          <div id="b3-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate III</div>
          <div id="b3-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>Two Kinds of Failure</div>
          <div class="statement" data-layout-allow-overlap data-layout-allow-occlusion>
            <span id="b3-st-loud" class="phrase">Most bugs announce themselves.</span>
          </div>
        </div>

        <!-- NIGHT: the silent ones -->
        <div id="b3-night" class="layer night">
          <svg class="full" viewBox="0 0 1920 1080">
            <g id="b3-stars"></g>
            <rect class="ln thin gold-n" x="48" y="48" width="1824" height="984" opacity="0.6" />
            <g transform="translate(960 470)">
              <path id="b3-layer-1" class="ln gold-n" d="M-330 -150L-90 -230L330 -150L90 -70Z" opacity="0.55" />
              <path id="b3-layer-2" class="ln gold-n" d="M-330 -30L-90 -110L330 -30L90 50Z" opacity="0.55" />
              <path id="b3-layer-3" class="ln gold-n" d="M-330 90L-90 10L330 90L90 170Z" opacity="0.55" />
              <path id="b3-layer-posts" class="ln thin gold-n construct" d="M-330 -150V90M330 -150V90M90 -70V170M-90 -230V10" />
              <path id="b3-crack" d="M-40 -42L-22 -30L-30 -18L-8 -6L-16 6L6 16" fill="none" stroke="#d9473b" stroke-width="2" opacity="0.22" />
              <text id="b3-layer-1-label" class="mono small" x="360" y="-144">DURABLE STATE</text>
              <text id="b3-layer-2-label" class="mono small" x="360" y="-24">MONEY · AUTH</text>
              <text id="b3-layer-3-label" class="mono small" x="360" y="96">OUTBOUND SENDS</text>
            </g>
            <g id="b3-bar-night" data-layout-allow-overlap data-layout-allow-occlusion>
              <path class="ln thin paper-s" d="M260 985H1660" opacity="0.35" />
              <path class="ln gold-n" d="M260 985H960" />
              <g id="b3-stations"></g>
              <path id="b3-night-tick" d="M-9 -14H9L0 0Z" fill="#c9a54a" transform="translate(960 971)" />
            </g>
          </svg>
          <div class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate III</div>
          <div class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>Two Kinds of Failure</div>
          <div class="statement" data-layout-allow-overlap data-layout-allow-occlusion>
            <span id="b3-st-a" class="phrase">Some bugs are</span>
            <span id="b3-st-b" class="phrase red">silent.</span>
          </div>
        </div>
        <div id="b3-edge" class="wipe-edge"></div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.CR;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 20);

          // night furniture: seeded stars, its own bar stations
          let seed = 1729;
          const rnd = () => {
            seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
          const stars = K.$("b3-stars");
          for (let i = 0; i < 70; i++) {
            el("circle", { cx: (80 + rnd() * 1760).toFixed(1), cy: (80 + rnd() * 600).toFixed(1), r: (0.8 + rnd() * 1.1).toFixed(2), fill: "#efe6d2", opacity: (0.15 + rnd() * 0.35).toFixed(2) }, stars);
          }
          const st = K.$("b3-stations");
          ["SPEC", "PLAN", "BUILD", "CRITIC", "MERGE"].forEach((s, i) => {
            const x = 260 + i * 350;
            el("path", { class: "ln thin paper-s", d: `M${x} 979V991` }, st);
            text(s, { class: "mono small", x, y: 1014, "text-anchor": "middle" }, st);
          });

          // ---- paper: two loud failures ----
          K.fade(K.$("b3-label-l"), K.T(20.4), 0.4);
          K.fade(K.$("b3-label-r"), K.T(20.4), 0.4);
          K.draw(K.$("b3-crash-frame"), K.T(21.0), 0.8, "none");
          K.draw(K.$("b3-crash-bar"), K.T(21.0) + 0.7, 0.3);
          K.draw(K.$("b3-crash-break"), K.T(21.9), 0.5, "none");
          ["b3-alarm-1", "b3-alarm-2", "b3-alarm-3"].forEach((id, i) => K.draw(K.$(id), K.T(22.5) + i * 0.12, 0.2));
          K.fade(K.$("b3-crash-label"), K.T(22.5) + 0.3, 0.4);
          K.draw(K.$("b3-ui-frame"), K.T(23.1), 0.8, "none");
          K.draw(K.$("b3-ui-bar"), K.T(23.1) + 0.7, 0.3);
          K.draw(K.$("b3-ui-ok"), K.T(23.9), 0.5, "none");
          K.draw(K.$("b3-ui-bad"), K.T(23.9) + 0.4, 0.5, "none");
          K.fade(K.$("b3-ui-label"), K.T(23.9) + 0.6, 0.4);
          K.draw(K.$("b3-bracket"), K.T(24.8), 0.6);
          K.fade(K.$("b3-bracket-label"), K.T(24.8) + 0.4, 0.4);
          K.reveal(K.$("b3-st-loud"), K.T(25.4), 0.9);

          // ---- the plate turns dark from the right (cutaway opens) ----
          const inA = K.T(27.26),
            inB = K.T(27.89);
          tl.fromTo("#b3-night", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: inB - inA, ease: "power2.inOut" }, inA);
          tl.fromTo("#b3-edge", { x: 1918 }, { x: 0, duration: inB - inA, ease: "power2.inOut" }, inA);
          tl.fromTo("#b3-edge", { opacity: 0 }, { opacity: 1, duration: 0.08 }, inA);
          tl.to("#b3-edge", { opacity: 0, duration: 0.12 }, inB - 0.08);
          // the paper plate is gone once covered, so the closing wipe reveals plate IV, not this
          tl.set("#b3-paper", { opacity: 0 }, inB + 0.05);

          // ---- the silent layers ----
          ["b3-layer-1", "b3-layer-2", "b3-layer-3"].forEach((id, i) => {
            K.draw(K.$(id), K.T(28.5) + i * 0.6, 0.9, "none");
            K.fade(K.$(`${id}-label`), K.T(28.5) + i * 0.6 + 0.6, 0.4);
          });
          K.fade(K.$("b3-layer-posts"), K.T(30.2), 0.5);
          K.draw(K.$("b3-crack"), K.T(31.0), 0.8, "none");
          K.reveal(K.$("b3-st-a"), K.T(31.0), 0.7);
          K.reveal(K.$("b3-st-b"), K.T(31.63), 0.6);

          // ---- the cutaway closes onto plate IV (34.76 -> 35.39) ----
          const outA = K.T(34.76),
            outB = K.T(35.39);
          tl.to("#b3-night", { clipPath: "inset(0 0 0 100%)", duration: outB - outA, ease: "power2.inOut" }, outA);
          tl.fromTo("#b3-edge", { x: 0 }, { x: 1918, duration: outB - outA, ease: "power2.inOut", immediateRender: false }, outA);
          tl.to("#b3-edge", { opacity: 1, duration: 0.08 }, outA);
          tl.to("#b3-edge", { opacity: 0, duration: 0.12 }, outB - 0.08);

          window.__timelines["b3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
