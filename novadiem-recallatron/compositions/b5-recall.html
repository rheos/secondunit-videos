<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b5 {
          position: absolute;
          inset: 0;
        }
      </style>
      <div data-hf-id="hf-rc60" id="b5" data-composition-id="b5" data-width="1920" data-height="1080">
        <div data-hf-id="hf-rc61" id="b5-content" class="layer">
          <div data-hf-id="hf-rc62" id="b5-lab-l" class="plate-label left">PLATE V</div>
          <div data-hf-id="hf-rc63" id="b5-lab-r" class="plate-label right">RECALL</div>
          <svg data-hf-id="hf-rc64" id="b5-svg" class="full" viewBox="0 0 1920 1080"></svg>
          <div data-hf-id="hf-rc65" class="statement">
            <span data-hf-id="hf-rc66" id="b5-s1" class="phrase">Keyword and vector,</span>
            <span data-hf-id="hf-rc67" id="b5-s2" class="phrase accent">ranked as one.</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text } = BP;
          const tl = gsap.timeline({ paused: true });
          const S = 53.02;
          const K = BP.kit(tl, S);
          const svg = K.$("b5-svg");

          // the question (made up)
          const qBox = el("rect", { class: "ln line-strong", x: 560, y: 140, width: 800, height: 64 }, svg);
          const qLab = text("QUERY", { class: "mono small dim", x: 584, y: 180 }, svg);
          const qT = text("which Postgres is staging on?", { class: "cb", x: 690, y: 180 }, svg);

          // candidates are decided in SQL before anything is ranked: live, readable, right purpose
          const CHIPS = [
            ["B", "POSTGRES 17", true],
            ["E", "DEPLOYS FROM MAIN", true],
            ["F", "PROD: POSTGRES 16", true],
            ["C", "BACKUP 03:00", true],
            ["A", "SUPERSEDED", false],
            ["D", "INVALIDATED", false],
          ];
          const chips = CHIPS.map(([id, s, live], i) => {
            const x = 168 + i * 266;
            const g = el("g", {}, svg);
            const r = el("rect", { class: live ? "ln line" : "ln thin line", x, y: 236, width: 250, height: 50 }, g);
            const t = text(`${id}  ${s}`, { class: live ? "mono small" : "mono small dim", x: x + 16, y: 268 }, g);
            const x1 = live ? null : el("path", { class: "ln thin line", d: `M${x} 286L${x + 250} 236` }, g);
            return { g, r, t, x1, live };
          });
          const candT = text("CANDIDATES: CURRENT, READABLE, RIGHT PURPOSE", { class: "mono small dim", x: 960, y: 322, "text-anchor": "middle" }, svg);

          // two arms rank the same candidates
          const arm = (x, name, sub, rows) => {
            const box = el("rect", { class: "ln line", x, y: 360, width: 560, height: 250 }, svg);
            const rule = el("path", { class: "ln thin line", d: `M${x} 440H${x + 560}` }, svg);
            const t = text(name, { class: "mono", x: x + 22, y: 394 }, svg);
            const t2 = text(sub, { class: "mono small dim", x: x + 22, y: 424 }, svg);
            const rs = rows.map((s, i) => {
              const g = el("g", {}, svg);
              text(String(i + 1), { class: "cm on", x: x + 24, y: 488 + i * 48 }, g);
              text(s, { class: "cb", x: x + 60, y: 488 + i * 48 }, g);
              return g;
            });
            return { box, rule, t, t2, rs };
          };
          const kw = arm(190, "KEYWORD", "POSTGRES FULL TEXT, STEMMED WORDS", ["Staging runs Postgres 17.", "Production runs Postgres 16.", "Staging deploys from main."]);
          const vec = arm(1170, "VECTOR", "384 DIMENSIONS, COSINE 0.30 OR MORE", ["Staging runs Postgres 17.", "Staging deploys from main.", "Production runs Postgres 16."]);

          // reciprocal rank fusion: score = sum of 1 / (60 + rank) over the arms that found it
          const inL = el("path", { class: "ln line", d: "M750 485C800 485 800 470 820 470" }, svg);
          const inR = el("path", { class: "ln line", d: "M1170 485C1120 485 1120 470 1100 470" }, svg);
          const fuse = el("rect", { class: "ln line-strong", x: 820, y: 400, width: 280, height: 140 }, svg);
          const fuseT = text("FUSED", { class: "mono", x: 960, y: 440, "text-anchor": "middle" }, svg);
          const fuseF = text("1 / (60 + RANK)", { class: "mono mint", x: 960, y: 480, "text-anchor": "middle" }, svg);
          const fuseF2 = text("SUMMED PER MEMORY", { class: "mono small dim", x: 960, y: 512, "text-anchor": "middle" }, svg);
          const down = el("path", { class: "ln line", d: "M960 540V650" }, svg);
          const downHead = RC.head(svg, 960, 652, "d");
          const top = el("rect", { class: "ln line-strong fill-raised", x: 610, y: 664, width: 700, height: 64 }, svg);
          const topT = text("B  Staging runs Postgres 17.", { class: "ct", x: 636, y: 704 }, svg);
          const topS = text("1/61 + 1/61", { class: "mono mint", x: 1286, y: 704, "text-anchor": "end" }, svg);

          K.fade(K.$("b5-lab-l"), K.T(53.66), 0.4);
          K.fade(K.$("b5-lab-r"), K.T(53.66), 0.4);
          K.draw(qBox, K.T(54.3), 0.6);
          K.fade(qLab, K.T(54.3) + 0.3, 0.3);
          K.fade(qT, K.T(54.94), 0.4);
          chips.forEach((c, i) => {
            const at = K.T(55.58) + i * 0.16;
            K.draw(c.r, at, 0.4);
            K.fade(c.t, at + 0.2, 0.3);
          });
          chips.filter((c) => !c.live).forEach((c, i) => {
            K.draw(c.x1, K.T(57.48) + i * 0.16, 0.3);
            tl.fromTo(c.g, { opacity: 1 }, { opacity: 0.45, duration: 0.4 }, K.T(57.48) + i * 0.16);
          });
          K.fade(candT, K.T(57.48) + 0.2, 0.35);
          [kw, vec].forEach((a, k) => {
            const at = K.T(58.76) + k * 0.16;
            K.draw(a.box, at, 0.6);
            K.draw(a.rule, at + 0.3, 0.3);
            K.fade(a.t, at + 0.3, 0.3);
            K.fade(a.t2, at + 0.45, 0.3);
            a.rs.forEach((r, i) => K.fade(r, K.T(59.41) + i * 0.32 + k * 0.16, 0.3));
          });
          K.draw(inL, K.T(60.67), 0.4);
          K.draw(inR, K.T(60.67), 0.4);
          K.draw(fuse, K.T(61.31), 0.5);
          K.fade(fuseT, K.T(61.31) + 0.25, 0.3);
          K.fade(fuseF, K.T(61.31) + 0.4, 0.3);
          K.fade(fuseF2, K.T(61.31) + 0.55, 0.3);
          K.draw(down, K.T(61.95), 0.35);
          K.draw(downHead, K.T(61.95) + 0.3, 0.15);
          K.fade(top, K.T(61.95) + 0.35, 0.3);
          K.fade(topT, K.T(61.95) + 0.5, 0.3);
          K.fade(topS, K.T(61.95) + 0.7, 0.3);
          K.reveal(K.$("b5-s1"), K.T(62.59), 0.6);
          K.reveal(K.$("b5-s2"), K.T(63.23), 0.6);

          K.out(K.$("b5-content"), K.R(67.25), 0.4);
          window.__timelines["b5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
