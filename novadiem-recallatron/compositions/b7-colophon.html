<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b7 {
          position: absolute;
          inset: 0;
        }
        #b7-title {
          top: 250px;
          font-size: 132px;
        }
      </style>
      <div data-hf-id="hf-rc80" id="b7" data-composition-id="b7" data-width="1920" data-height="1080">
        <div data-hf-id="hf-rc81" id="b7-content" class="layer">
          <div data-hf-id="hf-rc82" id="b7-lab-l" class="plate-label left">PLATE VII</div>
          <div data-hf-id="hf-rc83" id="b7-lab-r" class="plate-label right">COLOPHON</div>
          <div data-hf-id="hf-rc84" id="b7-title" class="title">Memory you can correct</div>
          <svg data-hf-id="hf-rc85" id="b7-svg" class="full" viewBox="0 0 1920 1080"></svg>
          <div data-hf-id="hf-rc86" class="statement two">
            <span data-hf-id="hf-rc87" id="b7-s1" class="phrase">Inspect it. Correct it.</span>
            <span data-hf-id="hf-rc88" id="b7-s2" class="phrase accent">Changed facts stay as history.</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text } = BP;
          const tl = gsap.timeline({ paused: true });
          const S = 79.83;
          const K = BP.kit(tl, S);
          const svg = K.$("b7-svg");

          // the film's five steps as construction lines, under the title
          const rule = el("path", { class: "ln line", d: "M560 470H1360M560 460V480M1360 460V480" }, svg);
          const sub = text("RECALLATRON  ·  A RHEOSTREAM MODULE", { class: "mono", x: 960, y: 530, "text-anchor": "middle" }, svg);
          const STEPS = ["IMPORT", "SAVE", "SUPERSEDE", "CORRECT", "RECALL"];
          const steps = STEPS.map((s, i) => {
            const x = 560 + i * 200;
            return {
              tick: el("path", { class: "ln thin line", d: `M${x} 600V620` }, svg),
              t: text(s, { class: "mono small dim", x, y: 652, "text-anchor": "middle" }, svg),
            };
          });
          const stepLine = el("path", { class: "ln thin line construct", d: "M560 610H1360" }, svg);
          const small = text("AGPL-3.0  ·  OPEN SOURCE  ·  RHEO.STREAM", { class: "mono small dim", x: 960, y: 740, "text-anchor": "middle" }, svg);

          K.fade(K.$("b7-lab-l"), K.T(80.47), 0.4);
          K.fade(K.$("b7-lab-r"), K.T(80.47), 0.4);
          K.reveal(K.$("b7-title"), K.T(80.47), 1.0);
          K.draw(rule, K.T(81.11), 0.6);
          K.fade(sub, K.T(81.75), 0.5);
          K.sweep(stepLine, K.T(81.75), 0.8);
          steps.forEach((s, i) => {
            K.draw(s.tick, K.T(82.38) + i * 0.12, 0.2);
            K.fade(s.t, K.T(82.38) + i * 0.12 + 0.1, 0.3);
          });
          K.reveal(K.$("b7-s1"), K.T(83.66), 0.6);
          K.reveal(K.$("b7-s2"), K.T(84.3), 0.6);
          K.fade(small, K.T(84.94), 0.5);
          window.__timelines["b7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
