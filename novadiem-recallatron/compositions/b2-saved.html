<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b2 {
          position: absolute;
          inset: 0;
        }
      </style>
      <div data-hf-id="hf-rc30" id="b2" data-composition-id="b2" data-width="1920" data-height="1080">
        <div data-hf-id="hf-rc31" id="b2-content" class="layer">
          <div data-hf-id="hf-rc32" id="b2-lab-l" class="plate-label left">PLATE II</div>
          <div data-hf-id="hf-rc33" id="b2-lab-r" class="plate-label right">SAVED</div>
          <svg data-hf-id="hf-rc34" id="b2-svg" class="full" viewBox="0 0 1920 1080"></svg>
          <div data-hf-id="hf-rc35" class="statement">
            <span data-hf-id="hf-rc36" id="b2-s1" class="phrase">Sessions save</span>
            <span data-hf-id="hf-rc37" id="b2-s2" class="phrase accent">without being asked.</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text } = BP;
          const tl = gsap.timeline({ paused: true });
          const S = 12.81;
          const K = BP.kit(tl, S);
          const svg = K.$("b2-svg");

          // an enrolled Claude Code session (the lines are made up)
          const panel = el("rect", { class: "ln line", x: 160, y: 180, width: 660, height: 250 }, svg);
          const panelRule = el("path", { class: "ln thin line", d: "M160 226H820" }, svg);
          const panelT = text("SESSION  ·  CLAUDE CODE  ·  2026-10-02", { class: "mono small", x: 182, y: 210 }, svg);
          const lines = [
            ["YOU", "Staging is on Postgres 15 now."],
            ["AGENT", "Noted. I'll update the notes."],
            ["YOU", "Good. Next, the dashboard."],
          ].map(([who, s], i) => {
            const g = el("g", {}, svg);
            text(who, { class: "cm on", x: 184, y: 280 + i * 52 }, g);
            text(s, { class: "cb", x: 290, y: 280 + i * 52 }, g);
            return g;
          });

          // the capture path: the Stop hook writes a locator, the local worker sanitizes,
          // the server's drain makes one extraction call and accepts at most one memory per unit
          const NODES = [
            [200, "STOP HOOK", "LOCATOR ONLY"],
            [560, "LOCAL WORKER", "SANITIZES"],
            [920, "EXTRACT", "ONE MODEL CALL"],
            [1280, "ACCEPT", "ONE UNIT, ONE MEMORY"],
          ];
          const nodes = NODES.map(([x, a, b]) => ({
            box: el("rect", { class: "ln line", x, y: 540, width: 290, height: 92 }, svg),
            t: text(a, { class: "mono", x: x + 22, y: 578 }, svg),
            t2: text(b, { class: "mono small dim", x: x + 22, y: 610 }, svg),
          }));
          const links = [
            el("path", { class: "ln line", d: "M345 430V540" }, svg),
            el("path", { class: "ln line", d: "M490 586H560" }, svg),
            el("path", { class: "ln line", d: "M850 586H920" }, svg),
            el("path", { class: "ln line", d: "M1210 586H1280" }, svg),
            el("path", { class: "ln line", d: "M1570 586H1640V412" }, svg),
          ];
          const heads = [RC.head(svg, 345, 538, "d"), RC.head(svg, 558, 586, "r"), RC.head(svg, 918, 586, "r"), RC.head(svg, 1278, 586, "r"), RC.head(svg, 1640, 412, "u")];
          const route = el("path", { d: "M345 430V586H1640V412", fill: "none", stroke: "none" }, svg);
          const dot = el("circle", { class: "fill-strong", r: 9, cx: 0, cy: 0, opacity: 0 }, svg);

          // the memory it made, and its content-free receipt
          const A = RC.card(svg, 1360, 210, { kind: "FACT", title: "Staging database", body: "Staging runs Postgres 15.", foot: "2026-10-02  ·  AUTOMATIC" });
          const rcpt = el("rect", { class: "ln thin line", x: 1340, y: 670, width: 380, height: 64 }, svg);
          const rcptT = text("RECEIPT", { class: "mono small", x: 1360, y: 697 }, svg);
          const rcptT2 = text("NO CONTENT  ·  NO REPLAY", { class: "mono small dim", x: 1360, y: 722 }, svg);
          const rcptLink = el("path", { class: "ln thin line", d: "M1530 632V670" }, svg);

          K.fade(K.$("b2-lab-l"), K.T(13.44), 0.4);
          K.fade(K.$("b2-lab-r"), K.T(13.44), 0.4);
          K.draw(panel, K.T(14.08), 0.7);
          K.draw(panelRule, K.T(14.08) + 0.3, 0.4);
          K.fade(panelT, K.T(14.08) + 0.4, 0.35);
          lines.forEach((g, i) => K.fade(g, K.T(14.72 + i * 0.64), 0.4));
          nodes.forEach((n, i) => {
            const at = K.T(16.64) + i * 0.32;
            K.draw(n.box, at, 0.5);
            K.fade(n.t, at + 0.2, 0.3);
            K.fade(n.t2, at + 0.35, 0.3);
          });
          links.forEach((l, i) => K.draw(l, K.T(17.28) + i * 0.16, 0.3));
          heads.forEach((h, i) => K.draw(h, K.T(17.28) + i * 0.16 + 0.25, 0.15));
          K.fade(dot, K.T(17.91), 0.15);
          K.travel(dot, route, K.T(17.91), 2.4);
          tl.to(dot, { opacity: 0, duration: 0.2 }, K.T(17.91) + 2.35);
          RC.drawIn(K, A, K.T(20.47));
          K.draw(rcptLink, K.T(21.11), 0.25);
          K.draw(rcpt, K.T(21.11) + 0.2, 0.5);
          K.fade(rcptT, K.T(21.11) + 0.4, 0.3);
          K.fade(rcptT2, K.T(21.11) + 0.55, 0.3);
          K.reveal(K.$("b2-s1"), K.T(21.75), 0.6);
          K.reveal(K.$("b2-s2"), K.T(22.38), 0.6);

          K.out(K.$("b2-content"), K.R(25.75), 0.4);
          window.__timelines["b2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
