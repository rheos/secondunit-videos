<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b1 {
          position: absolute;
          inset: 0;
        }
      </style>
      <div data-hf-id="hf-rc20" id="b1" data-composition-id="b1" data-width="1920" data-height="1080">
        <div data-hf-id="hf-rc21" id="b1-content" class="layer">
          <div data-hf-id="hf-rc22" id="b1-lab-l" class="plate-label left">PLATE I</div>
          <div data-hf-id="hf-rc23" id="b1-lab-r" class="plate-label right">MEMORY YOU CAN CORRECT</div>
          <svg data-hf-id="hf-rc24" id="b1-svg" class="full" viewBox="0 0 1920 1080"></svg>
          <div data-hf-id="hf-rc25" class="statement">
            <span data-hf-id="hf-rc26" id="b1-s1" class="phrase">Counted in once.</span>
            <span data-hf-id="hf-rc27" id="b1-s2" class="phrase accent">Erased stays erased.</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text } = BP;
          const tl = gsap.timeline({ paused: true });
          const S = 0;
          const K = BP.kit(tl, S);
          const svg = K.$("b1-svg");

          // 2026-09-30: the predecessor store's data moves into Recallatron in one accounted transfer
          const date = text("2026-09-30", { class: "mono mint", x: 200, y: 232 }, svg);
          const dateSub = text("ONE-TIME TRANSFER", { class: "mono small dim", x: 200, y: 262 }, svg);
          const store = el("rect", { class: "ln line", x: 200, y: 290, width: 360, height: 360 }, svg);
          const storeRule = el("path", { class: "ln thin line", d: "M200 340H560" }, svg);
          const storeT = text("OLD STORE", { class: "mono", x: 222, y: 324 }, svg);
          const rows = [250, 300, 210, 280, 240, 300, 190, 260, 230, 280].map((w, i) =>
            el("path", { class: "ln thin line", d: `M228 ${376 + i * 26}h${w}`, opacity: 0.55 }, svg)
          );

          // the mapping: curated items become memories, everything else becomes history
          const forkM = el("path", { class: "ln line", d: "M560 470C820 470 860 330 1112 330" }, svg);
          const forkH = el("path", { class: "ln line", d: "M560 470C820 470 860 590 1112 590" }, svg);
          const headM = RC.head(svg, 1118, 330, "r");
          const headH = RC.head(svg, 1118, 590, "r");

          const drawer = (y, name, a, b) => {
            const g = el("g", {}, svg);
            const box = el("rect", { class: "ln line-strong", x: 1120, y, width: 600, height: 160 }, g);
            const handle = el("path", { class: "ln line-strong", d: `M1600 ${y + 118}H1680`, style: "stroke-width: 6" }, g);
            const t = text(name, { class: "mono", x: 1148, y: y + 44 }, g);
            const t1 = text(a, { class: "mono small dim", x: 1148, y: y + 84 }, g);
            const t2 = text(b, { class: "mono small dim", x: 1148, y: y + 112 }, g);
            return { box, handle, t, t1, t2 };
          };
          const mem = drawer(250, "MEMORY", "CURATED  ·  ORIGIN: MIGRATED", "ADDRESSED TO THE OWNER");
          const his = drawer(510, "HISTORY", "EVIDENCE, KEPT APART FROM MEMORY", "OWNER-ONLY SEARCH  ·  NO AGENT TOOL");

          // records in transit: small cards riding the two forks
          const riders = [forkM, forkH, forkH, forkM, forkH, forkH].map((path) => {
            const g = el("g", { opacity: 0 }, svg);
            el("rect", { class: "ln line-strong fill-raised", x: -24, y: -16, width: 48, height: 32 }, g);
            el("path", { class: "ln thin line", d: "M-14 -4h28M-14 6h18" }, g);
            return { g, path };
          });

          // what the transfer had to prove (FR 53, criterion 32)
          const checks = [
            [200, "EVERY RECORD COUNTED"],
            [760, "IDS AND CLOCKS KEPT"],
            [1320, "A RE-RUN ADDS NOTHING"],
          ].map(([x, s]) => ({
            tick: el("path", { class: "ln line-strong", d: `M${x} 720l9 9l18 -22` }, svg),
            t: text(s, { class: "mono", x: x + 44, y: 729 }, svg),
          }));

          K.fade(K.$("b1-lab-l"), K.T(0.68), 0.4);
          K.fade(K.$("b1-lab-r"), K.T(0.68), 0.4);
          K.draw(store, K.T(1.31), 1.0);
          K.draw(storeRule, K.T(1.95), 0.4);
          K.fade(storeT, K.T(1.95), 0.4);
          rows.forEach((r, i) => K.draw(r, K.T(1.95) + 0.2 + i * 0.06, 0.4));
          K.fade(date, K.T(2.59), 0.4);
          K.fade(dateSub, K.T(2.59) + 0.2, 0.4);
          K.draw(forkM, K.T(3.87), 0.8);
          K.draw(forkH, K.T(3.87) + 0.1, 0.8);
          K.draw(headM, K.T(4.51), 0.2);
          K.draw(headH, K.T(4.51), 0.2);
          [mem, his].forEach((d, i) => {
            const at = K.T(4.51 + i * 0.64);
            K.draw(d.box, at, 0.6);
            K.draw(d.handle, at + 0.3, 0.3);
            K.fade(d.t, at + 0.3, 0.3);
            K.fade(d.t1, at + 0.5, 0.3);
            K.fade(d.t2, at + 0.65, 0.3);
          });
          riders.forEach((r, i) => {
            const at = K.T(4.51) + 0.2 + i * 0.42;
            K.fade(r.g, at, 0.15);
            K.travel(r.g, r.path, at, 1.1);
            tl.to(r.g, { opacity: 0, duration: 0.2 }, at + 1.0);
          });
          checks.forEach((c, i) => {
            const at = K.T(6.42 + i * 0.64);
            K.draw(c.tick, at, 0.35);
            K.fade(c.t, at + 0.1, 0.35);
          });
          K.reveal(K.$("b1-s1"), K.T(8.34), 0.6);
          K.reveal(K.$("b1-s2"), K.T(8.97), 0.6);

          K.out(K.$("b1-content"), K.R(12.35), 0.4);
          window.__timelines["b1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
