<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b4 {
          position: absolute;
          inset: 0;
        }
      </style>
      <div data-hf-id="hf-rc50" id="b4" data-composition-id="b4" data-width="1920" data-height="1080">
        <div data-hf-id="hf-rc51" id="b4-content" class="layer">
          <div data-hf-id="hf-rc52" id="b4-lab-l" class="plate-label left">PLATE IV</div>
          <div data-hf-id="hf-rc53" id="b4-lab-r" class="plate-label right">CORRECTED</div>
          <svg data-hf-id="hf-rc54" id="b4-svg" class="full" viewBox="0 0 1920 1080"></svg>
          <div data-hf-id="hf-rc55" class="statement">
            <span data-hf-id="hf-rc56" id="b4-s1" class="phrase">Fixed in place.</span>
            <span data-hf-id="hf-rc57" id="b4-s2" class="phrase accent">What used it is flagged.</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text } = BP;
          const tl = gsap.timeline({ paused: true });
          const S = 40.25;
          const K = BP.kit(tl, S);
          const svg = K.$("b4-svg");

          // C was wrong from the start; D is a summary derived from it (both made up)
          const C = RC.card(svg, 260, 300, { kind: "FACT", title: "Nightly backup", body: "Backups run at", foot: "2026-10-04" });
          // the body's time sits on its own text nodes so the correction can swap just that value;
          // 20px IBM Plex Mono advances 12px a character, so "Backups run at " ends at 20 + 15 x 12
          const oldV = text("02:00 UTC.", { class: "cb", x: 200, y: 122 }, C.g);
          const newV = text("03:00 UTC.", { class: "cb", x: 200, y: 122, opacity: 0 }, C.g);
          const strike = el("path", { class: "ln accent-s", d: "M196 115H262" }, C.g);
          const rev2 = text("REV 2", { class: "cm on", x: RC.W - 20, y: 29, "text-anchor": "end", opacity: 0 }, C.g);
          const foot2 = text("CORRECTED 2026-10-11", { class: "cm on", x: RC.W - 20, y: 181, "text-anchor": "end", opacity: 0 }, C.g);
          const tagC = text("C", { class: "mono mint", x: 226, y: 330 }, svg);

          const D = RC.card(svg, 1200, 300, { kind: "SUMMARY", title: "Ops summary", body: "Backups nightly, 02:00.", foot: "DERIVED FROM C" });
          const tagD = text("D", { class: "mono mint", x: 1166, y: 330 }, svg);
          const link = el("path", { class: "ln line", d: "M1200 400H726" }, svg);
          const linkHead = RC.head(svg, 722, 400, "l");
          const linkT = text("DERIVED_FROM", { class: "mono small", x: 963, y: 382, "text-anchor": "middle" }, svg);

          // the call: correct takes the revision the caller read, a compare-and-set
          const call = text("CORRECT( C, EXPECTED_REVISION 1 )", { class: "mono mint", x: 490, y: 240, "text-anchor": "middle" }, svg);

          // the one invalidation rule walks C's dependents and marks them, keeping the rows
          const pulse = el("circle", { class: "fill-strong", r: 8, cx: 0, cy: 0, opacity: 0 }, svg);
          const pulsePath = el("path", { d: "M726 400H1200", fill: "none", stroke: "none" }, svg);
          const st = el("g", { transform: "rotate(-6 1430 520)" }, svg);
          const stR = el("rect", { class: "ln line-strong fill-bg", x: 1250, y: 498, width: 360, height: 44 }, st);
          const stT = text("INVALIDATED", { class: "stamp-t", x: 1430, y: 526, "text-anchor": "middle" }, st);
          const whyD = text("REASON: SOURCE_CORRECTED", { class: "mono small", x: 1200, y: 600 }, svg);
          const keptD = text("KEPT FOR A PERSON TO REVIEW", { class: "mono small dim", x: 1200, y: 628 }, svg);
          const noAuto = text("NOTHING RE-DERIVES ON ITS OWN", { class: "mono small dim", x: 1200, y: 656 }, svg);
          const whyC = text("SAME RECORD, REVISION COUNTED", { class: "mono small", x: 260, y: 600 }, svg);
          const reidx = text("RE-INDEXED FROM THE NEW TEXT", { class: "mono small dim", x: 260, y: 628 }, svg);

          K.fade(K.$("b4-lab-l"), K.T(40.89), 0.4);
          K.fade(K.$("b4-lab-r"), K.T(40.89), 0.4);
          RC.drawIn(K, C, K.T(41.53));
          K.fade(oldV, K.T(41.53) + 0.66, 0.3);
          K.fade(tagC, K.T(41.53) + 0.4, 0.3);
          RC.drawIn(K, D, K.T(42.81));
          K.fade(tagD, K.T(42.81) + 0.4, 0.3);
          K.draw(link, K.T(43.44), 0.6);
          K.draw(linkHead, K.T(43.44) + 0.55, 0.15);
          K.fade(linkT, K.T(43.44) + 0.3, 0.35);
          K.fade(call, K.T(44.72), 0.4);
          K.draw(strike, K.T(45.36), 0.35);
          tl.fromTo(oldV, { opacity: 1 }, { opacity: 0, duration: 0.3 }, K.T(46.0));
          tl.fromTo(strike, { opacity: 1 }, { opacity: 0, duration: 0.3 }, K.T(46.0));
          K.fade(newV, K.T(46.0) + 0.15, 0.35);
          tl.fromTo(C.rev, { opacity: 1 }, { opacity: 0, duration: 0.25 }, K.T(46.0));
          K.fade(rev2, K.T(46.0) + 0.15, 0.3);
          K.fade(foot2, K.T(46.64), 0.35);
          K.fade(whyC, K.T(46.64) + 0.2, 0.35);
          K.fade(reidx, K.T(46.64) + 0.4, 0.35);
          K.fade(pulse, K.T(47.28), 0.1);
          K.travel(pulse, pulsePath, K.T(47.28), 0.6, "power1.in");
          tl.to(pulse, { opacity: 0, duration: 0.15 }, K.T(47.28) + 0.6);
          tl.fromTo(D.root, { opacity: 1 }, { opacity: 0.5, duration: 0.5, ease: "power1.out" }, K.T(47.91));
          K.fade(stR, K.T(47.91), 0.15);
          K.fade(stT, K.T(47.91), 0.15);
          tl.fromTo(st, { scale: 1.25, transformOrigin: "1430px 520px" }, { scale: 1, transformOrigin: "1430px 520px", duration: 0.25, ease: "power2.out" }, K.T(47.91));
          K.fade(whyD, K.T(47.91) + 0.4, 0.35);
          K.fade(keptD, K.T(48.55), 0.35);
          K.fade(noAuto, K.T(48.55) + 0.25, 0.35);
          K.reveal(K.$("b4-s1"), K.T(48.55), 0.6);
          K.reveal(K.$("b4-s2"), K.T(49.19), 0.6);

          K.out(K.$("b4-content"), K.R(52.5), 0.4);
          window.__timelines["b4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
