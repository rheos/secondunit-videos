    <style>
      /* type on the patent sheets */
      svg text.ct { font-family: var(--font-mono); font-size: 25px; fill: var(--ink); }
      svg text.cb { font-family: var(--font-mono); font-size: 21px; fill: var(--ink); }
      svg text.cm { font-family: var(--font-label); font-size: 19px; letter-spacing: 0.08em; fill: var(--ink-dim); }
      svg text.cm.on { fill: var(--line-strong); }
      svg text.lab { font-family: var(--font-label); font-size: 25px; letter-spacing: 0.06em; fill: var(--line-strong); }
      svg text.lab.sm { font-size: 20px; }
      svg text.ty { font-family: var(--font-mono); font-size: 23px; fill: var(--ink); }
      svg text.ty.sm { font-size: 19px; fill: var(--ink-dim); }
      svg text.fig { font-family: var(--font-display); font-style: italic; font-size: 26px; fill: var(--ink-dim); }
      svg text.acc { fill: var(--accent); }
      svg text.stamp-t { font-family: var(--font-label); font-size: 24px; letter-spacing: 0.14em; fill: var(--accent); }
      .fill-strong { fill: var(--line-strong); }
      .fill-acc { fill: var(--accent); }
      .acc-s { stroke: var(--accent); }
      .statement { font-size: 76px; letter-spacing: 0; top: 812px; }
      .statement.two { top: 778px; flex-direction: column; align-items: center; font-size: 66px; row-gap: 2px; }
      .plate-label { letter-spacing: 0.12em; }
      /* the broadsheet field (plates I and X): cream, ink and oxblood, after recallatron.com */
      .sheet { position: absolute; inset: 0; background: var(--field); }
      .sheet .plate-label, .sheet .title, .sheet .statement { color: var(--ink-field); }
      .sheet .statement .accent { color: var(--accent-field); }
      .sheet svg text.lab { fill: var(--ink-field); }
      .sheet svg text.ty { fill: var(--ink-field); }
      .sheet svg text.ty.sm { fill: var(--line-field); }
      .sheet svg text.fig { fill: var(--line-field); }
      .sheet svg text.stamp-t { fill: var(--accent-field); }
      .sheet .ink-s { stroke: var(--ink-field); }
      .sheet .acc-s { stroke: var(--accent-field); }
      .sheet .fill-ink { fill: var(--ink-field); }
      .sheet .fill-paper { fill: var(--field); }
      .kick { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font-label); letter-spacing: 0.2em; color: var(--accent-field); }
    </style>
    <script>
      // RC: the film's drawing parts, shared by the plates. Memory contents are made up.
      window.RC = (() => {
        const { el, text } = BP;
        const W = 440,
          H = 220;
        // an index card (a memorandum): kind and revision in the header, title, body, a foot line
        function card(parent, x, y, s) {
          const root = el("g", {}, parent);
          const g = el("g", { transform: `translate(${x} ${y})` }, root);
          const P = { root, g, x, y, W, H };
          P.bg = el("rect", { class: "fill-raised", x: 0, y: 0, width: W, height: H }, g);
          P.frame = el("rect", { class: s.strong ? "ln line-strong" : "ln line", x: 0, y: 0, width: W, height: H }, g);
          P.rule1 = el("path", { class: "ln line-strong", d: `M0 46H${W}` }, g);
          P.rules = [94, 132, 170].map((yy) => el("path", { class: "ln thin line", d: `M18 ${yy + 8}H${W - 18}`, opacity: 0.35 }, g));
          P.kind = text(s.kind, { class: "cm on", x: 18, y: 31 }, g);
          P.rev = text(`REV. ${s.rev || 1}`, { class: "cm", x: W - 18, y: 31, "text-anchor": "end" }, g);
          P.title = text(s.title, { class: "ct", x: 18, y: 92 }, g);
          P.body = text(s.body, { class: "cb", x: 18, y: 131 }, g);
          P.foot = text(s.foot || "", { class: "cm", x: 18, y: 200 }, g);
          return P;
        }
        // draw a card in: the card lands (a filed card), then its text is typed
        function drawIn(K, P, at, o = {}) {
          K.stamp(P.root, at, { origin: `${P.x + W / 2} ${P.y + H / 2}`, sound: "card", from: o.from || 1.25, dur: 0.24 });
          K.draw(P.rule1, at + 0.15, 0.3, "power2.out", false);
          P.rules.forEach((r, i) => K.draw(r, at + 0.2 + i * 0.05, 0.3, "power2.out", false));
          const k = o.cps || 40;
          let t = at + 0.25;
          K.fade(P.kind, t, 0.2);
          K.fade(P.rev, t, 0.2);
          if (o.type === false) {
            [P.title, P.body, P.foot].forEach((n, i) => K.fade(n, t + 0.1 + i * 0.1, 0.25));
            return t + 0.5;
          }
          t = K.typed(P.title, t + 0.1, { cps: k, cursor: false }) + 0.08;
          t = K.typed(P.body, t, { cps: k }) + 0.08;
          if (P.foot.textContent) t = K.typed(P.foot, t, { cps: k * 1.4, cursor: false });
          return t;
        }
        // a callout: a leader line from a point to a label, the label typed after the line lands
        function callout(parent, x1, y1, x2, y2, label, o = {}) {
          const g = el("g", {}, parent);
          const dot = el("circle", { class: "fill-strong", cx: x1, cy: y1, r: 5 }, g);
          const line = el("path", { class: "ln thin line-strong", d: `M${x1} ${y1}L${x2} ${y2}H${x2 + (o.left ? -24 : 24)}` }, g);
          const t = text(label, { class: o.cls || "lab sm", x: x2 + (o.left ? -32 : 32), y: y2 + 7, "text-anchor": o.left ? "end" : "start" }, g);
          const sub = o.sub ? text(o.sub, { class: "ty sm", x: x2 + (o.left ? -32 : 32), y: y2 + 36, "text-anchor": o.left ? "end" : "start" }, g) : null;
          return { g, dot, line, t, sub };
        }
        function showCallout(K, c, at) {
          K.fade(c.dot, at, 0.15);
          K.draw(c.line, at, 0.3, "power2.out", false);
          K.sfx("tick", at);
          let e = K.typed(c.t, at + 0.3, { cps: 32, cursor: false });
          if (c.sub) e = K.typed(c.sub, e + 0.1, { cps: 38, cursor: false });
          return e;
        }
        // an arrowhead pointing r, l, u or d at (x, y)
        function head(parent, x, y, dir, cls) {
          const d = {
            l: `M${x + 14} ${y - 8}L${x} ${y}L${x + 14} ${y + 8}`,
            r: `M${x - 14} ${y - 8}L${x} ${y}L${x - 14} ${y + 8}`,
            u: `M${x - 8} ${y + 14}L${x} ${y}L${x + 8} ${y + 14}`,
            d: `M${x - 8} ${y - 14}L${x} ${y}L${x + 8} ${y - 14}`,
          }[dir];
          return el("path", { class: cls || "ln line-strong", d }, parent);
        }
        // a rubber stamp: a box of text, turned a little
        function stampBox(parent, label, cx, cy, w, o = {}) {
          const g = el("g", { transform: `rotate(${o.rot || -5} ${cx} ${cy})` }, parent);
          const r = el("rect", { class: `ln ${o.cls || "acc-s"}`, x: cx - w / 2, y: cy - 23, width: w, height: 46, style: "stroke-width: 3" }, g);
          const t = text(label, { class: "stamp-t", x: cx, y: cy + 8, "text-anchor": "middle" }, g);
          return { g, r, t, cx, cy };
        }
        // the card cabinet: a drawer front with a label holder and a pull
        function drawer(parent, x, y, w, h, label) {
          const g = el("g", {}, parent);
          const box = el("rect", { class: "ln line-strong", x, y, width: w, height: h }, g);
          const holder = el("rect", { class: "ln thin line-strong", x: x + w / 2 - 90, y: y + 18, width: 180, height: 40 }, g);
          const t = text(label, { class: "lab sm", x: x + w / 2, y: y + 45, "text-anchor": "middle" }, g);
          const pull = el("path", { class: "ln line-strong", d: `M${x + w / 2 - 40} ${y + h - 30}q40 26 80 0`, style: "stroke-width: 4" }, g);
          return { g, box, holder, t, pull };
        }
        return { card, drawIn, callout, showCallout, head, stampBox, drawer, W, H };
      })();
    </script>
  </head>
  <body>
