    <script>
      // RC.card(parent, x, y, spec): one memory, as an index card 460 x 200 in local coords.
      // The returned .root is an untransformed <g> so plates can move it with fromTo x/y;
      // the card's own position sits on an inner <g>. Memory contents are made up.
      window.RC = (() => {
        const { el, text } = BP;
        const W = 460,
          H = 200;
        function card(parent, x, y, s) {
          const root = el("g", {}, parent);
          const g = el("g", { transform: `translate(${x} ${y})` }, root);
          const P = { root, g, x, y, W, H };
          P.bg = el("rect", { class: "fill-raised", x: 0, y: 0, width: W, height: H }, g);
          P.frame = el("rect", { class: s.strong ? "ln line-strong" : "ln line", x: 0, y: 0, width: W, height: H }, g);
          P.rule1 = el("path", { class: "ln thin line", d: `M0 44H${W}` }, g);
          P.rule2 = el("path", { class: "ln thin line", d: `M0 150H${W}` }, g);
          P.kind = text(s.kind, { class: "cm on", x: 20, y: 29 }, g);
          P.rev = text(`REV ${s.rev || 1}`, { class: "cm", x: W - 20, y: 29, "text-anchor": "end" }, g);
          P.title = text(s.title, { class: "ct", x: 20, y: 84 }, g);
          P.body = text(s.body, { class: "cb", x: 20, y: 122 }, g);
          P.foot = text(s.foot, { class: "cm", x: 20, y: 181 }, g);
          return P;
        }
        // draw a card in: paper, frame, rules, then the text a beat-fraction apart
        function drawIn(K, P, at, quick) {
          const k = quick ? 0.5 : 1;
          K.fade(P.bg, at, 0.3);
          K.draw(P.frame, at, 0.7 * k);
          K.draw(P.rule1, at + 0.25 * k, 0.4 * k);
          K.draw(P.rule2, at + 0.35 * k, 0.4 * k);
          [P.kind, P.rev, P.title, P.body, P.foot].forEach((t, i) => K.fade(t, at + (0.3 + i * 0.12) * k, 0.3));
        }
        // a rubber stamp across a card (local coords of the card's inner <g>)
        function stamp(P, label, cx, cy, w) {
          const s = el("g", { transform: `rotate(-6 ${cx} ${cy})` }, P.g);
          const r = el("rect", { class: "ln line-strong", x: cx - w / 2, y: cy - 22, width: w, height: 44 }, s);
          const t = text(label, { class: "stamp-t", x: cx, y: cy + 6, "text-anchor": "middle" }, s);
          return { s, r, t };
        }
        // arrowhead pointing along (dx, dy) at (x, y)
        function head(parent, x, y, dir, cls) {
          const d = {
            l: `M${x + 14} ${y - 8}L${x} ${y}L${x + 14} ${y + 8}`,
            r: `M${x - 14} ${y - 8}L${x} ${y}L${x - 14} ${y + 8}`,
            u: `M${x - 8} ${y + 14}L${x} ${y}L${x + 8} ${y + 14}`,
            d: `M${x - 8} ${y - 14}L${x} ${y}L${x + 8} ${y - 14}`,
          }[dir];
          return el("path", { class: cls || "ln line", d }, parent);
        }
        return { card, drawIn, stamp, head, W, H };
      })();
