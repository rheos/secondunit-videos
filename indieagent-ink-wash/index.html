<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Ink Wash Test</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="js/inkkit.js"></script>
    <script src="js/scene.js"></script>
    <style>
      /* Ink-wash look test (after Leon Lin's shanshui, issue #312). Everything is drawn into one
         canvas by js/scene.js; the page only hosts it. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #efe7dc; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #efe7dc; }
      .clip { position: absolute; inset: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-duration="12">
      <div id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <canvas id="c" width="1280" height="720"></canvas>
      </div>
    </div>
    <script>
      const ctx = document.getElementById("c").getContext("2d", { willReadFrequently: true });
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: INKWASH.DUR, duration: INKWASH.DUR, ease: "none", onUpdate: () => INKWASH.draw(ctx, clock.t) }, 0);
      INKWASH.draw(ctx, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
