# Spike S2 and S3 (throwaway branch, never merged): the agent on a runner, and a cross-repo action.
name: s2-spike
run-name: "s2 spike"
on:
  push:
    branches: [autorevise-spike]
    paths: [spike/s2/**, .github/workflows/s2-spike.yml]
permissions: {}
env:
  PROXY_PORT: "3128"
  PROXY_ALLOW: "api.anthropic.com"
jobs:
  s2:
    if: ${{ !contains(github.event.head_commit.message, '[s3 only]') }}
    runs-on: ubuntu-latest
    environment: autorevise-spike
    permissions: { contents: read }   # checkout of a private repo needs it; nothing else is granted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: spike/s2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: boundary (root)
        run: sudo --preserve-env=PROXY_PORT bash spike/s2/setup.sh
      - name: services (proxy, sheet worker)
        run: bash spike/s2/services.sh
      - name: probes as agent
        run: python3 -I spike/s2/probes.py
      - name: claude as agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 -I spike/s2/run_agent.py
      - name: logs (no token, no environment)
        if: ${{ always() }}
        run: |
          echo "--- proxy.log"; cat /srv/ar/out/proxy.log || true
          echo "--- worker.log"; cat /srv/ar/out/worker.log || true
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: s2-findings
          path: spike/s2/findings.json
          retention-days: 1
          if-no-files-found: ignore
  s3:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - uses: rheos/secondunit-worker/spike-action@fd24c890df6984cd204e0aa4952f6de2ae6d8003
