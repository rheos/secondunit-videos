name: guard
on: pull_request
jobs:
  no-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sh .githooks/check-staged.sh origin/${{ github.base_ref }}
  toolbox-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml && python toolbox/index.py --check
