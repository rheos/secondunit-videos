# Spike S1 (throwaway branch, never merged): Linux reproduction with installed fonts.
name: s1-spike
run-name: "s1 spike"
on:
  push:
    branches: [autorevise-spike]
    paths: [spike/s1/**, .github/workflows/s1-spike.yml]
permissions: {}
env:
  PAGE_ASSET: "645458648"
  FONT_ASSET: "645458649"
jobs:
  s1:
    runs-on: ubuntu-latest
    permissions: { contents: write }   # the minimum that lets GITHUB_TOKEN read a draft release asset
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [check, stills-1, stills-2, ref, perf]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/motion-lab
            spike/s1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          JOB: ${{ matrix.job }}
        run: bash spike/s1/job.sh "${JOB%-*}"
      - if: ${{ always() && matrix.job != 'check' }}
        uses: actions/upload-artifact@v4
        with:
          name: s1-out-${{ matrix.job }}
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: ignore
