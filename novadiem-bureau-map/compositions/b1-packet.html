<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b1 {
          position: absolute;
          inset: 0;
        }
        #b1 .title {
          top: 168px;
          font-family: var(--font-label);
          font-size: 120px;
          letter-spacing: 0.08em;
        }
        #b1 .sub {
          position: absolute;
          left: 0;
          right: 0;
          top: 352px;
          text-align: center;
          font-size: 26px;
          color: var(--ink);
        }
        #b1 svg text.miss {
          font-family: var(--font-mono);
          font-size: 18px;
          letter-spacing: 0.12em;
          fill: var(--ink-dim);
        }
        #b1 svg text.stamp {
          font-family: var(--font-mono);
          font-size: 30px;
          font-weight: 700;
          letter-spacing: 0.16em;
          fill: var(--accent);
        }
        #b1 .stamp-box {
          fill: none;
          stroke: var(--accent);
          stroke-width: 3;
        }
      </style>
      <div id="b1" data-composition-id="b1" data-width="1920" data-height="1080">
        <div id="b1-all" class="layer">
          <svg class="full" viewBox="0 0 1920 1080">
            <path id="b1-rule" class="ln line" d="M660 322H1260M660 312V332M1260 312V332" />
            <g id="b1-pk"></g>
          </svg>
          <div class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate I</div>
          <div class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>Inside the Bureau · 1</div>
          <div id="b1-title" class="title">THE MAP</div>
          <div id="b1-sub" class="sub mono">HOW WORK MOVES THROUGH THE BUREAU</div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 0);

          K.reveal(K.$("b1-title"), K.T(0.95), 1.1);
          K.draw(K.$("b1-rule"), K.T(1.83), 0.8);
          K.reveal(K.$("b1-sub"), K.T(2.28), 0.8);

          // a packet marked finished, with nothing behind the word
          const X = 660,
            Y = 430;
          const P = BM.packet(K.$("b1-pk"), X, Y);
          K.draw(P.tab, K.T(2.72), 0.5);
          K.draw(P.body, K.T(2.72) + 0.3, 1.0, "none");
          K.fade(P.head, K.T(3.6), 0.4);
          K.draw(P.rule, K.T(3.6) + 0.1, 0.5);

          const stampTilt = el("g", { transform: `rotate(-6 ${X + 470} ${Y + 64})` }, P.g);
          const stamp = el("g", {}, stampTilt);
          el("rect", { class: "stamp-box", x: X + 372, y: Y + 40, width: 196, height: 50 }, stamp);
          text("FINISHED", { class: "stamp", x: X + 470, y: Y + 76, "text-anchor": "middle" }, stamp);
          tl.fromTo(stamp, { opacity: 0, scale: 1.25, svgOrigin: `${X + 470} ${Y + 64}` }, { opacity: 1, scale: 1, svgOrigin: `${X + 470} ${Y + 64}`, duration: 0.25, ease: "power2.in" }, K.T(4.04));

          P.rows.forEach((r, i) => {
            const at = K.T(4.48) + i * 0.22;
            K.fade(r.label, at, 0.35);
            K.draw(r.box, at + 0.1, 0.5);
            const miss = text("NOT FOUND", { class: "miss", x: r.cx, y: r.cy, "text-anchor": "middle" }, P.g);
            K.fade(miss, K.T(4.92) + i * 0.3, 0.3);
          });

          K.out(K.$("b1-all"), 7.8, 0.45);
          window.__timelines["b1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
