    <script>
      // BM: the one device of this film, a building cutaway of a Bureau run that grows plate by plate.
      // BM.build(parent, upto) draws every part whose stage <= upto and returns them by name. A plate
      // animates the parts of its own stage; earlier stages are already standing (static).
      //   stage 3 (Triage): owner, floor 1 (Conductor, workflow registry, Delegate + gate), the run dir with state.json, log.md
      //   stage 4 (Fresh Rooms): floor 2, Analizer 2000 and Architect rooms, spec.md, plan.md
      //   stage 5 (Cold Review): the Challenger room, plan.md rev 2, verdicts/
      //   stage 7 (Close-out): accounting.json
      window.BM = (() => {
        const { el, text } = BP;
        const FILES = { state: [372, "state.json", 3], log: [517, "log.md", 3], spec: [662, "spec.md", 4], plan: [807, "plan.md", 4], accounting: [1060, "accounting.json", 7], verdicts: [1242, "verdicts/", 5] };
        const ROOMS = {
          analizer: { x0: 312, name: "ANALIZER 2000", ctx: "CTX·01", stage: 4, glyph: "M-26 0A26 26 0 1 0 26 0A26 26 0 1 0 -26 0M-40 0H-18M18 0H40M0 -40V-18M0 18V40", spawn: "M490 290V342" },
          architect: { x0: 692, name: "ARCHITECT", ctx: "CTX·02", stage: 4, glyph: "M-30 28H30L-30 -32ZM-30 6A22 22 0 0 1 -8 28", spawn: "M500 290V318H870V342" },
          challenger: { x0: 1092, name: "CHALLENGER", ctx: "CTX·03", stage: 5, glyph: "M0 -34L34 0L0 34L-34 0Z", spawn: "M510 290V324H1270V342" },
        };
        function build(parent, upto) {
          const P = { files: {}, rooms: {} };
          const on = (s) => s <= upto;
          const g = (p) => el("g", {}, p || parent);
          if (on(3)) {
            // owner: a control point outside the building, not a person
            const o = (P.owner = { g: g() });
            o.ring = el("circle", { class: "ln ink", cx: 1700, cy: 200, r: 28 }, o.g);
            o.cross = el("path", { class: "ln thin ink", d: "M1656 200H1744M1700 156V244" }, o.g);
            o.core = el("circle", { class: "fill-ink", cx: 1700, cy: 200, r: 6 }, o.g);
            o.label = text("OWNER", { class: "mono", x: 1700, y: 136, "text-anchor": "middle" }, o.g);
            // floor 1 shell: roof, outer walls, the floor between floors 1 and 2, two partitions
            const f = (P.floor1 = { g: g() });
            f.shell = el("path", { class: "ln ink", d: "M300 330V140H1460V330" }, f.g);
            f.floor = el("path", { class: "ln ink", d: "M300 330H1460" }, f.g);
            f.part1 = el("path", { class: "ln thin ink", d: "M700 140V330" }, f.g);
            f.part2 = el("path", { class: "ln thin ink", d: "M1080 140V330" }, f.g);
            f.lCond = text("CONDUCTOR", { class: "mono", x: 320, y: 168 }, f.g);
            f.lReg = text("WORKFLOWS", { class: "mono", x: 720, y: 168 }, f.g);
            f.lDel = text("DELEGATE", { class: "mono", x: 1100, y: 168 }, f.g);
            // the workflow registry: four of its twenty rows
            const r = (P.registry = { g: g(), rows: [], names: [] });
            r.frame = el("rect", { class: "ln thin ink", x: 730, y: 184, width: 320, height: 118 }, r.g);
            ["feature", "bug-fix", "execute-plan", "code-review"].forEach((n, i) => {
              r.rows.push(el("rect", { class: "ln thin ink", x: 744, y: 194 + i * 26, width: 292, height: 22 }, r.g));
              r.names.push(text(n, { class: "mono small", x: 756, y: 210 + i * 26 }, r.g));
            });
            r.more = text("+ 16 MORE", { class: "mono small dim", x: 1060, y: 168, "text-anchor": "end" }, r.g);
            r.pick = el("path", { class: "ln line-strong", d: "M740 191H1040V219H740Z" }, r.g);
            r.tick = el("path", { class: "ln line-strong", d: "M1006 204L1013 211L1026 197" }, r.g);
            // the Delegate's gate: a striped arm across the way out, hinged at the floor
            const d = (P.delegate = { g: g() });
            d.foot = el("path", { class: "ln ink", d: "M1404 300H1436" }, d.g);
            d.hinge = el("circle", { class: "ln ink", cx: 1420, cy: 294, r: 5 }, d.g);
            d.arm = el("g", {}, d.g);
            d.armBox = el("rect", { class: "ln ink", x: 1413, y: 206, width: 14, height: 82 }, d.arm);
            d.stripes = [0, 1, 2].map((i) => el("rect", { class: "fill-ink", x: 1413, y: 214 + i * 26, width: 14, height: 12 }, d.arm));
            // the spawn line from the Delegate to the Conductor, along the top of floor 1
            P.spawnConductor = el("path", { class: "ln thin ink", d: "M1350 226V184H490V210", opacity: 0.55 }, parent);
            // the Conductor
            const c = (P.conductor = { g: g() });
            c.crossH = el("path", { class: "ln line construct", d: "M420 250H560" }, c.g);
            c.crossV = el("path", { class: "ln line construct", d: "M490 196V304" }, c.g);
            c.outer = el("circle", { class: "ln ink", cx: 490, cy: 250, r: 40 }, c.g);
            c.inner = el("circle", { class: "ln thin ink", cx: 490, cy: 250, r: 30 }, c.g);
            c.core = el("circle", { class: "ln ink", cx: 490, cy: 250, r: 5 }, c.g);
            // the ground and the run dir below it
            const b = (P.base = { g: g(), hatch: [] });
            b.ground = el("path", { class: "ln ink", d: "M220 520H1540" }, b.g);
            for (let x = 232; x <= 292; x += 12) b.hatch.push(el("path", { class: "ln thin ink", d: `M${x} 524l-10 14`, opacity: 0.6 }, b.g));
            for (let x = 1472; x <= 1532; x += 12) b.hatch.push(el("path", { class: "ln thin ink", d: `M${x} 524l-10 14`, opacity: 0.6 }, b.g));
            b.walls = el("path", { class: "ln ink", d: "M300 520V700H1460V520" }, b.g);
            b.shelf = el("path", { class: "ln thin ink", d: "M320 640H1440", opacity: 0.5 }, b.g);
            b.label = text("RUN DIR", { class: "mono", x: 320, y: 556 }, b.g);
            b.path = text(".bureau/runs/<date>-<task>/", { class: "mono small dim", x: 424, y: 556 }, b.g);
          }
          if (on(4)) {
            const f2 = (P.floor2 = { g: g() });
            f2.walls = el("path", { class: "ln ink", d: "M300 330V520M1460 330V520" }, f2.g);
          }
          Object.entries(ROOMS).forEach(([k, R]) => {
            if (!on(R.stage)) return;
            const rm = (P.rooms[k] = { g: g() });
            const cx = R.x0 + 178;
            rm.cx = cx;
            rm.spawn = el("path", { class: "ln thin ink", d: R.spawn, opacity: 0.55 }, rm.g);
            rm.outer = el("rect", { class: "ln ink", x: R.x0, y: 342, width: 356, height: 166 }, rm.g);
            rm.inner = el("rect", { class: "ln thin ink", x: R.x0 + 8, y: 350, width: 340, height: 150 }, rm.g);
            const gg = el("g", { transform: `translate(${cx} 410)` }, rm.g);
            rm.glyph = el("path", { class: "ln line", d: R.glyph }, gg);
            rm.label = text(R.name, { class: "mono", x: cx, y: 488, "text-anchor": "middle" }, rm.g);
            rm.ctx = text(R.ctx, { class: "mono small", x: R.x0 + 22, y: 374, opacity: 0.6 }, rm.g);
          });
          Object.entries(FILES).forEach(([k, [cx, name, stage]]) => {
            if (!on(stage)) return;
            const fl = (P.files[k] = { g: g(), cx });
            if (k === "verdicts") {
              fl.body = el("path", { class: "ln line", d: `M${cx - 20} 598V636H${cx + 20}V604H${cx - 2}L${cx - 7} 598Z` }, fl.g);
              fl.fold = el("path", { class: "ln thin line", d: `M${cx - 20} 612H${cx + 20}` }, fl.g);
              fl.lines = el("path", { class: "ln thin line", d: `M${cx - 12} 622H${cx + 12}` }, fl.g);
            } else {
              fl.body = el("path", { class: "ln line", d: `M${cx - 18} 590H${cx + 8}L${cx + 18} 600V636H${cx - 18}Z` }, fl.g);
              fl.fold = el("path", { class: "ln thin line", d: `M${cx + 8} 590V600H${cx + 18}` }, fl.g);
              fl.lines = el("path", { class: "ln thin line", d: `M${cx - 10} 608H${cx + 10}M${cx - 10} 616H${cx + 12}M${cx - 10} 624H${cx + 4}` }, fl.g);
            }
            fl.label = text(name, { class: "mono small", x: cx, y: 664, "text-anchor": "middle" }, fl.g);
          });
          if (on(5)) P.planRev = text("rev 2", { class: "mono small gold-t", x: 807, y: 684, "text-anchor": "middle" }, parent);
          return P;
        }

        // a work packet that moves: a small folder with a label under it, drawn around (0,0)
        function token(parent, label, x, y) {
          const t = el("g", { transform: `translate(${x} ${y})` }, parent);
          el("path", { class: "fill-bg", d: "M-26 -14H26V19H-26Z" }, t);
          el("path", { class: "ln ink", d: "M-26 -14H26V19H-26ZM-26 -14V-19H-6L-2 -14" }, t);
          el("path", { class: "ln thin line", d: "M-16 -2H16M-16 6H10" }, t);
          if (label) text(label, { class: "mono tok", x: 0, y: 40, "text-anchor": "middle" }, t);
          return t;
        }
        // a sheet of paper in transit (a finding, a file going to disk)
        function sheet(parent, x, y) {
          const t = el("g", { transform: `translate(${x} ${y})` }, parent);
          el("path", { class: "fill-bg", d: "M-10 -13H4L10 -7V13H-10Z" }, t);
          el("path", { class: "ln line", d: "M-10 -13H4L10 -7V13H-10Z" }, t);
          return t;
        }

        // the work packet of plates I and VII: three slots that should hold the run's record
        function packet(parent, x, y) {
          const P = { g: el("g", {}, parent), rows: [] };
          P.body = el("path", { class: "ln ink", d: `M${x} ${y + 30}H${x + 600}V${y + 300}H${x}Z` }, P.g);
          P.tab = el("path", { class: "ln ink", d: `M${x} ${y + 30}V${y}H${x + 190}L${x + 214} ${y + 30}` }, P.g);
          P.head = text("WORK PACKET", { class: "mono head", x: x + 30, y: y + 82 }, P.g);
          P.rule = el("path", { class: "ln thin ink", d: `M${x + 30} ${y + 102}H${x + 570}` }, P.g);
          ["DECISIONS", "REVIEW", "EVIDENCE"].forEach((n, i) => {
            const ry = y + 150 + i * 52;
            const r = {};
            r.label = text(n, { class: "mono", x: x + 30, y: ry + 7 }, P.g);
            r.box = el("rect", { class: "ln thin ink", x: x + 250, y: ry - 20, width: 320, height: 38 }, P.g);
            r.cx = x + 410;
            r.cy = ry + 6;
            P.rows.push(r);
          });
          return P;
        }
        return { build, token, sheet, packet, FILES, ROOMS };
      })();
    </script>
