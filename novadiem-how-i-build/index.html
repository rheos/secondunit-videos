    <script>
      // HB.flow(parent, keys): the delivery flow, drawn into one <g> at stage coords. Each plate builds the
      // state it inherits (fully drawn) plus the parts it draws itself. keys pick which parts exist; every part
      // is its own <g> so a plate can fade it as a whole. Returns the nodes for cueing.
      window.HB = (() => {
        const { el, text } = BP;
        const ADV = 11.5; // 16px Plex Mono advance + 0.12em tracking
        function flow(parent, keys) {
          const has = (k) => keys.includes(k);
          const P = {};
          const g = (k) => (P[k] = { g: el("g", { id: `hb-${k}-${parent.id}` }, parent) });
          if (has("main")) {
            const p = g("main");
            p.line = el("path", { class: "ln thin ink", d: "M120 600H1800", opacity: 0.5 }, p.g);
            p.label = text("MAIN", { class: "mono small dim", x: 128, y: 632 }, p.g);
          }
          if (has("issue")) {
            const p = g("issue");
            p.paper = el("rect", { class: "fill-bg", x: 130, y: 290, width: 300, height: 190 }, p.g);
            p.frame = el("rect", { class: "ln ink", x: 130, y: 290, width: 300, height: 190 }, p.g);
            p.head = el("g", {}, p.g);
            text("ISSUE", { class: "mono", x: 150, y: 326 }, p.head);
            text("OPEN", { class: "mono small gold-t", x: 410, y: 326, "text-anchor": "end" }, p.head);
            p.rule = el("path", { class: "ln thin ink", d: "M130 342H430" }, p.g);
            p.crit = text("ACCEPTANCE CRITERIA", { class: "mono small dim", x: 150, y: 374 }, p.g);
            p.rows = [200, 160, 214].map((w, i) => {
              const y = 404 + i * 28;
              const r = el("g", {}, p.g);
              el("rect", { class: "ln thin ink", x: 150, y: y - 14, width: 16, height: 16 }, r);
              el("path", { class: "ln thin ink", d: `M180 ${y - 6}h${w}`, opacity: 0.45 }, r);
              return r;
            });
          }
          if (has("branch")) {
            const p = g("branch");
            p.fork = el("circle", { class: "fill-line", cx: 540, cy: 600, r: 6 }, p.g);
            p.line = el("path", { class: "ln thick line-strong", d: "M540 600C600 600 600 420 660 420H1180" }, p.g);
          }
          if (has("commits")) {
            const p = g("commits");
            p.dots = [740, 840, 940, 1040].map((x) => el("circle", { class: "ln line-strong dot-bg", cx: x, cy: 420, r: 9 }, p.g));
          }
          if (has("pr")) {
            const p = g("pr");
            p.frame = el("rect", { class: "ln thin line-strong", x: 600, y: 330, width: 600, height: 170 }, p.g);
            p.draft = text("DRAFT PR", { class: "mono small gold-t", x: 620, y: 358 }, p.g);
          }
          if (has("merged")) {
            const p = g("merged");
            p.label = text("PR · MERGED", { class: "mono small gold-t", x: 620, y: 358 }, p.g);
          }
          if (has("link")) {
            const p = g("link");
            p.line = el("path", { class: "ln ink construct", d: "M432 372H598" }, p.g);
            p.label = text("CLOSES", { class: "mono small dim center", x: 515, y: 360 }, p.g);
          }
          if (has("checks")) {
            const p = g("checks");
            p.gate = el("path", { class: "ln ink", d: "M1120 402V438", style: "stroke-width: 4" }, p.g);
            p.label = text("CHECKS", { class: "mono small dim center", x: 1120, y: 474 }, p.g);
            p.boxes = [1084, 1112, 1140].map((x) => el("rect", { class: "ln thin ink", x: x - 8, y: 352, width: 16, height: 16 }, p.g));
            p.ticks = [1084, 1112, 1140].map((x) => el("path", { class: "ln line-strong", d: `M${x - 5} 360l4 4l7 -10` }, p.g));
          }
          if (has("review")) {
            const p = g("review");
            p.leader = el("path", { class: "ln thin line-strong", d: "M1120 348V262" }, p.g);
            p.outer = el("rect", { class: "ln ink", x: 900, y: 150, width: 440, height: 110 }, p.g);
            p.inner = el("rect", { class: "ln thin ink", x: 908, y: 158, width: 424, height: 94 }, p.g);
            p.title = text("INDEPENDENT REVIEW", { class: "mono center", x: 1120, y: 200 }, p.g);
            p.sub = text("FRESH CONTEXT", { class: "mono small dim center", x: 1120, y: 232 }, p.g);
            p.when = text("WHEN A DIFF TOUCHES", { class: "mono small dim", x: 1372, y: 180 }, p.g);
            p.tagA = text("DURABLE STATE · MONEY", { class: "mono small gold-t", x: 1372, y: 210 }, p.g);
            p.tagB = text("AUTH · OUTBOUND SENDS", { class: "mono small gold-t", x: 1372, y: 238 }, p.g);
          }
          if (has("merge")) {
            const p = g("merge");
            p.line = el("path", { class: "ln thick line-strong", d: "M1180 420C1240 420 1240 600 1300 600" }, p.g);
            p.node = el("circle", { class: "ln line-strong dot-bg", cx: 1300, cy: 600, r: 14 }, p.g);
            p.core = el("circle", { class: "fill-line", cx: 1300, cy: 600, r: 5 }, p.g);
            p.label = text("MERGE COMMIT", { class: "mono small center", x: 1300, y: 652 }, p.g);
            p.bracket = el("path", { class: "ln thin line-strong", d: "M740 398V388H1040V398" }, p.g);
            p.kept = text("EVERY COMMIT KEPT", { class: "mono small gold-t center", x: 890, y: 378 }, p.g);
          }
          if (has("live")) {
            const p = g("live");
            p.line = el("path", { class: "ln thick line-strong", d: "M1314 600H1590" }, p.g);
            p.box = el("rect", { class: "ln ink dot-bg", x: 1590, y: 570, width: 180, height: 60 }, p.g);
            p.label = text("DEPLOY", { class: "mono center", x: 1680, y: 607 }, p.g);
            p.leader = el("path", { class: "ln thin line-strong", d: "M1680 568V502" }, p.g);
            p.screen = el("rect", { class: "ln ink dot-bg", x: 1560, y: 340, width: 240, height: 160 }, p.g);
            p.bar = el("path", { class: "ln thin ink", d: "M1560 368H1800" }, p.g);
            p.tag = text("LIVE", { class: "mono small gold-t", x: 1576, y: 360 }, p.g);
            p.dot = el("circle", { class: "fill-line", cx: 1782, cy: 354, r: 5 }, p.g);
            p.hatch = [120, 140, 96].map((w, i) => el("path", { class: "ln thin ink", d: `M1580 ${404 + i * 26}h${w}`, opacity: 0.45 }, p.g));
            p.tick = el("path", { class: "ln thick line-strong", d: "M1732 434l14 14l28 -36" }, p.g);
          }
          return P;
        }
        return { flow, ADV };
      })();
