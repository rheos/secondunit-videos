sit:
  prompt: "This asset belongs to a hyper quality, very interesting music video. Deliver polished visual detail ready for expressive animation. True two-tone scratchboard engraving, after a 1930s scraperboard book illustration: pure solid black ground with the image carved out in crisp WHITE engraved lines only. Exactly two tones, no grey, no gradients, no airbrush, no soft glow, no colour. Form is built from the direction and density of the line hatching; most of the frame stays solid black; light exists only where the fire touches something, as scratched rim light. Confident, simplified strokes; silhouettes read instantly. No text, no lettering, no logos, no watermark. The same Antlered Wolf as the attached sheet: same design, slender antlers with one tine each, thick smoke-tipped tail, white engraved fur, white eyes. A NEW drawing, not a crop of the sheet: seen from behind, sitting, its thick tail curled around to the left on the ground, head turned up and to the left as if looking at someone standing beside it; antlers in clear silhouette. The wolf fills 60% of frame height, centred, with margin all round. Background: perfectly flat chroma green #00B140 instead of black; the character's own black areas stay pure black; no floor, no ground line, no shadow, no other figures, no text."
