serpent:
  base: false
  refs:
  - style-s1
  - ref-s2
  - ref-s5
  prompt: 'This asset belongs to a hyper quality music video. True two-tone scratchboard
    engraving, after a 1930s scraperboard book illustration: pure solid black ground
    with the image carved out in crisp WHITE engraved lines only. Exactly two tones,
    no grey, no gradients, no airbrush, no soft glow, no colour. Form is built from
    the direction and density of the line hatching. No text, no lettering, no logos,
    no watermark. Draw THE SERPENT from images 2 and 3: a giant rattlesnake made of
    smoke, its huge head with heat pits, slit eyes and bared fangs exactly like image
    2, its long body made of swirling, translucent ribbons of smoke that trail and
    curl off it, coiling through a great thin ring of light exactly like image 3.
    Render it entirely in the engraving technique of image 1: the smoke as flowing
    white engraved lines on black, the scales as fine hatching, the ring a thin double
    engraved line. The serpent rises from the bottom of the frame, its body looping
    once through the ring, its head at the top of the ring looking down to the right,
    jaws open. No man, no figure, no cactus, no landscape, no moon disc: only the
    serpent and the ring, isolated on a perfectly flat chroma green #00B140 background.
    Fills 95% of the frame height.'
