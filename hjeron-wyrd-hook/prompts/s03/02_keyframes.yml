---
sky:
  base: false
  refs:
  - style-s1
  prompt: 'This asset belongs to a hyper quality, very interesting music video. Deliver
    polished visual detail ready for expressive animation. True two-tone scratchboard
    engraving, after a 1930s scraperboard book illustration: pure solid black ground
    with the image carved out in crisp WHITE engraved lines only. Exactly two tones,
    no grey, no gradients, no airbrush, no soft glow, no colour. Form is built from
    the direction and density of the line hatching; most of the frame stays solid
    black; light exists only where the fire touches something, as scratched rim light.
    Confident, simplified strokes; silhouettes read instantly. No text, no lettering,
    no logos, no watermark. Use the attached image ONLY as the reference for the engraving
    technique and line quality; draw a NEW scene, and no people, no figures, no animals
    in it. An empty night sky over a far, low desert horizon at the very bottom fifth
    of the frame, 16:9 landscape. Long thin streaks of high cloud, a dense engraved
    star field filling the sky. Nothing else.'
