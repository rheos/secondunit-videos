sky:
  base: false
  refs: ["style-s1"]
  prompt: "This asset belongs to a hyper quality, very interesting music video. Deliver polished visual detail ready for expressive animation. True two-tone scratchboard engraving, after a 1930s scraperboard book illustration: pure solid black ground with the image carved out in crisp WHITE engraved lines only. Exactly two tones, no grey, no gradients, no airbrush, no soft glow, no colour. Form is built from the direction and density of the line hatching; most of the frame stays solid black; light exists only where the fire touches something, as scratched rim light. Confident, simplified strokes; silhouettes read instantly. No text, no lettering, no logos, no watermark. Use the attached image ONLY as the reference for the engraving technique and line quality; draw a NEW scene, and no people, no figures, no animals in it. An empty night sky over a far, low desert horizon at the very bottom fifth of the frame, 16:9 landscape. Long thin streaks of high cloud, a dense engraved star field filling the sky. Nothing else."
back:
  prompt: "This asset belongs to a hyper quality, very interesting music video. Deliver polished visual detail ready for expressive animation. True two-tone scratchboard engraving, after a 1930s scraperboard book illustration: pure solid black ground with the image carved out in crisp WHITE engraved lines only. Exactly two tones, no grey, no gradients, no airbrush, no soft glow, no colour. Form is built from the direction and density of the line hatching; most of the frame stays solid black; light exists only where the fire touches something, as scratched rim light. Confident, simplified strokes; silhouettes read instantly. No text, no lettering, no logos, no watermark. The same character as the attached sheet, the Wyrd One: same design, same two-tone style; wide-brim hat, dense black cord-fringe veil hanging from the brim hiding the whole face (no face, no mouth, no eyes visible), long dark wavy hair, long shredded duster, laced boots, beaded rosette amulet, black Les Paul with both neck and bridge pickups and the white antlered-wolf headstock. A NEW drawing in a new pose, not a crop of the sheet: seen from directly behind, full body, standing still, head tipped up toward the sky, arms at his sides; the Les Paul is slung on his back UPSIDE DOWN with the neck pointing to the bottom right, body facing outward. The figure fills 85% of frame height, boots inside the frame with margin. Background: perfectly flat chroma green #00B140 instead of black; the character's own black areas stay pure black; no floor, no ground line, no shadow, no other figures, no text."
