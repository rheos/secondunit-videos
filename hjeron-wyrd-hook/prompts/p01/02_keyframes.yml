  prompt: 'This asset belongs to a hyper quality, very interesting music video. Deliver
    polished visual detail ready for expressive animation. True two-tone scratchboard
    engraving, after a 1930s scraperboard book illustration: pure solid black ground
    with the image carved out in crisp WHITE engraved lines only. Exactly two tones,
    no grey, no gradients, no airbrush, no soft glow, no colour. Form is built from
    the direction and density of the line hatching; most of the frame stays solid
    black; light exists only where fire or the sun touches something, as scratched
    rim light. Confident, simplified strokes; silhouettes read instantly. No text,
    no lettering, no logos, no watermark. Use the attached image ONLY as the reference
    for the engraving technique and line quality; draw a NEW scene, with no people,
    no figures and no animals in it. 16:9 landscape. A huge sun disc rising behind
    a line of flat-topped buttes on a desert horizon, the disc engraved with fine
    concentric hatching and a ragged corona of scratched rays; long bands of cloud
    lit from below; the foreground plain in deep black with a few rim-lit rocks. The
    sun disc sits a little left of centre, its lower third behind the buttes, with
    clear empty space inside the disc.'
