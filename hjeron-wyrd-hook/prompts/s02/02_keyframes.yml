close:
  prompt: "This asset belongs to a hyper quality, very interesting music video. Deliver polished visual detail ready for expressive animation. True two-tone scratchboard engraving, after a 1930s scraperboard book illustration: pure solid black ground with the image carved out in crisp WHITE engraved lines only. Exactly two tones, no grey, no gradients, no airbrush, no soft glow, no colour. Form is built from the direction and density of the line hatching; most of the frame stays solid black; light exists only where the fire touches something, as scratched rim light. Confident, simplified strokes; silhouettes read instantly. No text, no lettering, no logos, no watermark. The same character as the attached sheet, the Wyrd One: same design, same two-tone style; wide-brim hat, dense black cord-fringe veil hanging from the brim hiding the whole face (no face, no mouth, no eyes visible), long dark wavy hair, long shredded duster, laced boots, beaded rosette amulet, black Les Paul with both neck and bridge pickups and the white antlered-wolf headstock. A NEW drawing in a new pose, not a crop of the sheet: close-up of the head and shoulders, three-quarter view, slightly low angle, head turned away toward screen-left, hat brim and veil fill 60% of frame height, cords hanging straight, amulet just visible at the bottom. Whole hat inside frame with margin. Background: perfectly flat chroma green #00B140 instead of black; the character's own black areas stay pure black; no floor, no ground line, no shadow, no other figures, no text."
close2:
  base: "close"
  prompt: "Same image, same framing, same hat, hair, coat and amulet; change ONLY the veil. The veil is a dense curtain of many thin MATTE BLACK cords hanging straight from the hat brim and hiding the whole face: no beads, no knots, no white dots, no white highlights on the cords, the cord tips are black. The veil reads as a solid black fringe with only a few very fine white scratch lines along a handful of cords where firelight catches them. Keep the flat chroma green #00B140 background and the two-tone white-line-on-black scratchboard style."
