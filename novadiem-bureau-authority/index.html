    <script>
      // AG: the one device of this film, an authority gate. Work comes back from the Conductor along
      // one track to the Delegate's station. Routine work passes the gate and the run continues; a real
      // fork turns up the branch to the owner's control point (a labelled symbol, never a person).
      window.AG = (() => {
        const { el, text } = BP;
        const Y = 560; // the track
        const DX0 = 840,
          DX1 = 1120,
          DCX = 980; // the Delegate's station
        const GX = 1260; // the gate post
        const OY = 236; // the owner's control point
        const PY = 340; // where a packet waits on the branch

        // rig(parent): every part of the drawing; a plate animates the parts it needs
        function rig(parent) {
          const P = { g: el("g", {}, parent) };
          const g = P.g;
          P.cond = el("rect", { class: "ln ink", x: 120, y: Y - 40, width: 260, height: 80 }, g);
          P.condL = text("CONDUCTOR", { class: "mono", x: 250, y: Y + 74, "text-anchor": "middle" }, g);
          P.trackA = el("path", { class: "ln ink", d: `M380 ${Y}H${DX0}` }, g);
          P.del = el("rect", { class: "ln ink", x: DX0, y: Y - 40, width: DX1 - DX0, height: 80 }, g);
          P.delL = text("DELEGATE", { class: "mono", x: DCX, y: Y + 74, "text-anchor": "middle" }, g);
          P.trackB = el("path", { class: "ln ink", d: `M${DX1} ${Y}H1760M1746 ${Y - 10}L1762 ${Y}L1746 ${Y + 10}` }, g);
          P.onL = text("RUN CONTINUES", { class: "mono", x: 1600, y: Y - 40, "text-anchor": "middle" }, g);
          // the gate: a striped arm hinged above the track; it lifts by swinging back over the station
          P.hinge = el("circle", { class: "ln ink", cx: GX, cy: 440, r: 6 }, g);
          P.post = el("path", { class: "ln ink", d: `M${GX} 434V418` }, g);
          P.arm = el("g", {}, g);
          el("rect", { class: "fill-bg", x: GX - 7, y: 448, width: 14, height: 160 }, P.arm);
          el("rect", { class: "ln ink", x: GX - 7, y: 448, width: 14, height: 160 }, P.arm);
          [0, 1, 2, 3].forEach((i) => el("rect", { class: "fill-ink", x: GX - 7, y: 458 + i * 40, width: 14, height: 20 }, P.arm));
          P.gateL = text("GATE", { class: "mono small dim", x: GX, y: 404, "text-anchor": "middle" }, g);
          // the cold reviewer, below the station
          P.link = el("path", { class: "ln ink", d: `M1060 ${Y + 40}V656M1050 642L1060 658L1070 642` }, g);
          P.room = el("rect", { class: "ln ink", x: 870, y: 660, width: 220, height: 112 }, g);
          P.roomIn = el("rect", { class: "ln thin ink", x: 878, y: 668, width: 204, height: 96 }, g);
          P.roomL = text("COLD REVIEWER", { class: "mono", x: 980, y: 712, "text-anchor": "middle" }, g);
          P.roomS = text("READ-ONLY", { class: "mono small dim", x: 980, y: 740, "text-anchor": "middle" }, g);
          // the branch up to the owner's control point
          P.branch = el("path", { class: "ln ink", d: `M${DCX} ${Y - 40}V${OY + 46}` }, g);
          P.cpO = el("circle", { class: "ln ink", cx: DCX, cy: OY, r: 44 }, g);
          P.cpI = el("circle", { class: "ln thin ink", cx: DCX, cy: OY, r: 32 }, g);
          P.cpD = el("path", { class: "ln line-strong", d: `M${DCX} ${OY - 20}L${DCX + 20} ${OY}L${DCX} ${OY + 20}L${DCX - 20} ${OY}Z`, style: "stroke-width:3" }, g);
          P.cpL = text("OWNER", { class: "mono big", x: DCX + 66, y: OY - 2 }, g);
          P.cpS = text("CONTROL POINT", { class: "mono small dim", x: DCX + 66, y: OY + 26 }, g);
          return P;
        }
        const groups = (P) => ({
          base: [P.cond, P.condL, P.trackA, P.del, P.delL, P.trackB, P.onL, P.hinge, P.post, P.arm, P.gateL],
          review: [P.link, P.room, P.roomIn, P.roomL, P.roomS],
          owner: [P.branch, P.cpO, P.cpI, P.cpD, P.cpL, P.cpS],
        });
        // draw the track, the station and the gate
        function drawBase(K, P, at) {
          K.draw(P.cond, at, 0.6, "none");
          K.fade(P.condL, at + 0.3, 0.3);
          K.draw(P.trackA, at + 0.4, 0.6);
          K.draw(P.del, at + 0.7, 0.6, "none");
          K.fade(P.delL, at + 1.0, 0.3);
          K.draw(P.trackB, at + 1.1, 0.8);
          K.draw(P.hinge, at + 1.3, 0.3);
          K.draw(P.post, at + 1.3, 0.2);
          K.fade(P.arm, at + 1.4, 0.35);
          K.fade(P.gateL, at + 1.5, 0.3);
          K.fade(P.onL, at + 1.7, 0.35);
        }
        function drawReview(K, P, at) {
          K.draw(P.link, at, 0.35);
          K.draw(P.room, at + 0.2, 0.6, "none");
          K.draw(P.roomIn, at + 0.45, 0.5, "none");
          K.fade(P.roomL, at + 0.6, 0.3);
          K.fade(P.roomS, at + 0.75, 0.3);
        }
        function drawOwner(K, P, at) {
          K.draw(P.branch, at, 0.7);
          K.draw(P.cpO, at + 0.5, 0.6);
          K.draw(P.cpI, at + 0.8, 0.5);
          K.draw(P.cpD, at + 1.0, 0.4);
          K.reveal(P.cpL, at + 1.0, 0.5);
          K.fade(P.cpS, at + 1.3, 0.35);
        }
        // a plate that carries the drawing over from the last one shows it whole
        function show(K, nodes, at, dur = 0.35) {
          nodes.forEach((n) => K.fade(n, at, dur));
        }
        function hide(nodes) {
          nodes.forEach((n) => n && n.setAttribute("display", "none"));
        }
        function lift(tl, P, at) {
          tl.fromTo(P.arm, { rotation: 0, svgOrigin: `${GX} 440` }, { rotation: 90, svgOrigin: `${GX} 440`, duration: 0.5, ease: "power2.inOut" }, at);
        }
        function lower(tl, P, at) {
          tl.fromTo(P.arm, { rotation: 90, svgOrigin: `${GX} 440` }, { rotation: 0, svgOrigin: `${GX} 440`, duration: 0.45, ease: "power2.inOut", immediateRender: false }, at);
        }

        // a work packet: a labelled card that rides the track. packet(parent, label, x, y)
        function packet(parent, label, x, y, o = {}) {
          const w = Math.round(label.length * 14.4 + 46);
          const h = 46;
          const g = el("g", { transform: `translate(${x} ${y})` }, parent);
          el("rect", { class: "fill-bg", x: -w / 2, y: -h / 2, width: w, height: h }, g);
          el("rect", { class: `ln ${o.cls || "ink"}`, x: -w / 2, y: -h / 2, width: w, height: h, style: "stroke-width:2.5" }, g);
          el("path", { class: "ln thin line-strong", d: `M${-w / 2 + 12} ${-h / 2 + 8}V${h / 2 - 8}` }, g);
          text(label, { class: "mono", x: 7, y: 7, "text-anchor": "middle" }, g);
          return { g, w, x, y };
        }
        // move a packet along a path drawn in stage coordinates
        function move(K, tl, pk, d, at, dur) {
          return K.travel(pk.g, el("path", { d }), at, dur);
        }
        function appear(tl, pk, at, dur = 0.3) {
          tl.fromTo(pk.g, { opacity: 0 }, { opacity: 1, duration: dur }, at);
        }
        function vanish(tl, pk, at, dur = 0.3) {
          tl.fromTo(pk.g, { opacity: 1 }, { opacity: 0, duration: dur, immediateRender: false }, at);
        }

        // a framed card with a title: card(parent, x, y, w, h, title)
        function card(parent, x, y, w, h, title) {
          const C = { g: el("g", {}, parent), x, y, w, h };
          C.paper = el("rect", { class: "fill-bg", x, y, width: w, height: h }, C.g);
          C.frame = el("rect", { class: "ln ink", x, y, width: w, height: h }, C.g);
          C.title = text(title, { class: "mono head", x: x + 24, y: y + 40 }, C.g);
          C.rule = el("path", { class: "ln thin ink", d: `M${x + 24} ${y + 58}H${x + w - 24}` }, C.g);
          return C;
        }
        function drawCard(K, C, at) {
          K.fade(C.paper, at, 0.2);
          K.draw(C.frame, at, 0.6, "none");
          K.fade(C.title, at + 0.25, 0.3);
          K.draw(C.rule, at + 0.3, 0.4);
        }
        // one row of a card: a dim key and an ink value
        function row(C, i, key, val, o = {}) {
          const y = C.y + 100 + i * (o.step || 50);
          const r = { y };
          r.key = text(key, { class: "mono small dim", x: C.x + 28, y }, C.g);
          r.val = text(val, { class: `mono ${o.cls || ""}`, x: C.x + (o.vx || 200), y }, C.g);
          return r;
        }
        function drawRow(K, r, at) {
          K.fade(r.key, at, 0.3);
          K.reveal(r.val, at + 0.1, 0.5);
        }

        const check = (parent, x, y, cls = "line-strong") => el("path", { class: `ln ${cls}`, d: `M${x - 12} ${y}l8 9l16 -20`, style: "stroke-width:3" }, parent);
        const cross = (parent, x, y, cls = "ink") => el("path", { class: `ln ${cls}`, d: `M${x - 10} ${y - 10}l20 20M${x + 10} ${y - 10}l-20 20`, style: "stroke-width:3" }, parent);

        // a sheet in transit (a staged packet, a record being written)
        function sheet(parent, x, y) {
          const t = el("g", { transform: `translate(${x} ${y})` }, parent);
          el("path", { class: "fill-bg", d: "M-12 -15H5L12 -8V15H-12Z" }, t);
          el("path", { class: "ln line", d: "M-12 -15H5L12 -8V15H-12Z" }, t);
          el("path", { class: "ln thin line", d: "M-6 -4H6M-6 3H6M-6 10H2" }, t);
          return t;
        }
        function carry(K, tl, parent, d, at, dur) {
          const s = sheet(parent, 0, 0);
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.15 }, at);
          K.travel(s, el("path", { d }), at, dur);
          tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, at + dur);
          return s;
        }

        return { Y, DX0, DX1, DCX, GX, OY, PY, rig, groups, drawBase, drawReview, drawOwner, show, hide, lift, lower, packet, move, appear, vanish, card, drawCard, row, drawRow, check, cross, sheet, carry };
      })();
    </script>
