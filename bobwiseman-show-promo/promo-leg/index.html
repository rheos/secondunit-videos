<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables="[{&quot;id&quot;: &quot;act&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Act&quot;, &quot;default&quot;: &quot;TWO PIANOS NO RODEO&quot;}, {&quot;id&quot;: &quot;with&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Who (blank if it changes per show)&quot;, &quot;default&quot;: &quot;Bob Wiseman &amp; Mike Boguski&quot;}, {&quot;id&quot;: &quot;span&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Leg dates&quot;, &quot;default&quot;: &quot;OCT 20-31&quot;}, {&quot;id&quot;: &quot;dates&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Shows (JSON list of dow/date/city/venue/with)&quot;, &quot;default&quot;: &quot;[{\&quot;dow\&quot;: \&quot;TUE\&quot;, \&quot;date\&quot;: \&quot;OCT 20\&quot;, \&quot;city\&quot;: \&quot;Wolfville, NS\&quot;, \&quot;venue\&quot;: \&quot;Al Whittle Theatre\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;WED\&quot;, \&quot;date\&quot;: \&quot;OCT 21\&quot;, \&quot;city\&quot;: \&quot;Fredericton, NB\&quot;, \&quot;venue\&quot;: \&quot;Charlotte Street Arts Centre\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;THU\&quot;, \&quot;date\&quot;: \&quot;OCT 22\&quot;, \&quot;city\&quot;: \&quot;Saint John, NB\&quot;, \&quot;venue\&quot;: \&quot;Venue TBA\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;FRI\&quot;, \&quot;date\&quot;: \&quot;OCT 23\&quot;, \&quot;city\&quot;: \&quot;Miramichi, NB\&quot;, \&quot;venue\&quot;: \&quot;Water Street Dinner Theatre\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;SAT\&quot;, \&quot;date\&quot;: \&quot;OCT 24\&quot;, \&quot;city\&quot;: \&quot;Souris, PEI\&quot;, \&quot;venue\&quot;: \&quot;Souris Show Hall\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;SUN\&quot;, \&quot;date\&quot;: \&quot;OCT 25\&quot;, \&quot;city\&quot;: \&quot;Truro, NS\&quot;, \&quot;venue\&quot;: \&quot;Marigold Centre\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;TUE\&quot;, \&quot;date\&quot;: \&quot;OCT 27\&quot;, \&quot;city\&quot;: \&quot;Annapolis Valley, NS\&quot;, \&quot;venue\&quot;: \&quot;Lower Granville Hall\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;WED\&quot;, \&quot;date\&quot;: \&quot;OCT 28\&quot;, \&quot;city\&quot;: \&quot;Sackville, NB\&quot;, \&quot;venue\&quot;: \&quot;Ducky&#x27;s\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;THU\&quot;, \&quot;date\&quot;: \&quot;OCT 29\&quot;, \&quot;city\&quot;: \&quot;Dartmouth, NS\&quot;, \&quot;venue\&quot;: \&quot;Sanctuary Arts Centre\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;FRI\&quot;, \&quot;date\&quot;: \&quot;OCT 30\&quot;, \&quot;city\&quot;: \&quot;Charlottetown, PEI\&quot;, \&quot;venue\&quot;: \&quot;PEI Brewing Company\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}, {\&quot;dow\&quot;: \&quot;SAT\&quot;, \&quot;date\&quot;: \&quot;OCT 31\&quot;, \&quot;city\&quot;: \&quot;Margaretsville, NS\&quot;, \&quot;venue\&quot;: \&quot;Evergreen Theatre\&quot;, \&quot;with\&quot;: \&quot;Bob Wiseman &amp; Mike Boguski\&quot;}]&quot;}, {&quot;id&quot;: &quot;slug&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;File slug&quot;, &quot;default&quot;: &quot;leg-oct20-31&quot;}]"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/plane-rig.js"></script>
    <script src="assets/voc.js"></script>
    <style>
      @font-face {
        font-family: "Archivo Black";
        src: url("assets/ArchivoBlack.ttf") format("truetype");
      }
      @font-face {
        font-family: "Permanent Marker";
        src: url("assets/PermanentMarker.ttf") format("truetype");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f3ead7; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f3ead7; }

      /* riso inks */
      :root { --pink: #ff4f8b; --blue: #2f5bd3; --paper: #f3ead7; --ink: #1d1a33; }
      .ink { mix-blend-mode: multiply; }
      .layer { position: absolute; inset: 0; }

      /* scene A: the hook */
      #hook { position: absolute; left: 70px; right: 70px; top: 170px; }
      .word {
        display: block; position: relative;
        font-family: "Archivo Black", sans-serif; text-transform: uppercase;
        line-height: 0.9; letter-spacing: -2px;
      }
      .word .p, .word .b { display: block; }
      .word .b { position: absolute; left: 0; top: 0; }
      .word .p { color: #e6477d; }
      .word .b { color: var(--blue); }
      #w1 { font-size: 150px; }
      #w2 { font-size: 168px; }
      #w3 { font-size: 150px; }
      #w4 { font-size: 176px; }
      #strange {
        position: absolute; left: 90px; top: 1010px; width: 900px;
        font-family: "Permanent Marker", cursive; font-size: 76px; color: var(--ink);
        transform-origin: left center;
      }

      /* the road */
      #road { position: absolute; left: 0; top: 1290px; width: 1080px; height: 330px; }

      /* scene B: the show card */
      #wipe { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: var(--blue); }
      #card { position: absolute; inset: 0; color: var(--paper); }
      /* header + dates as one centred column above the road */
      #stack { position: absolute; left: 70px; right: 70px; top: 90px; bottom: 300px;
        display: flex; flex-direction: column; justify-content: center; }
      #act {
        font-family: "Archivo Black", sans-serif; font-size: 112px; line-height: 0.92;
        letter-spacing: -2px; color: var(--paper); text-shadow: 7px 5px 0 var(--pink);
      }
      #with { margin-top: 22px; font-family: "Permanent Marker", cursive; font-size: 50px; color: var(--paper); }
      #span { align-self: flex-start; margin-top: 22px; padding: 8px 18px 4px;
        font-family: "Archivo Black", sans-serif; font-size: 40px; letter-spacing: 4px;
        background: var(--paper); color: var(--blue); }
      #list { margin-top: 30px; }
      .row { position: relative; border-bottom: 3px dashed var(--pink); }
      .row .when { position: absolute; left: 0; top: 0; bottom: 0; width: 290px;
        display: flex; flex-direction: column; justify-content: center; }
      .row .dow { font-family: "Archivo Black", sans-serif; letter-spacing: 3px; opacity: 0.8; }
      .row .date { font-family: "Archivo Black", sans-serif; line-height: 1; }
      .row .where { position: absolute; left: 300px; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; justify-content: center; }
      .row .city { font-family: "Archivo Black", sans-serif; line-height: 1.05; }
      .row .venue, .row .who { font-family: "Permanent Marker", cursive; line-height: 1.15; }
      .row .who { color: var(--paper); text-decoration: underline 4px var(--pink); text-underline-offset: 8px; }
      #site {
        position: absolute; left: 0; right: 0; top: 1835px; text-align: center;
        font-family: "Archivo Black", sans-serif; font-size: 38px; letter-spacing: 4px; color: var(--paper);
      }
      #rig { position: absolute; inset: 0; width: 1080px; height: 1920px; }

      #grain { position: absolute; inset: 0; opacity: 0.22; pointer-events: none; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29.0"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene A: the sung hook -->
      <div id="sceneA" class="clip layer" data-start="0" data-duration="9.2" data-track-index="1">
        <div id="hook" data-layout-allow-overlap>
          <div class="word" id="w1" data-layout-allow-overlap><span class="p ink" data-layout-allow-overlap>I'm an</span><span class="b ink" data-layout-allow-overlap>I'm an</span></div>
          <div class="word" id="w2" data-layout-allow-overlap><span class="p ink" data-layout-allow-overlap>airplane</span><span class="b ink" data-layout-allow-overlap>airplane</span></div>
          <div class="word" id="w3" data-layout-allow-overlap><span class="p ink" data-layout-allow-overlap>on the</span><span class="b ink" data-layout-allow-overlap>on the</span></div>
          <div class="word" id="w4" data-layout-allow-overlap><span class="p ink" data-layout-allow-overlap>highway</span><span class="b ink" data-layout-allow-overlap>highway</span></div>
        </div>
        <div id="strange">and I feel so strange.</div>

        <svg id="road" viewBox="0 0 1080 330">
          <rect x="0" y="40" width="1080" height="250" fill="#1d1a33" opacity="0.88" class="ink" />
          <g id="dashes">
            <rect x="20" y="158" width="110" height="16" fill="#f3ead7" />
            <rect x="250" y="158" width="110" height="16" fill="#f3ead7" />
            <rect x="480" y="158" width="110" height="16" fill="#f3ead7" />
            <rect x="710" y="158" width="110" height="16" fill="#f3ead7" />
            <rect x="940" y="158" width="110" height="16" fill="#f3ead7" />
            <rect x="1170" y="158" width="110" height="16" fill="#f3ead7" />
          </g>
          <rect x="0" y="40" width="1080" height="10" fill="#ff4f8b" class="ink" />
          <rect x="0" y="280" width="1080" height="10" fill="#ff4f8b" class="ink" />
        </svg>
      </div>

      <!-- Scene B: the show -->
      <div id="sceneB" class="clip layer" data-start="8.6" data-duration="20.4" data-track-index="2">
        <div id="wipe"></div>
        <div id="card">
          <div id="stack">
            <div id="act">TWO PIANOS NO RODEO</div>
            <div id="with">Bob Wiseman &amp; Mike Boguski</div>
            <div id="span">OCT 20-31</div>
            <div id="list"></div>
          </div>
          <div id="site">BOBWISEMAN.CA</div>
        </div>
      </div>

      <!-- the drawn layer: the Airplane-type plane rig, redrawn every frame from the timeline -->
      <canvas id="rig" class="clip" data-layout-ignore width="1080" height="1920" data-start="0" data-duration="29.0" data-track-index="3"></canvas>

      <!-- paper grain over everything (static, seeded) -->
      <svg id="grain" class="clip" data-start="0" data-duration="29.0" data-track-index="5" viewBox="0 0 1080 1920">
        <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1080" height="1920" filter="url(#n)" />
      </svg>

      <audio
        id="song"
        src="assets/airplane-leg.wav"
        data-start="0"
        data-duration="29.0"
        data-track-index="4"
        data-volume="1"
      ></audio>
    </div>

    <script>
      // one-line fields shrink to fit, so long city or venue names never wrap into the next block
      const v = window.__hyperframes.getVariables();
      const shows = JSON.parse(v.dates);
      document.getElementById("act").textContent = v.act;
      document.getElementById("with").textContent = v.with;
      document.getElementById("span").textContent = v.span + "  /  " + shows.length + " SHOWS";
      const n = shows.length;
      if (!v.with) document.getElementById("with").style.display = "none";
      const list = document.getElementById("list");
      shows.forEach((r, i) => {
        const row = document.createElement("div");
        row.className = "row"; row.id = "row" + i;
        const who = !v.with && r.with && r.with !== "solo" ? r.with : "";
        row.innerHTML =
          '<div class="when"><div class="dow"></div><div class="date"></div></div>' +
          '<div class="where"><div class="city"></div><div class="venue"></div>' + (who ? '<div class="who"></div>' : "") + "</div>";
        row.querySelector(".dow").textContent = r.dow;
        row.querySelector(".date").textContent = r.date;
        row.querySelector(".city").textContent = r.city;
        row.querySelector(".venue").textContent = r.venue;
        if (who) row.querySelector(".who").textContent = who;
        list.appendChild(row);
      });
      function fitEl(el) {
        el.style.whiteSpace = "nowrap";
        let fs = parseFloat(getComputedStyle(el).fontSize);
        while (el.scrollWidth > el.clientWidth && fs > 18) { fs -= 1; el.style.fontSize = fs + "px"; }
      }
      // rows share whatever height the header leaves, so 3 shows get big rows and 11 get tight ones
      function sizeRows() {
        const stack = document.getElementById("stack");
        const head = list.offsetTop - stack.firstElementChild.offsetTop;
        const H = Math.min(190, (stack.clientHeight - head) / n), k = Math.min(1.7, H / 88);
        list.querySelectorAll(".row").forEach((row) => {
          row.style.height = H + "px";
          const third = row.querySelector(".who") ? 0.82 : 1;
          row.querySelector(".dow").style.fontSize = 24 * k + "px";
          row.querySelector(".date").style.fontSize = 50 * k + "px";
          row.querySelector(".city").style.fontSize = 42 * k * third + "px";
          row.querySelector(".venue").style.fontSize = 30 * k * third + "px";
          if (row.querySelector(".who")) row.querySelector(".who").style.fontSize = 30 * k * third + "px";
        });
      }

      document.fonts.ready.then(() => {
      fitEl(document.getElementById("with"));
      sizeRows();
      document.querySelectorAll(".row .city, .row .venue, .row .who, .row .date").forEach(fitEl);
      const tl = gsap.timeline({ paused: true });

      // misregistration: the blue plate sits a few px off the pink
      gsap.set(".word .b", { x: 7, y: 5, opacity: 0.85 });

      // words land on the sung syllables (song time = clip time + 70.8 s)
      const slam = (sel, t) =>
        tl.fromTo(sel, { scale: 1.5, opacity: 0, rotation: -4 },
          { scale: 1, opacity: 1, rotation: 0, duration: 0.22, ease: "back.out(2.2)", transformOrigin: "left center" }, t);
      slam("#w1", 0.78);
      slam("#w2", 2.08);
      slam("#w3", 3.16);
      slam("#w4", 4.0);
      // the plates jitter apart on "highway"
      tl.fromTo("#w4 .b", { x: 7 }, { x: 18, duration: 0.12, yoyo: true, repeat: 3, ease: "none" }, 4.05);

      // the road scrolls, the plane drives
      tl.fromTo("#dashes", { x: 0 }, { x: -460, duration: 9.2, ease: "none" }, 0);

      // "and I feel so strange": scrawled on, plane wobbles
      tl.fromTo("#strange", { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 1.6, ease: "none" }, 6.1);

      // Scene B: blue ink rolls up over the page
      tl.fromTo("#wipe", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.inOut" }, 8.6);
      tl.fromTo("#act", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 9.0);
      tl.fromTo("#with", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.4);
      tl.fromTo("#span", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", transformOrigin: "left center" }, 9.7);
      // the dates stamp in one after another, all down within about three seconds
      const step = Math.min(0.32, 3.0 / n);
      shows.forEach((r, i) => {
        tl.fromTo("#row" + i, { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.28, ease: "back.out(1.8)" }, 10.1 + i * step);
      });
      tl.fromTo("#site", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 10.4 + n * step);

      // ---- the rig: one pure function of time, so any frame can be drawn on a seek ----
      const ctx = document.getElementById("rig").getContext("2d");
      PL.use(ctx);
      const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
      const inv = (a, b, x) => cl((x - a) / (b - a));
      const outQ = (u) => 1 - (1 - u) * (1 - u);
      const inQ = (u) => u * u;
      const voc = (t) => { const f = t * VOC.fps, i = Math.floor(f), u = f - i, a = VOC.v;
        return (a[cl(i, 0, a.length - 1)] * (1 - u) + a[cl(i + 1, 0, a.length - 1)] * u); };
      const INKS_A = { bg: "#f3ead7", ink: "#1d1a33", dim: "#8a8398", hot: "#e6477d" };
      const INKS_B = { bg: "#2f5bd3", ink: "#f3ead7", dim: "#9db2ec", hot: "#ff4f8b" };

      function draw(t) {
        ctx.clearRect(0, 0, 1080, 1920);
        if (t < 8.9) {
          Object.assign(PL.C, INKS_A);
          // rolls in, sits under the words, wobbles on "strange", then floors it out before the wipe
          const x = -520 + 1060 * outQ(inv(0, 1.4, t)) + 1300 * inQ(inv(8.1, 8.9, t));
          const bump = Math.abs(Math.sin(t * 9)) * 4;
          const wob = Math.sin((t - 6.4) * 9) * 0.07 * (inv(6.4, 6.7, t) - inv(7.9, 8.1, t));
          const looking = t > 0.7 && t < 5.6; // eyes up at each word as it lands
          const blink = t > 5.2 && t < 5.35 ? 1 : 0;
          PL.side(x, 1500 - bump, 1.05, t, {
            lw: 5, mouth: cl(voc(t) * 1.5), rot: wob, spin: t * 14,
            look: looking ? [-0.55, -0.9] : [0.7, 0.1],
            lid: blink || (t > 6.2 && t < 7.5 ? 0.35 : 0), frown: t > 6.2 && t < 7.5 ? 0.6 : 0,
            spiral: t > 7.55 && t < 8.6 ? t * 7 : 0, smile: t > 7.5 ? -0.2 : 0.3,
          });
        } else if (t > 10.7) {
          Object.assign(PL.C, INKS_B);
          const Y = 1790;
          // the road along the bottom of the card
          ctx.fillStyle = "#f3ead7"; ctx.fillRect(0, Y + 2, 1080, 4);
          for (let dx = -((t * 120) % 140); dx < 1080; dx += 140) ctx.fillRect(dx, Y + 22, 70, 4);
          // "and I'm sick of the passing lane": a little car blows past in the far lane
          const cu = inv(15.9, 16.9, t);
          if (cu > 0 && cu < 1) drawCar(-260 + 1600 * cu, Y - 6);
          // drives in, creeps along; never leaves the road
          const x = -260 + 620 * outQ(inv(10.7, 14.0, t)) + 260 * inv(14.0, 29.0, t);
          const bump = Math.abs(Math.sin(x * 0.05)) * 2;
          const sky = inv(26.6, 27.1, t);          // "...that in the sky flew"
          const watchCar = t > 15.9 && t < 17.6;  // looks back at the car going by
          PL.side(x, Y - bump, 0.45, t, {
            lw: 4, mouth: cl(voc(t) * 1.5), spin: x / 18,
            look: sky > 0 ? [0.3, -0.95] : watchCar ? [-0.2 + 1.2 * cu, -0.2] : [0.7, 0],
            frown: watchCar && cu > 0.6 ? 0.6 : sky * 0.4, lid: sky * 0.3,
            smile: watchCar || sky > 0 ? -0.25 : 0.3,
          });
        }
      }
      function drawCar(x, y) {
        ctx.save(); ctx.translate(x, y); ctx.lineWidth = 4; ctx.strokeStyle = "#f3ead7"; ctx.fillStyle = "#ff4f8b";
        ctx.beginPath(); ctx.roundRect(-95, -58, 190, 40, 12); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-50, -58); ctx.lineTo(-30, -92); ctx.lineTo(40, -92); ctx.lineTo(62, -58); ctx.closePath(); ctx.fill(); ctx.stroke();
        for (const wx of [-55, 55]) { ctx.beginPath(); ctx.arc(wx, -16, 17, 0, Math.PI * 2); ctx.fillStyle = "#1d1a33"; ctx.fill(); ctx.stroke(); }
        // speed lines
        ctx.fillStyle = "#f3ead7"; for (const [ly, lw] of [[-70, 90], [-45, 130], [-25, 70]]) ctx.fillRect(-110 - lw, ly, lw, 4);
        ctx.restore();
      }
      draw(0);
      const P = { t: 0 };
      tl.fromTo(P, { t: 0 }, { t: 29.0, duration: 29.0, ease: "none", onUpdate: () => draw(P.t) }, 0);

      window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
