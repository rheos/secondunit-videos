<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body><template>
<style>
 #root { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; }
 #city-strains-canvas { position:absolute; inset:0; width:100%; height:100%; }
</style>
<div data-hf-id="hf-rnsb" id="root" data-composition-id="city-strains" data-duration="2.75" data-width="1920" data-height="1080">
 <canvas data-hf-id="hf-qd0b" id="city-strains-canvas" class="clip" data-layout-allow-overflow="" data-start="0" data-duration="2.75" data-track-index="0" width="1920" height="1080"></canvas>
</div>
<script>
(function(){
 window.TravelProof.ready.then(function(){
  const surface=document.getElementById("city-strains-canvas");
  const drive={time:0};
  const tl=gsap.timeline({paused:true});
  tl.fromTo(drive,{time:0},{time:2.75,duration:2.75,ease:"none",
   onUpdate:function(){window.TravelProof.draw(surface,0+drive.time,0);}},0);
  window.TravelProof.draw(surface,0,0);
  window.__timelines["city-strains"]=tl;
 });
})();
</script>
</template></body></html>
