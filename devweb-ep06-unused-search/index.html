<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;700&display=block" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="vo/words.js"></script>
    <script src="overlays.js"></script>
    <script src="kit/blink-geo.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/" } }
    </script>
    <style>
      :root { --bg: #0d1117; --text: #ffffff; --faint: #7b8593; --green: #6ad08a; --sans: "IBM Plex Sans", sans-serif; --mono: "IBM Plex Mono", monospace; }
      html, body { margin: 0; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--text); font-family: var(--sans); background: var(--bg); }
      .abs { position: absolute; }
      .layer { position: absolute; inset: 0; }
      .hide { opacity: 0; }
      .chrome { left: 66px; right: 66px; top: 1774px; display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 30px; font-weight: 500; }
      .bar { left: 66px; right: 66px; bottom: 75px; height: 4px; background: #1c2333; }
      .ov { width: 1400px; text-align: center; font-weight: 700; white-space: nowrap; line-height: 1; text-shadow: 0 4px 30px rgba(0,0,0,.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="79.35" data-width="1080" data-height="1920">
      <audio id="mix" src="_in/mix.wav" data-start="0" data-duration="79.35" data-track-index="20" data-volume="1"></audio>
      <!-- the world: one Three.js scene, one camera (world.js) -->
      <canvas id="world" width="1080" height="1920" style="position:absolute;left:0;top:0;width:1080px;height:1920px"></canvas>
      <div id="stage" class="layer" style="pointer-events:none"></div>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const stage = document.getElementById("stage");
        window.BP = window.BP || {};
        BP.CUES = BP.CUES || [];
        const cue = (k, t, extra) => BP.CUES.push(Object.assign({ k, t: +t.toFixed(3) }, extra || {}));
        const w = (word, n) => VO.w(word, n);
        const F = (el, from, to, at) => tl.fromTo(el, from, Object.assign({ immediateRender: false }, to), at);
        const mk = (tag, cls, css, parent, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (css) n.style.cssText = css; if (html != null) n.innerHTML = html; (parent || stage).appendChild(n); return n; };
        const show = (el, at) => F(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, at);
        const hide = (el, at, d = 0.2) => F(el, { opacity: 1 }, { opacity: 0, duration: d, ease: "power2.in" }, at);
        const slam = (el, at) => { cue("slam", at + 0.16); return F(el, { opacity: 0, scale: 1.45, rotate: -3 }, { opacity: 1, scale: 1, rotate: 0, duration: 0.3, ease: "back.out(1.6)" }, at); };
        // one line of type by its board numbers: centre x, baseline y, size
        const line = (s, x, base, size) => mk("div", "abs ov hide", `left:${x - 700}px;top:${base - size * 0.8}px;font-size:${size}px;letter-spacing:-0.02em`, stage, `<span style="display:inline-block">${s}</span>`);

        // chrome: lockup, topic tag, progress
        const chrome = mk("div", "abs chrome", "", stage, `<span><span style="color:var(--green)">~/</span>devweb</span><span style="color:var(--faint);font-size:26px">// defaults</span>`);
        const bar = mk("div", "abs bar");
        const barIn = mk("div", null, "height:4px;background:var(--green);transform-origin:left;transform:scaleX(0)", bar);
        F(barIn, { scaleX: 0 }, { scaleX: 1, duration: VO.END, ease: "none" }, 0);
        const endIn = w("one", 4) + 0.36;
        hide(chrome, endIn, 0.4); hide(bar, endIn, 0.4);

        // the words, places and times are in overlays.js, where check-graybox.mjs can read them
        const placed = [];
        window.OVERLAYS(w).forEach(({ lines, at, gone, big }) => lines.forEach(([s, x, base, size]) => {
          const el = line(s, x, base, size);
          placed.push({ el, x, size, s });
          (big ? slam : show)(el, at);
          hide(el, gone - 0.2);
        }));
        // measured, once the face is in: every overlay keeps a 48 px margin in the 1080 frame, or it shrinks and says so
        window.fitOverlays = () => placed.forEach(({ el, x, size, s }) => {
          const width = el.firstChild.offsetWidth, room = 2 * Math.min(x - 48, 1032 - x);
          if (width > room) { console.warn(`FIT: overlay "${s}" ${width} px, room ${room}`); (BP.FIT = BP.FIT || []).push(s); el.style.fontSize = `${size * (room / width)}px`; }
        });

        // the end mark, over the whole world, dimmed
        const mark = mk("div", "abs ov hide", "left:-160px;top:96px;font-family:var(--mono);font-size:92px", stage, `<span style="color:var(--green)">~/</span>devweb`);
        F(mark, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, endIn);

        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: VO.END, duration: VO.END, ease: "none", immediateRender: false, onUpdate: () => { if (window.renderWorld) window.renderWorld(clock.t); } }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module">
      import { buildWorld } from "./world.js";
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let ready; window.__hf.buildReady["world"] = new Promise((r) => (ready = r));
      await document.fonts.load("700 80px 'IBM Plex Sans'");
      window.fitOverlays();
      const render = await buildWorld(document.getElementById("world"));
      window.renderWorld = render;
      window.addEventListener("hf-seek", (ev) => render(ev.detail.time));
      render(window.__hfThreeTime || 0);
      ready();
    </script>
  </body>
</html>
