    <script>
      // OL: the one device of the film, Ana and Ben joined by a FOAF trustline (synthetic people and amounts).
      // OL.pair(parent, opts) draws it at fixed positions; plate I animates it in, later plates redraw it whole.
      window.OL = (() => {
        const { el, text } = BP;
        const AX = 560, BX = 1360, Y = 290; // Ana left (lender), Ben right (borrower)
        function person(parent, x, name, role, stroke) {
          const g = el("g", {}, parent);
          const head = el("circle", { class: `ln ${stroke}`, cx: x, cy: Y - 24, r: 32 }, g);
          const body = el("path", { class: `ln ${stroke}`, d: `M${x - 62} ${Y + 70}C${x - 62} ${Y + 18} ${x + 62} ${Y + 18} ${x + 62} ${Y + 70}` }, g);
          const nm = text(name, { class: "who", x, y: Y + 106, "text-anchor": "middle" }, g);
          const rl = text(role, { class: "role", x, y: Y + 132, "text-anchor": "middle" }, g);
          return { g, head, body, nm, rl };
        }
        function pair(parent, { field = false } = {}) {
          const s = field ? "paper-s" : "ink";
          const l = field ? "line-field" : "line";
          const P = {};
          P.ana = person(parent, AX, "ANA", "LENDER", s);
          P.ben = person(parent, BX, "BEN", "BORROWER", s);
          P.line = el("path", { class: `ln ${l}`, d: `M${AX + 84} ${Y}H${BX - 84}`, style: "stroke-width: 3" }, parent);
          P.ends = el("path", { class: `ln ${l}`, d: `M${AX + 84} ${Y - 10}V${Y + 10}M${BX - 84} ${Y - 10}V${Y + 10}` }, parent);
          P.tag = text("FOAF TRUSTLINE", { class: "mono small", x: 960, y: Y - 18, "text-anchor": "middle" }, parent);
          P.credit = text("ANA → BEN · CREDIT 100.00", { class: "mono small", x: 960, y: Y + 34, "text-anchor": "middle" }, parent);
          return P;
        }
        // a car in profile, about 420 wide, wheels on y = base
        function car(parent, cx, base, stroke = "ink") {
          const g = el("g", { transform: `translate(${cx - 960} ${base - 700})` }, parent);
          const body = el("path", { class: `ln ${stroke}`, d: "M794 700H752V646Q752 636 762 636H812L872 584H1040L1104 636H1158Q1168 636 1168 646V700H1126M1054 700H866" }, g);
          const win = el("path", { class: `ln thin ${stroke}`, d: "M884 594H1032L1076 632H840ZM958 594V632" }, g);
          const w1 = el("circle", { class: `ln ${stroke}`, cx: 830, cy: 700, r: 34 }, g);
          const w2 = el("circle", { class: `ln ${stroke}`, cx: 1090, cy: 700, r: 34 }, g);
          const h1 = el("circle", { class: `ln thin ${stroke}`, cx: 830, cy: 700, r: 10 }, g);
          const h2 = el("circle", { class: `ln thin ${stroke}`, cx: 1090, cy: 700, r: 10 }, g);
          return { g, parts: [body, win, w1, w2, h1, h2] };
        }
        return { pair, car, AX, BX, Y };
      })();
    </script>
