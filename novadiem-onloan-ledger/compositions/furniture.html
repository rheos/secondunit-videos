  <body>
    <template>
      <style>
        #furniture {
          position: absolute;
          inset: 0;
          background: var(--bg);
        }
      </style>
      <div data-hf-id="hf-ol10" id="furniture" data-composition-id="furniture" data-width="1920" data-height="1080">
        <svg data-hf-id="hf-ol11" id="fu-ground" class="full" viewBox="0 0 1920 1080" aria-hidden="true" style="will-change: transform"></svg>
        <svg data-hf-id="hf-ol12" id="fu-frame" class="full" viewBox="0 0 1920 1080"></svg>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const K = BP.kit(tl, 0);
          // stations are the real loan lifecycle (onloan-api Loan#status): draft, open, awaiting_confirmation, settled
          BP.furniture(K, tl, {
            stations: [
              { label: "DRAFT", at: 0 },
              { label: "OPEN", at: 11.54 },
              { label: "AWAITING", at: 17.93 },
              { label: "SETTLED", at: 48.18 },
            ],
            sheets: [0, 10, 24, 36, 52, 66, 80],
          });
          window.__timelines["furniture"] = tl;
        })();
      </script>
    </template>
