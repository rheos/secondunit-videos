<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b7 {
          position: absolute;
          inset: 0;
        }
        #b7 svg text.mono.faint {
          fill: var(--ink-dim);
          font-weight: 400;
        }
      </style>
      <div id="b7" data-composition-id="b7" data-width="1920" data-height="1080">
        <svg class="full" viewBox="0 0 1920 1080">
          <g id="b7-pipe"></g>
          <text id="b7-s1" class="mono" x="960" y="560" text-anchor="middle">OnLoan · onloan.net</text>
          <text id="b7-s2" class="mono" x="960" y="604" text-anchor="middle">FOAF · github.com/FOAF-Foundation/foaf-client</text>
          <text id="b7-s3" class="mono small" x="960" y="660" text-anchor="middle" style="fill: var(--ink-dim)">a Novadiem film · novadiem.com</text>
        </svg>
        <div id="b7-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate VII</div>
        <div id="b7-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>Colophon</div>
        <div class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="row"><span id="b7-st-a" class="phrase">Build the workflow.</span></div>
          <div class="row"><span id="b7-st-b" class="phrase red">Leave the money to the ledger.</span></div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 80);

          K.fade(K.$("b7-label-l"), K.T(80.06), 0.4);
          K.fade(K.$("b7-label-r"), K.T(80.06), 0.4);

          // the loan lifecycle, left as construction lines
          const pipe = K.$("b7-pipe");
          ["DRAFT", "OPEN", "AWAITING", "SETTLED"].forEach((s, i) => {
            const cx = 510 + i * 300;
            const box = el("rect", { class: "ln line construct", x: cx - 110, y: 330, width: 220, height: 80 }, pipe);
            const lab = text(s, { class: "mono faint", x: cx, y: 377, "text-anchor": "middle" }, pipe);
            const at = K.T(80.69) + i * 0.2;
            K.sweep(box, at, 0.4);
            K.fade(lab, at + 0.2, 0.3, 0.8);
            if (i < 3) {
              const arrow = el("path", { class: "ln line construct", d: `M${cx + 118} 370H${cx + 182}` }, pipe);
              K.sweep(arrow, at + 0.3, 0.25);
            }
          });

          K.reveal(K.$("b7-st-a"), K.T(81.32), 0.6);
          K.reveal(K.$("b7-st-b"), K.T(81.94), 0.8);
          K.fade(K.$("b7-s1"), K.T(82.57), 0.5);
          K.fade(K.$("b7-s2"), K.T(83.2), 0.5);
          K.fade(K.$("b7-s3"), K.T(83.82), 0.5);

          window.__timelines["b7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
