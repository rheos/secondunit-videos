<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #p4 {
          position: absolute;
          inset: 0;
        }
        #p4 svg text.nm {
          font-family: var(--font-label);
          font-weight: 800;
          font-size: 30px;
          fill: var(--ink);
        }
        #p4 svg text.raw {
          font-family: var(--font-mono);
          font-size: 26px;
          fill: var(--ink-dim);
        }
        #p4 svg text.tk {
          font-family: var(--font-mono);
          font-size: 16px;
          fill: var(--ink-dim);
        }
        #p4 svg text.rule {
          font-family: var(--font-mono);
          font-size: 18px;
          font-weight: 700;
          letter-spacing: 0.06em;
          fill: #15803d;
        }
        #p4 svg text.big {
          font-size: 54px;
        }
        #p4 .dot {
          fill: var(--accent);
        }
      </style>
      <div id="p4" data-composition-id="p4" data-width="1920" data-height="1080">
        <svg class="full" viewBox="0 0 1920 1080">
          <text id="p4-head" class="mono head" x="960" y="150" text-anchor="middle">PER SERVING · ROUNDED PER B.01.402, FOOD AND DRUG REGULATIONS (CANADA)</text>
          <g id="p4-rows"></g>
          <text id="p4-us" class="mono small" x="960" y="738" text-anchor="middle">ON THE US PANEL (21 CFR 101.9), 2 TO 5 MG OF CHOLESTEROL READS "LESS THAN 5 MG". IN CANADA IT ROUNDS TO 5.</text>
        </svg>
        <div id="p4-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate IV</div>
        <div id="p4-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>The Rounding</div>
        <div class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="row"><span id="p4-st-a" class="phrase">Each nutrient rounds by its own rule.</span></div>
          <div class="row"><span id="p4-st-b" class="phrase red">Canada: B.01.402. US: 21 CFR 101.9.</span></div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 38);
          const $ = K.$;

          K.fade($("p4-label-l"), K.T(38.52), 0.4);
          K.fade($("p4-label-r"), K.T(38.52), 0.4);
          K.fade($("p4-head"), K.T(38.52), 0.4);

          // label_generator.py's Canadian rules on this recipe's per-serving values (plate III)
          const ROWS = [
            { nm: "Calories", raw: "316.04", v: 316.04, lo: 300, hi: 330, step: 10, to: 320, rule: "OVER 50: NEAREST 10", out: "320" },
            { nm: "Fat", raw: "16.48 g", v: 16.48, lo: 14, hi: 18, step: 1, to: 16, rule: "OVER 5 G: NEAREST 1 G", out: "16 g" },
            { nm: "Saturated", raw: "1.505 g", v: 1.505, lo: 0.5, hi: 2.5, step: 0.5, to: 1.5, rule: "5 G OR LESS: NEAREST 0.5 G", out: "1.5 g" },
            { nm: "Trans", raw: "0.111 g", v: 0.111, lo: 0, hi: 1, step: 0.5, to: 0, rule: "UNDER 0.5 G: SHOWN AS 0", out: "0 g" },
            { nm: "Sodium", raw: "200.33 mg", v: 200.33, lo: 180, hi: 220, step: 10, to: 200, rule: "OVER 140 MG: NEAREST 10 MG", out: "200 mg" },
          ];
          const X0 = 720, X1 = 1110;
          const rows = $("p4-rows");
          ROWS.forEach((r, i) => {
            const y = 236 + i * 104;
            const at = K.T(39.17 + i * 1.3);
            const sx = (v) => X0 + ((v - r.lo) / (r.hi - r.lo)) * (X1 - X0);
            const g = el("g", {}, rows);
            K.fade(text(r.nm, { class: "nm", x: 240, y }, g), at, 0.3);
            K.fade(text(r.raw, { class: "raw", x: 660, y, "text-anchor": "end" }, g), at + 0.1, 0.3);
            const axis = el("path", { class: "ln ink", d: `M${X0} ${y - 10}H${X1}` }, g);
            K.draw(axis, at + 0.1, 0.4, "none");
            const n = Math.round((r.hi - r.lo) / r.step);
            for (let k = 0; k <= n; k++) {
              const v = r.lo + k * r.step;
              const tick = el("path", { class: "ln ink", d: `M${sx(v)} ${y - 22}V${y + 2}` }, g);
              K.draw(tick, at + 0.2 + k * 0.04, 0.2, "none");
              K.fade(text(String(Number(v.toFixed(2))), { class: "tk", x: sx(v), y: y + 26, "text-anchor": "middle" }, g), at + 0.25 + k * 0.04, 0.25);
            }
            // the raw value lands between two steps, then snaps to the nearer one
            const dot = el("g", {}, g);
            el("circle", { class: "dot", cx: 0, cy: y - 10, r: 9 }, dot);
            K.fade(dot, at + 0.35, 0.2);
            tl.fromTo(dot, { x: sx(r.v) }, { x: sx(r.to), duration: 0.45, ease: "power2.inOut" }, at + 0.65);
            K.fade(text(r.rule, { class: "rule", x: 1160, y: y - 2 }, g), at + 0.65, 0.3);
            K.fade(text(r.out, { class: "big", x: 1720, y: y + 8, "text-anchor": "end" }, g), at + 1.1, 0.3);
          });

          K.reveal($("p4-st-a"), K.T(41.13), 0.8);
          K.reveal($("p4-st-b"), K.T(46.35), 0.8);
          K.fade($("p4-us"), K.T(47.65), 0.5);

          tl.to("#p4 svg, #p4 .plate-label, #p4 .statement", { opacity: 0, duration: 0.4, ease: "power1.in" }, K.T(51.56));
          window.__timelines["p4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
