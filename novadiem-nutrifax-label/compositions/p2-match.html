<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #p2 {
          position: absolute;
          inset: 0;
        }
        #p2 svg text.rec {
          font-family: var(--font-mono);
          font-size: 19px;
          letter-spacing: 0.03em;
          fill: var(--ink);
        }
        #p2 svg text.rec.id {
          fill: var(--ink-dim);
          font-size: 16px;
        }
        #p2 svg text.rec.g {
          font-weight: 700;
        }
      </style>
      <div id="p2" data-composition-id="p2" data-width="1920" data-height="1080">
        <svg class="full" viewBox="0 0 1920 1080">
          <g id="p2-move"><g id="p2-card" transform="translate(700 150)"></g></g>
          <g id="p2-marks"></g>
          <text id="p2-head" class="mono head" x="820" y="262">CANADIAN NUTRIENT FILE · FOOD RECORD</text>
          <text id="p2-ghead" class="mono head" x="1655" y="262" text-anchor="middle">GRAMS</text>
          <g id="p2-rows"></g>
          <text id="p2-note" class="mono small green-t" x="820" y="676">NO CONFIDENT MATCH? THAT LINE COMES BACK TO YOU TO PICK.</text>
          <text id="p2-call" class="mono small" x="820" y="676">1 CUP ALMONDS = 2 × "125ML WHOLE" (75.0 G EACH) = 150.0 G</text>
        </svg>
        <div id="p2-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate II</div>
        <div id="p2-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>The Match</div>
        <div id="p2-st1" class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="row"><span id="p2-st-a" class="phrase">Each line is matched to</span></div>
          <div class="row"><span id="p2-st-b" class="phrase red">the Canadian Nutrient File.</span></div>
        </div>
        <div id="p2-st2" class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="row"><span id="p2-st-c" class="phrase">Cups become grams,</span></div>
          <div class="row"><span id="p2-st-d" class="phrase">from the file's own measures.</span></div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 10);
          const $ = K.$;

          // plate I left the card drawn; it starts here fully visible and glides left
          NF.card($("p2-card"));
          tl.fromTo($("p2-move"), { x: 0 }, { x: -540, duration: 0.8, ease: "power2.inOut" }, K.T(10.47));

          K.fade($("p2-label-l"), K.T(10.47), 0.4);
          K.fade($("p2-label-r"), K.T(10.47), 0.4);
          K.fade($("p2-head"), K.T(11.13), 0.4);

          // CNF records (CNF 2015 FOOD NAME.csv, FoodID) and the grams calculator.py works out for each line
          const REC = [
            ["Grains, oats", "4421", "400.0 g"],
            ["Sweets, syrups, maple, bulk", "4326", "166.4 g"],
            ["Vegetable oil, canola", "451", "56.8 g"],
            ["Nuts, almonds, dried, unblanched, unroasted", "2534", "150.0 g"],
            ["Seeds, sunflower seed kernels, dried", "2526", "74.0 g"],
            ["Salt, table", "214", "6.1 g"],
          ];
          const rows = $("p2-rows");
          const marks = $("p2-marks");
          const grams = [];
          REC.forEach(([desc, id, g], i) => {
            const y = 150 + NF.LINE_Y(i); // baseline of card line i once the card sits at x 160
            const at = K.T(11.13 + i * 0.65);
            const under = el("path", { class: "ln line-strong", d: `M196 ${y + 8}H${196 + 300}`, style: "stroke-width: 3" }, marks);
            const arrow = el("path", { class: "ln ink", d: `M700 ${y - 12}H806M796 ${y - 19}L807 ${y - 12}L796 ${y - 5}` }, rows);
            const box = el("rect", { class: "ln thin ink", x: 820, y: y - 34, width: 720, height: 44 }, rows);
            const t = text(desc, { class: "rec", x: 836, y: y - 5 }, rows);
            const tid = text(`CNF ${id}`, { class: "rec id", x: 1524, y: y - 6, "text-anchor": "end" }, rows);
            const gbox = el("rect", { class: "ln thin ink", x: 1570, y: y - 34, width: 170, height: 44 }, rows);
            const gt = text(g, { class: "rec g", x: 1724, y: y - 5, "text-anchor": "end" }, rows);
            K.draw(under, at, 0.35, "none");
            K.draw(arrow, at + 0.1, 0.35, "none");
            K.draw(box, at + 0.2, 0.4, "none");
            K.fade(t, at + 0.35, 0.3);
            K.fade(tid, at + 0.45, 0.3);
            grams.push({ gbox, gt, under });
          });
          K.reveal($("p2-st-a"), K.T(12.43), 0.6);
          K.reveal($("p2-st-b"), K.T(13.08), 0.7);
          K.fade($("p2-note"), K.T(15.7), 0.4);

          // cups become grams
          tl.to("#p2-st1", { opacity: 0, duration: 0.4, ease: "power1.in" }, K.T(17.65));
          K.out($("p2-note"), K.T(17.65), 0.4);
          K.fade($("p2-ghead"), K.T(17.65), 0.4);
          grams.forEach((g, i) => {
            const at = K.T(18.3) + i * 0.32;
            K.draw(g.gbox, at, 0.3, "none");
            K.fade(g.gt, at + 0.15, 0.25);
          });
          K.reveal($("p2-st-c"), K.T(18.95), 0.6);
          K.reveal($("p2-st-d"), K.T(19.61), 0.8);
          K.fade($("p2-call"), K.T(20.91), 0.5);

          tl.to("#p2 svg, #p2 .plate-label, #p2-st2", { opacity: 0, duration: 0.4, ease: "power1.in" }, K.T(23.52));
          window.__timelines["p2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
