    <script>
      // NF: the film's shared drawings, synthetic recipe, values from the Canadian Nutrient File (CNF 2015)
      // run through the same arithmetic as nutrifax calculator.py. See BUILD-STATE.md for every source.
      window.NF = (() => {
        const { el, text } = BP;
        // the recipe card, local coords 0-520 x 0-580. Line i sits at LINE_Y(i).
        const LINES = ["400 g rolled oats", "1/2 cup maple syrup", "4 tbsp canola oil", "1 cup whole almonds", "1/2 cup sunflower seeds", "1 tsp salt"];
        const LINE_Y = (i) => 160 + i * 58;
        function card(parent) {
          const P = { rules: [], lines: [] };
          P.paper = el("rect", { class: "fill-raised", x: 0, y: 0, width: 520, height: 580, opacity: 0.55 }, parent);
          P.frame = el("rect", { class: "ln ink", x: 0, y: 0, width: 520, height: 580 }, parent);
          P.title = text("Maple almond granola", { class: "hand title", x: 36, y: 72 }, parent);
          P.rules.push(el("path", { class: "ln thin ink", d: "M24 98H496", opacity: 0.6 }, parent));
          for (let i = 0; i < 7; i++) P.rules.push(el("path", { class: "ln thin line", d: `M24 ${LINE_Y(i) + 14}H496`, opacity: 0.35 }, parent));
          LINES.forEach((s, i) => P.lines.push(text(s, { class: "hand", x: 40, y: LINE_Y(i) }, parent)));
          P.serves = text("Makes 12 servings", { class: "hand", x: 40, y: LINE_Y(6) + 8 }, parent);
          return P;
        }
        // The Canadian Nutrition Facts table for this recipe, laid out like Nutrifax's own Figure 1.2 preview
        // (backend/app/static/label-previews/ca/1.2.png), local coords 0-480 x 0-616. Values are
        // label_generator.py's Canadian rounding of the per-serving numbers; %DV from the HC daily values.
        // Returns the frame and the parts in the order render_ca_standard() draws them.
        function table(parent) {
          const P = { parts: [] };
          const part = () => {
            const g = el("g", {}, parent);
            P.parts.push(g);
            return g;
          };
          const row = (g, y, bold, reg, dv, x = 14, cls = "nf") => {
            const t = el("text", { class: cls, x, y }, g);
            if (bold) el("tspan", { class: "nf b" }, t).textContent = bold + (reg ? " " : "");
            if (reg) el("tspan", {}, t).textContent = reg;
            if (dv) text(dv, { class: cls, x: 466, y, "text-anchor": "end" }, g);
          };
          const rule = (g, y, w = 1.5) => el("path", { class: "ln ink", d: `M8 ${y}H472`, style: `stroke-width: ${w}` }, g);
          P.frame = el("rect", { class: "ln ink", x: 0, y: 0, width: 480, height: 616 }, parent);
          P.paper = el("rect", { x: 1, y: 1, width: 478, height: 614, style: "fill: #ffffff", opacity: 0.6 }, parent);
          parent.insertBefore(P.paper, P.frame);
          let g = part();
          text("Nutrition Facts", { class: "nf title", x: 14, y: 50 }, g);
          g = part();
          text("Per 2/3 cup (71 g)", { class: "nf", x: 14, y: 86 }, g);
          rule(g, 100, 4);
          g = part();
          text("Calories 320", { class: "nf b", x: 14, y: 134, style: "font-size: 28px" }, g);
          text("% Daily Value*", { class: "nf b small", x: 466, y: 132, "text-anchor": "end" }, g);
          el("path", { class: "ln ink", d: "M14 148H186", style: "stroke-width: 6" }, g);
          rule(g, 154);
          g = part();
          row(g, 180, "Fat", "16 g", "22 %");
          row(g, 209, null, "Saturated 1.5 g", null, 34);
          row(g, 233, null, "+ Trans 0 g", null, 34);
          text("8 %", { class: "nf", x: 466, y: 221, "text-anchor": "end" }, g);
          rule(g, 246);
          g = part();
          row(g, 271, "Carbohydrate", "35 g");
          row(g, 296, null, "Fibre 6 g", "20 %", 34);
          row(g, 321, null, "Sugars 9 g", "9 %", 34);
          rule(g, 336);
          g = part();
          row(g, 362, "Protein", "10 g");
          rule(g, 376);
          g = part();
          row(g, 402, "Cholesterol", "0 mg");
          rule(g, 416);
          g = part();
          row(g, 442, "Sodium", "200 mg", "9 %");
          rule(g, 458, 5);
          g = part();
          row(g, 487, null, "Potassium 306 mg", "7 %");
          rule(g, 501);
          g = part();
          row(g, 527, null, "Calcium 72 mg", "6 %");
          rule(g, 541);
          g = part();
          row(g, 567, null, "Iron 2.4 mg", "13 %");
          rule(g, 582, 5);
          g = part();
          text("*5% or less is a little, 15% or more is a lot", { class: "nf small", x: 14, y: 604, style: "font-size: 16px" }, g);
          return P;
        }
        return { card, table, LINES, LINE_Y };
      })();
    </script>
