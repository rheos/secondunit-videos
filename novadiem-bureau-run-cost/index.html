    <script>
      // LG: the one device of this film, a run's ledger. One row per specialist attempt, built from the
      // two SPAWN-EVENT lines each spawn writes (started, then a terminal status); the token column is
      // only filled at close-out, from transcripts. Every figure in this ledger is ILLUSTRATIVE (labelled
      // on the card). The real run in plate VI is read from its accounting.json.
      window.LG = (() => {
        const { el, text } = BP;
        const X = 120, Y = 150, W = 1120;
        const COL = { idx: X + 34, att: X + 80, host: X + 420, stat: X + 580, rew: X + 800, tok: X + W - 34 };
        const rowY = (i) => Y + 190 + i * 62;
        const ROWS = [
          { att: "analyst-1", host: "main", stat: "complete", rew: "", tok: "1.2M" },
          { att: "architect-1", host: "main", stat: "complete", rew: "", tok: "5.4M" },
          { att: "challenger-1", host: "main", stat: "no-handoff", rew: "", tok: "2.9M" },
          { att: "challenger-2", host: "main", stat: "complete", rew: "true", tok: "3.1M" },
          { att: "architect-2", host: "main", stat: "complete", rew: "true", tok: "4.6M" },
          { att: "spellwright-1", host: "second", stat: "complete", rew: "", tok: null },
        ];
        const hidden = (n) => (n.setAttribute("opacity", "0"), n);
        const gone = (n) => (n.setAttribute("display", "none"), n);

        // ledger(parent, { show, tok, conductor, total }): the card in the state a plate opens on.
        //   show: rows already written; tok: token cells already filled (rows 0..tok-1; row 5 reads UNKNOWN)
        //   Rows past `show` are built hidden (opacity 0) so the plate can write them in.
        function ledger(parent, o = {}) {
          const show = o.show || 0, tok = o.tok || 0;
          const L = { g: el("g", {}, parent), rows: [] };
          const g = L.g;
          L.paper = el("rect", { class: "fill-bg", x: X, y: Y, width: W, height: 730 }, g);
          L.frame = el("rect", { class: "ln ink", x: X, y: Y, width: W, height: 730 }, g);
          L.title = text("LEDGER", { class: "mono head", x: X + 30, y: Y + 46 }, g);
          L.illus = text("ILLUSTRATIVE FIGURES", { class: "mono small dim", x: X + W - 30, y: Y + 44, "text-anchor": "end" }, g);
          L.rule = el("path", { class: "ln thin ink", d: `M${X + 30} ${Y + 66}H${X + W - 30}` }, g);
          L.heads = [
            ["#", COL.idx, "middle"], ["ATTEMPT", COL.att, "start"], ["HOST", COL.host, "start"],
            ["STATUS", COL.stat, "start"], ["REWORK", COL.rew, "start"], ["TOKENS", COL.tok, "end"],
          ].map(([t, x, a]) => text(t, { class: "mono small dim", x, y: Y + 116, "text-anchor": a }, g));
          L.rule2 = el("path", { class: "ln thin ink", d: `M${X + 30} ${Y + 134}H${X + W - 30}` }, g);
          ROWS.forEach((d, i) => {
            const y = rowY(i);
            const r = { y, g: el("g", {}, g), d };
            r.idx = text(String(i + 1).padStart(2, "0"), { class: "mono row dim", x: COL.idx, y, "text-anchor": "middle" }, r.g);
            r.att = text(d.att, { class: "mono row b", x: COL.att, y }, r.g);
            r.host = text(d.host, { class: "mono row", x: COL.host, y }, r.g);
            r.started = text("started", { class: "mono row dim", x: COL.stat, y }, r.g);
            r.stat = text(d.stat, { class: "mono row b", x: COL.stat, y }, r.g);
            r.rew = text(d.rew || "", { class: "mono row b gold-t", x: COL.rew, y }, r.g);
            r.dots = text("· · ·", { class: "mono row dim", x: COL.tok, y, "text-anchor": "end" }, r.g);
            r.tok = text(d.tok || "UNKNOWN", { class: `mono row b${d.tok ? "" : " red-t"}`, x: COL.tok, y, "text-anchor": "end" }, r.g);
            if (i >= show) [r.idx, r.att, r.host, r.started, r.stat, r.rew, r.dots].forEach(hidden);
            else gone(r.started);
            if (i < tok) gone(r.dots);
            else hidden(r.tok);
            L.rows.push(r);
          });
          // the Conductor is not a spawn: its figure sits under its own rule (accounting.json conductor_tokens)
          const cy = Y + 600;
          L.cRule = el("path", { class: "ln thin ink", d: `M${X + 30} ${cy - 46}H${X + W - 30}` }, g);
          L.cName = text("conductor", { class: "mono row b", x: COL.att, y: cy }, g);
          L.cNote = text("not a spawn", { class: "mono row dim", x: COL.stat, y: cy }, g);
          L.cTok = text("6.0M", { class: "mono row b", x: COL.tok, y: cy, "text-anchor": "end" }, g);
          // the total: processed_total, the sum of the shares present
          const ty = Y + 676;
          L.tRule = el("path", { class: "ln ink", d: `M${X + 30} ${ty - 44}H${X + W - 30}M${X + 30} ${ty - 38}H${X + W - 30}` }, g);
          L.tName = text("processed_total", { class: "mono row b", x: COL.att, y: ty }, g);
          L.tConf = text("partial", { class: "mono row b gold-t", x: COL.rew, y: ty }, g);
          L.tTok = text("23.2M", { class: "mono row b", x: COL.tok, y: ty, "text-anchor": "end" }, g);
          const conductor = [L.cRule, L.cName, L.cNote, L.cTok];
          const total = [L.tRule, L.tName, L.tConf, L.tTok];
          (o.conductor ? [] : conductor).forEach(hidden);
          (o.total ? [] : total).forEach(hidden);
          return L;
        }
        function drawLedger(K, L, at) {
          K.fade(L.paper, at, 0.2);
          K.draw(L.frame, at, 0.9, "none");
          K.fade(L.title, at + 0.3, 0.3);
          K.fade(L.illus, at + 0.5, 0.3);
          K.draw(L.rule, at + 0.4, 0.5);
          L.heads.forEach((h, i) => K.fade(h, at + 0.6 + i * 0.08, 0.3));
          K.draw(L.rule2, at + 0.7, 0.5);
        }
        // write a row from its started line; then its terminal status
        function rowIn(K, r, at) {
          [r.idx, r.att, r.host].forEach((n, i) => K.fade(n, at + i * 0.08, 0.3, 1));
          K.fade(r.started, at + 0.25, 0.3, 1);
          if (r.d.rew) K.fade(r.rew, at + 0.35, 0.3, 1);
          K.fade(r.dots, at + 0.4, 0.3, 1);
        }
        function rowDone(K, tl, r, at) {
          tl.fromTo(r.started, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, at);
          K.fade(r.stat, at + 0.15, 0.3, 1);
        }
        function tokIn(K, tl, r, at) {
          tl.fromTo(r.dots, { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, at);
          K.fade(r.tok, at + 0.1, 0.3, 1);
        }

        // an event tag in the right-hand panel: a SPAWN-EVENT line, shortened to the keys that matter here
        function tag(parent, x, y, lines, o = {}) {
          const T = { g: el("g", {}, parent), x, y };
          const h = 46 + lines.length * 28;
          T.paper = el("rect", { class: "fill-bg", x, y, width: o.w || 500, height: h }, T.g);
          T.frame = el("rect", { class: `ln ${o.cls || "ink"}`, x, y, width: o.w || 500, height: h }, T.g);
          T.head = text(o.head || "SPAWN-EVENT", { class: "mono small dim", x: x + 18, y: y + 28 }, T.g);
          T.lines = lines.map((l, i) => text(l, { class: `mono ev${o.lineCls && o.lineCls[i] ? " " + o.lineCls[i] : ""}`, x: x + 18, y: y + 58 + i * 28 }, T.g));
          T.h = h;
          return T;
        }
        function drawTag(K, T, at) {
          K.fade(T.paper, at, 0.15);
          K.draw(T.frame, at, 0.45, "none");
          K.fade(T.head, at + 0.1, 0.25);
          T.lines.forEach((n, i) => K.reveal(n, at + 0.2 + i * 0.12, 0.4));
        }
        function outAll(tl, nodes, at, dur = 0.35) {
          nodes.forEach((n) => tl.fromTo(n, { opacity: 1 }, { opacity: 0, duration: dur, immediateRender: false }, at));
        }

        // a sheet in transit, from a tag to its row
        function sheet(parent) {
          const t = el("g", {}, parent);
          el("path", { class: "fill-bg", d: "M-12 -15H5L12 -8V15H-12Z" }, t);
          el("path", { class: "ln line", d: "M-12 -15H5L12 -8V15H-12Z" }, t);
          el("path", { class: "ln thin line", d: "M-6 -4H6M-6 3H6M-6 10H2" }, t);
          return t;
        }
        function carry(K, tl, parent, d, at, dur = 0.6) {
          const s = sheet(parent);
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.12 }, at);
          K.travel(s, el("path", { d }), at, dur);
          tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, at + dur);
          return s;
        }
        // from the panel (x 1300) to a row's right edge
        const toRow = (ty, i) => `M1300 ${ty}H1270V${rowY(i) - 8}H1250`;

        // a stamp, tilted
        function stamp(parent, word, cx, cy, w = 220, cls = "ink") {
          const tilt = el("g", { transform: `rotate(-6 ${cx} ${cy})`, "data-layout-allow-overlap": "" }, parent);
          const g = el("g", {}, tilt);
          el("rect", { class: "fill-bg", x: cx - w / 2, y: cy - 27, width: w, height: 54, opacity: 0.92 }, g);
          el("rect", { class: `ln ${cls}`, x: cx - w / 2, y: cy - 27, width: w, height: 54, style: "stroke-width:3" }, g);
          text(word, { class: "stamp-t", x: cx, y: cy + 11, "text-anchor": "middle" }, g);
          return { g, cx, cy };
        }
        function slam(tl, S, at) {
          tl.fromTo(S.g, { opacity: 0, scale: 1.25, svgOrigin: `${S.cx} ${S.cy}` }, { opacity: 1, scale: 1, svgOrigin: `${S.cx} ${S.cy}`, duration: 0.25, ease: "power2.in" }, at);
        }
        const cross = (parent, x, y, s = 10, cls = "ink") => el("path", { class: `ln ${cls}`, d: `M${x - s} ${y - s}l${2 * s} ${2 * s}M${x + s} ${y - s}l${-2 * s} ${2 * s}`, style: "stroke-width:3" }, parent);
        const check = (parent, x, y, cls = "line-strong") => el("path", { class: `ln ${cls}`, d: `M${x - 12} ${y}l8 9l16 -20`, style: "stroke-width:3" }, parent);

        return { X, Y, W, COL, rowY, ROWS, ledger, drawLedger, rowIn, rowDone, tokIn, tag, drawTag, outAll, sheet, carry, toRow, stamp, slam, cross, check };
      })();
    </script>
