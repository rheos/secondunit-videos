    <style>
      svg text.mono.head { font-size: 22px; }
      svg text.mono.cell { font-size: 18px; }
      svg text.mono.green-t { fill: #1d7a31; } /* line-strong: 4.8:1 on the pale surface */
      svg text.mono.red-t { fill: var(--accent); }

    <script>
      // OR: the shared drawings. Synthetic crew, block and counts throughout (no real people or amounts).
      window.OR = (() => {
        const { el, text } = BP;
        const CREW = ["ANA", "BEN", "CLEO", "DEV"];
        // the phone always sits at the same place on the stage, so plates hand it over without a jump
        const PH = { x: 1380, y: 150, w: 320, h: 600 };
        // the day's taps, in order: [picker row, bin number]
        const TAPS = [[0, 1], [1, 1], [2, 1], [3, 1], [0, 2], [2, 2], [1, 2], [3, 2], [0, 3], [2, 3]];
        const COLX = [1490, 1536, 1582, 1628];
        const ROWY = [338, 398, 458, 518];

        // phone(parent): outline, status bar, app header. Returns the parts for cueing.
        function phone(parent) {
          const P = {};
          P.frame = el("rect", { class: "ln ink", x: PH.x, y: PH.y, width: PH.w, height: PH.h, rx: 40 }, parent);
          P.slot = el("path", { class: "ln thin ink", d: `M${PH.x + 130} ${PH.y + 18}H${PH.x + 190}` }, parent);
          P.home = el("path", { class: "ln thin ink", d: `M${PH.x + 110} ${PH.y + PH.h - 20}H${PH.x + 210}` }, parent);
          // signal: four bars, empty while there is no service
          P.bars = [0, 1, 2, 3].map((i) => {
            const h = 6 + i * 5;
            return el("rect", { class: "ln thin ink", x: 1636 + i * 10, y: 196 - h, width: 6, height: h }, parent);
          });
          P.fills = [0, 1, 2, 3].map((i) => {
            const h = 6 + i * 5;
            return el("rect", { class: "fill-ink", x: 1636 + i * 10, y: 196 - h, width: 6, height: h, opacity: 0 }, parent);
          });
          P.svc = text("NO SERVICE", { class: "mono small red-t", x: 1624, y: 196, "text-anchor": "end" }, parent);
          P.head = el("g", {}, parent);
          text("TALLIES", { class: "mono", x: 1404, y: 240 }, P.head);
          text("BLOCK 4 · GALA · BIN", { class: "mono small", x: 1404, y: 266 }, P.head);
          P.rule = el("path", { class: "ln thin ink", d: "M1400 282H1680" }, parent);
          return P;
        }

        // grid(parent): the tally sheet on the phone: four pickers, bins 1-4. Cells fill in tap order.
        function grid(parent) {
          const G = { names: [], cols: [], cells: [], marks: [] };
          COLX.forEach((x, c) => G.cols.push(text(String(c + 1), { class: "mono small", x: x + 20, y: 308, "text-anchor": "middle" }, parent)));
          CREW.forEach((n, r) => {
            G.names.push(text(n, { class: "mono cell", x: 1404, y: ROWY[r] }, parent));
            G.cells.push(COLX.map((x) => el("rect", { class: "ln thin ink", x, y: ROWY[r] - 26, width: 40, height: 38 }, parent)));
          });
          G.marks = TAPS.map(([r, c]) => el("rect", { class: "fill-line", x: COLX[c - 1] + 6, y: ROWY[r] - 20, width: 28, height: 26, opacity: 0 }, parent));
          G.total = text("BINS TODAY  10", { class: "mono small", x: 1404, y: 600 }, parent);
          return G;
        }

        // server(parent): orchardly-rails and its sync_batches table (built). Returns parts for cueing.
        const BATCH_ID = "7c1e4b2a-…-a3f9"; // synthetic UUID v4
        function server(parent) {
          const S = {};
          S.box = el("rect", { class: "ln ink", x: 160, y: 200, width: 480, height: 420 }, parent);
          S.head = el("g", {}, parent);
          text("ORCHARDLY-RAILS", { class: "mono head", x: 184, y: 244 }, S.head);
          text("POST /api/v1/sync_batches", { class: "mono small", x: 184, y: 276 }, S.head);
          S.rule1 = el("path", { class: "ln thin ink", d: "M160 296H640" }, parent);
          S.tab = el("g", {}, parent);
          text("sync_batches", { class: "mono", x: 184, y: 340 }, S.tab);
          text("client_batch_id", { class: "mono small", x: 184, y: 380 }, S.tab);
          text("ops", { class: "mono small", x: 616, y: 380, "text-anchor": "end" }, S.tab);
          S.rule2 = el("path", { class: "ln thin ink", d: "M184 394H616" }, parent);
          S.row = el("g", {}, parent);
          text(BATCH_ID, { class: "mono small", x: 184, y: 430 }, S.row);
          text("10", { class: "mono small", x: 616, y: 430, "text-anchor": "end" }, S.row);
          S.uniq = text("unique index on client_batch_id", { class: "mono small green-t", x: 184, y: 596 }, parent);
          // the wire from the phone: the endpoint is built, the app's push to it is not yet
          S.wire = el("path", { class: "ln planned", d: "M1374 470H642" }, parent);
          S.wireTag = text("APP PUSH: PLANNED", { class: "mono small planned-t", x: 1008, y: 560, "text-anchor": "middle" }, parent);
          return S;
        }
        // batch(parent): the sync batch envelope, drawn at the origin; place it with a transform
        function batch(parent) {
          const g = el("g", {}, parent);
          el("rect", { class: "ln line fill-bg", x: -170, y: -56, width: 340, height: 112 }, g);
          text("sync_batch", { class: "mono", x: -150, y: -20 }, g);
          text(`id ${BATCH_ID}`, { class: "mono small", x: -150, y: 10 }, g);
          text("operations 10 · Tally", { class: "mono small", x: -150, y: 38 }, g);
          return g;
        }

        return { CREW, PH, TAPS, COLX, ROWY, BATCH_ID, phone, grid, server, batch };
      })();
    </script>
