<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #p7 {
          position: absolute;
          inset: 0;
        }
        #p7 svg text.big {
          font-size: 132px;
        }
      </style>
      <div id="p7" data-composition-id="p7" data-width="1920" data-height="1080">
        <svg class="full" viewBox="0 0 1920 1080">
          <text id="p7-name" class="big" x="960" y="330" text-anchor="middle">Orchardly</text>
          <text id="p7-site" class="mono" x="960" y="392" text-anchor="middle">orchardly.app</text>
          <g id="p7-pipe"></g>
        </svg>
        <div id="p7-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate VII</div>
        <div id="p7-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>Colophon</div>
        <div class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="row"><span id="p7-st-a" class="phrase">Crews keep working</span></div>
          <div class="row"><span id="p7-st-b" class="phrase red">with no signal.</span></div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 76.32);

          K.fade(K.$("p7-label-l"), K.T(76.32), 0.4);
          K.fade(K.$("p7-label-r"), K.T(76.32), 0.4);
          K.reveal(K.$("p7-name"), K.T(76.32), 0.8);

          // the tally's path, left as construction lines
          const pipe = K.$("p7-pipe");
          ["TAP", "SQLITE", "PAY WEEK", "BATCH", "API"].forEach((s, i) => {
            const cx = 480 + i * 240;
            const box = el("rect", { class: "ln line construct", x: cx - 95, y: 500, width: 190, height: 70 }, pipe);
            const lab = text(s, { class: "mono", x: cx, y: 542, "text-anchor": "middle" }, pipe);
            const at = K.T(76.97) + i * 0.15;
            K.sweep(box, at, 0.35);
            K.fade(lab, at + 0.15, 0.3, 0.8);
            if (i < 4) {
              const arrow = el("path", { class: "ln line construct", d: `M${cx + 102} 535H${cx + 138}` }, pipe);
              K.sweep(arrow, at + 0.25, 0.2);
            }
          });

          K.reveal(K.$("p7-st-a"), K.T(77.6), 0.6);
          K.reveal(K.$("p7-st-b"), K.T(78.25), 0.7);
          K.fade(K.$("p7-site"), K.T(78.88), 0.5);

          window.__timelines["p7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
