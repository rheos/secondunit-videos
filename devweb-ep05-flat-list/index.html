<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;700&display=block" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="vo/words.js"></script>
    <script src="kit/blink-geo.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/" } }
    </script>
    <style>
      :root { --bg: #0d1117; --text: #eef2f6; --text2: #c9d1d9; --muted: #9aa6b6; --faint: #7b8593; --green: #6ad08a; --blue: #4f93d6; --amber: #d6a45a; --red: #e0675a; --sans: "IBM Plex Sans", sans-serif; --mono: "IBM Plex Mono", monospace; }
      html, body { margin: 0; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--text); font-family: var(--sans); background: var(--bg); }
      .abs { position: absolute; }
      .layer { position: absolute; inset: 0; }
      .hide { opacity: 0; }
      .chrome { left: 44px; right: 44px; top: 52px; display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 23px; font-weight: 500; }
      .bar { left: 44px; right: 44px; bottom: 50px; height: 3px; background: #1c2333; }
      .scrim { background: rgba(13,17,23,.8); padding: 10px 16px 14px; border-radius: 18px; }
      .ov { font-weight: 700; letter-spacing: -0.04em; line-height: 1.05; text-shadow: 0 4px 30px rgba(0,0,0,.7); }
    </style>
  </head>
  <body>
    <!-- gray-box animatic: stand-ins, overlays as plain type, no dressing, no sound (the voice is muxed after render) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="129.56" data-width="1080" data-height="1920">
      <!-- the world: one Three.js scene, one camera (world.js, stations/*.js) -->
      <canvas id="world" width="1080" height="1920" style="position:absolute;left:0;top:0;width:1080px;height:1920px"></canvas>
      <!-- the type is authored on a 720x1280 stage and scaled 1.5x as vectors; the 3D renders natively at 1080x1920 -->
      <div id="scale" style="position:absolute;left:0;top:0;width:720px;height:1280px;transform:scale(1.5);transform-origin:0 0">
      <div id="stage" class="layer"></div>
      </div>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const stage = document.getElementById("stage");
        window.BP = window.BP || {};
        BP.CUES = BP.CUES || [];
        const w = (word, n) => VO.w(word, n);
        const e = (word, n) => VO.e(word, n);
        const F = (el, from, to, at) => tl.fromTo(el, from, Object.assign({ immediateRender: false }, to), at);
        const mk = (tag, cls, css, parent, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (css) n.style.cssText = css; if (html != null) n.innerHTML = html; (parent || stage).appendChild(n); return n; };
        const show = (el, at, d = 0.3) => F(el, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, at);
        const hide = (el, at, d = 0.3) => F(el, { opacity: 1 }, { opacity: 0, duration: d, ease: "power2.in" }, at);
        const G = (s) => `<span style="color:var(--green)">${s}</span>`;

        // chrome: lockup, topic tag, progress
        const chrome = mk("div", "abs chrome", "", stage, `<span><span style="color:var(--green)">~/</span>devweb</span><span style="color:var(--faint);font-size:20px">// tool names</span>`);
        const bar = mk("div", "abs bar");
        const barIn = mk("div", null, "height:3px;background:var(--green);transform-origin:left;transform:scaleX(0)", bar);
        F(barIn, { scaleX: 0 }, { scaleX: 1, duration: VO.END, ease: "none" }, 0);
        const endAt = e("folder", 2) + 1.0;
        hide(chrome, endAt - 0.4, 0.4); hide(bar, endAt - 0.4, 0.4);

        // I. the hook line, above Blink's sprout (on screen from frame 0)
        const hook = mk("div", "abs ov", "left:44px;right:44px;top:96px;font-size:50px", stage, `Your AI has never<br>seen a ${G("folder.")}`);
        hide(hook, w("say", 1) - 0.1, 0.3);
        // VII. overlays on number words, re-anchored off them (camera.md): the empty upper right of the wides
        const n32 = mk("div", "abs ov hide scrim", "right:28px;top:140px;font-size:76px;text-align:right", stage, `${G("32")} of 35`);
        show(n32, w("of", 2) - 0.35); hide(n32, w("tools", 6) - 0.2);
        const n10 = mk("div", "abs ov hide scrim", "right:28px;top:140px;font-size:76px;text-align:right", stage, `${G("10")} families`);
        show(n10, w("makes", 1) + 0.35); hide(n10, w("nothing", 5) + 0.6);
        // X. the line, then the mark over the dimmed shaft
        const fin = mk("div", "abs ov hide scrim", "right:28px;top:140px;font-size:50px;text-align:right", stage, `The first word<br>is the ${G("folder.")}`);
        show(fin, w("first", 10)); hide(fin, endAt - 0.3, 0.3);
        const dim = mk("div", "layer hide", "background:rgba(13,17,23,.6)", stage);
        show(dim, endAt - 0.3, 0.5);
        const mark = mk("div", "abs hide", "left:190px;top:590px;width:340px;height:92px;box-sizing:border-box;border-radius:14px;border:3px solid var(--green);background:#0d1117;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:44px", stage, `<span style="color:var(--green)">~/</span>devweb`);
        F(mark, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, endAt);

        const clock3 = { t: 0 };
        tl.fromTo(clock3, { t: 0 }, { t: VO.END, duration: VO.END, ease: "none", immediateRender: false, onUpdate: () => { if (window.renderWorld) window.renderWorld(clock3.t); } }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module">
      import { buildWorld } from "./world.js";
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let ready; window.__hf.buildReady["world"] = new Promise((r) => (ready = r));
      const render = await buildWorld(document.getElementById("world"));
      window.renderWorld = render;
      window.addEventListener("hf-seek", (ev) => render(ev.detail.time));
      render(window.__hfThreeTime || 0);
      ready();
    </script>
  </body>
</html>
