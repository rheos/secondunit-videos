<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;700&display=block" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="vo/words.js"></script>
    <script src="kit/blink-geo.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/" } }
    </script>
    <style>
      :root { --bg: #0d1117; --text: #eef2f6; --text2: #c9d1d9; --muted: #9aa6b6; --faint: #7b8593; --green: #6ad08a; --blue: #4f93d6; --amber: #d6a45a; --red: #e0675a; --sans: "IBM Plex Sans", sans-serif; --mono: "IBM Plex Mono", monospace; }
      html, body { margin: 0; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--text); font-family: var(--sans); background: var(--bg); }
      .abs { position: absolute; }
      .layer { position: absolute; inset: 0; }
      .hide { opacity: 0; }
      .chrome { left: 44px; right: 44px; top: 52px; display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 23px; font-weight: 500; }
      .bar { left: 44px; right: 44px; bottom: 50px; height: 3px; background: #1c2333; }
      .cap { left: 40px; right: 40px; top: 1156px; text-align: center; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; text-shadow: 0 2px 18px rgba(0,0,0,.9); }
      .cap .m { font-family: var(--mono); font-weight: 600; font-size: 0.9em; letter-spacing: -0.03em; }
      .scrim { background: rgba(13,17,23,.8); padding: 10px 16px 14px; border-radius: 18px; }
      .ov { font-weight: 700; letter-spacing: -0.04em; line-height: 1.05; text-shadow: 0 4px 30px rgba(0,0,0,.7); }
    </style>
  </head>
  <body>
    <!-- editor pass: cues on words, overlay holds, captions in the bottom 220 px, the close (sound comes after, from cues.json) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="129.56" data-width="1080" data-height="1920">
      <!-- the world: one Three.js scene, one camera (world.js, stations/*.js) -->
      <canvas id="world" width="1080" height="1920" style="position:absolute;left:0;top:0;width:1080px;height:1920px"></canvas>
      <!-- the type is authored on a 720x1280 stage and scaled 1.5x as vectors; the 3D renders natively at 1080x1920 -->
      <div id="scale" style="position:absolute;left:0;top:0;width:720px;height:1280px;transform:scale(1.5);transform-origin:0 0">
      <div class="layer" style="pointer-events:none;background:linear-gradient(rgba(13,17,23,0) 81%, rgba(13,17,23,.9) 91%)"></div>
      <div id="stage" class="layer"></div>
      </div>
    </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const stage = document.getElementById("stage");
        window.BP = window.BP || {};
        BP.CUES = BP.CUES || [];
        const w = (word, n) => VO.w(word, n);
        const e = (word, n) => VO.e(word, n);
        const F = (el, from, to, at) => tl.fromTo(el, from, Object.assign({ immediateRender: false }, to), at);
        const mk = (tag, cls, css, parent, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (css) n.style.cssText = css; if (html != null) n.innerHTML = html; (parent || stage).appendChild(n); return n; };
        const show = (el, at, d = 0.3) => F(el, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, at);
        const hide = (el, at, d = 0.3) => F(el, { opacity: 1 }, { opacity: 0, duration: d, ease: "power2.in" }, at);
        const G = (s) => `<span style="color:var(--green)">${s}</span>`;

        // ---- cues (BP.CUES, in film seconds; cues.mjs writes them to cues.json for sfx_earshot.py and forensics) ----
        const cue = (k, t, extra) => BP.CUES.push(Object.assign({ k, t: +t.toFixed(3) }, extra || {}));
        const at = (i, adj = 0) => VO.W[i][1] + adj; // a word by its index in vo/words.js
        const TT = (str, t0, cps) => [...str].forEach((ch, k) => { if (ch !== " ") cue("type", t0 + k / cps); });

        // chrome: lockup, topic tag, progress
        const chrome = mk("div", "abs chrome", "", stage, `<span><span style="color:var(--green)">~/</span>devweb</span><span style="color:var(--faint);font-size:20px">// tool names</span>`);
        const bar = mk("div", "abs bar");
        const barIn = mk("div", null, "height:3px;background:var(--green);transform-origin:left;transform:scaleX(0)", bar);
        F(barIn, { scaleX: 0 }, { scaleX: 1, duration: VO.END, ease: "none" }, 0);
        const endAt = e("folder", 2) + 1.0; // the 1 s hold after the last word (124.8), then the mark
        hide(chrome, endAt - 0.4, 0.4); hide(bar, endAt - 0.4, 0.4);

        // I. the hook line, above Blink's sprout (on screen from frame 0, 6 words, held to "say")
        const hook = mk("div", "abs ov", "left:44px;right:44px;top:96px;font-size:50px", stage, `Your AI has never<br>seen a ${G("folder.")}`);
        hide(hook, w("say", 1) - 0.1, 0.3);

        // captions: fragments in the bottom 220 px, one line at a time, none while the hook or the closing line is up
        const M = (s, c) => `<span class="m" style="color:var(--${c || "blue"})">${s}</span>`;
        const CAPS = [
          [7, 12, "Say you've given your AI tools:"], [13, 15, "send a reminder,"], [16, 18, "save a note."],
          [19, 24, "It asks the server holding them"], [25, 28, "what it can do,"], [29, 33, "and gets one list back."],
          [34, 37, "Here's a real one."], [38, 42, `${G("35")} tools in the order`], [43, 45, "someone wrote them."],
          [46, 47, "No folders,"], [48, 49, "no groups."], [50, 53, "You say: save this."],
          [54, 58, "It wants a memory tool."], [59, 63, "The name is the first"], [64, 66, "thing it reads,"],
          [68, 69, "and three names", -0.25], [70, 72, `start with ${M("memory", "green")}.`], [73, 75, "It takes one:"],
          [76, 80, `a tool called ${M("memory_recent")}.`], [81, 85, "That tool only reads back"], [86, 88, "what's already saved."],
          [89, 91, "Nothing is saved."], [92, 93, "Nothing errors."], [94, 99, "The note isn't there next time."],
          [100, 101, "Here's why."], [102, 105, "Nothing groups that list"], [106, 109, "except the first word"], [110, 112, "of each name."],
          [113, 116, "Where a tool sits"], [117, 118, "means nothing,"], [119, 121, "near or far."],
          [122, 125, `${M("memory_recent")} sits 12th.`], [126, 129, "The next memory tool"], [130, 131, "sits 28th,"],
          [132, 134, `${G("15")} unrelated tools`], [135, 136, "between them."], [137, 141, "Only the first word says"], [142, 144, "they belong together."],
          [145, 148, "Now the near one."], [149, 152, "The tool that saves,"], [153, 155, `named ${M("write_memory", "red")},`],
          [156, 157, "sits 11th,"], [158, 160, `touching ${M("memory_recent")}.`], [161, 166, `But its first word is ${M("write", "red")}.`],
          [167, 171, "A look for memory tools"], [172, 173, "finds three"], [175, 179, "and misses the one that saves.", -0.3], [180, 183, "That's the lost note."],
          [184, 189, `${G("35")} tools was never the problem.`], [190, 194, "The problem is a list"], [195, 199, "where only the first word"], [200, 201, "groups anything,"],
          [202, 206, "and the name that hurts"], [207, 209, "got it wrong."], [210, 215, "Mostly, this list got it right:"],
          [216, 222, `${G("32")} of 35 put the thing first,`], [223, 225, "then the action."],
          [226, 230, "Tools sharing a first word"], [231, 233, "are a family."], [234, 237, `That alone makes ${G("10")}.`],
          [238, 240, "Nothing catches this."], [241, 243, "A 36th tool"], [244, 248, "can start with any word."],
          [249, 250, "Build passes."], [251, 252, "Deploy passes."], [253, 255, "The AI pays"], [256, 261, "next time it reads the list."],
          [262, 265, "This one held because"], [266, 270, "whoever added a tool matched"], [271, 274, "the names already there."],
          [275, 279, "When you or your AI"], [280, 282, "add a tool,"], [283, 286, "start its name with"], [287, 291, "the thing it acts on,"],
          [292, 296, "and match the first words"], [297, 298, "already there."], [299, 300, "Adding invoices?"],
          [301, 302, `${G("invoice")} first,`], [303, 305, "then the action:"], [306, 307, `${M("invoice_get", "green")},`], [308, 309, `${M("invoice_send", "green")}.`],
          [310, 312, `Not ${M("send_invoice", "red")}.`], [313, 316, "Rename any that start"], [317, 319, "with an action:"],
          [320, 322, `${M("write_memory", "red")} becomes`], [323, 324, `${M("memory_write", "green")}.`],
          // 325-330, "The first word is the folder.", is the closing line below, so it gets no caption
        ];
        CAPS.forEach(([i0, i1, html, lead = 0], k) => {
          const t0 = at(i0, lead) - 0.05;
          const next = k + 1 < CAPS.length ? at(CAPS[k + 1][0], CAPS[k + 1][3] || 0) - 0.05 : at(325) - 0.1; // the last one clears before the closing line
          const t1 = Math.min(next - 0.14, VO.W[i1][2] + 0.9);
          if (t1 < t0 + 0.45) console.warn("caption too short", i0, html, t1 - t0);
          const c = mk("div", "abs cap hide", "", stage, html);
          F(c, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, t0);
          hide(c, t1, 0.14);
        });

        // VII. overlays on number words, re-anchored off them (camera.md): the empty upper right of the wides
        const n32 = mk("div", "abs ov hide scrim", "right:28px;top:140px;font-size:76px;text-align:right", stage, `${G("32")} of 35`);
        const t32 = at(216) - 0.1; // "32" is spoken at 81.04; the card is up by then
        show(n32, t32, 0.25); hide(n32, w("tools", 6) - 0.2); cue("pop", t32 + 0.1);
        // "10 families": small, in the clear band between the lockup row and the entity folder's tab (it covered the tab at 88.5-91 s)
        const n10 = mk("div", "abs ov hide scrim", "right:28px;top:98px;font-size:50px;text-align:right;padding:6px 14px 10px", stage, `${G("10")} families`);
        const t10 = at(237) - 0.1; // "10" is spoken at 88.70
        show(n10, t10, 0.2); hide(n10, t10 + 1.2, 0.2); cue("pop", t10 + 0.1); // up 1.4 s for 2 words (needs 1.1); gone before the camera drops through the tabs

        // X. the line (6 words, up 2.5 s), then the mark over the dimmed shaft, alive to the end
        const dim = mk("div", "layer hide", "background:rgba(13,17,23,.6)", stage);
        show(dim, endAt - 0.1, 0.5);
        const fin = mk("div", "abs ov hide scrim", "right:28px;top:140px;font-size:50px;text-align:right", stage, `The first word<br>is the ${G("folder.")}`);
        const tfin = at(325) - 0.08; // "the" 123.26
        show(fin, tfin, 0.25); hide(fin, endAt + 0.05, 0.3); cue("slam-mute", tfin + 0.2); // sound: none, the closing line stays bare (the slam sat on "the first")
        const mark = mk("div", "abs hide", "left:190px;top:590px;width:340px;height:92px;box-sizing:border-box;border-radius:14px;border:3px solid var(--green);background:#0d1117;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:44px", stage,
          `<span style="color:var(--green)">~/</span>devweb<span id="cur" style="display:inline-block;width:18px;height:40px;margin-left:7px;background:var(--green);opacity:.9"></span>`);
        F(mark, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, endAt);
        cue("sting", endAt + 0.1);
        // the close moves to the last frame: a slow push and rise on the mark, the cursor breathing (no flash: a sine, never a step)
        F(mark, { scale: 1, y: 0 }, { scale: 1.08, y: -10, duration: VO.END - endAt - 0.4, ease: "sine.inOut" }, endAt + 0.4);
        const cur = mark.querySelector("#cur"), brt = { t: 0 };
        tl.fromTo(brt, { t: endAt }, { t: VO.END, duration: VO.END - endAt, ease: "none", immediateRender: false, onUpdate: () => { cur.style.opacity = (0.62 + 0.38 * Math.sin(((brt.t - endAt) / 1.5) * Math.PI * 2)).toFixed(3); } }, endAt);

        // ---- events the world draws (stations/*.js), declared so forensics doesn't count them as pops and the sound has its marks ----
        const tCards = w("gets", 1) + 0.1;                        // II: the 35 cards leave the box mouth, 0.06 s apart
        cue("whoosh", tCards, { d: 1.6 });
        cue("blip", w("first", 1));                               // III: the memory chip leaves Blink's head and runs the list
        const tDA = w("sits", 2) + 0.1, tDB = w("sits", 3) + 0.4; // V: the counter 1..15 rides the dive, one tick per number
        const io = (x) => { x = Math.max(0, Math.min(1, x)); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
        let nPrev = 1;
        for (let tt = tDA; tt <= tDB + 0.01; tt += 1 / 480) { const n = 1 + Math.round(14 * io((tt - tDA) / (tDB - tDA))); if (n !== nPrev) { cue("tick", tt); nPrev = n; } }
        cue("slam", w("misses", 1));                              // VI: write_memory goes red
        cue("thud", w("lost", 1));                                // the lost note: the card swings and flares
        const tPeel = w("mostly", 1) + 0.2;                       // VII: the mass moment, 32 copies leave the cord in order, 0.09 s apart, 0.9 s flight
        cue("riser", tPeel - 0.6, { d: 0.6 }); cue("whoosh", tPeel, { d: 2.9 });
        for (let c = 1; c <= 35; c++) if (c !== 10 && c !== 11 && c !== 32) cue("land", tPeel + 0.09 * (c - 1) + 0.9);
        cue("whoosh", w("nothing", 5) + 1.2, { d: 1.0 });         // VIII: card 36 rises out of the box
        cue("stamp", w("build", 1) + 0.05); cue("stamp", w("deploy", 1) + 0.07); // the build and deploy stamps slam on card 36
        cue("whoosh", w("deploy", 1) - 0.2, { d: 1.0 });          // its copy flies to the empty slot
        cue("pop", w("pays", 1) + 0.22); cue("pop", w("reads", 3) + 0.2); // the AI's search misses, the red "?"
        TT("invoice_get", w("invoice", 2), 14);                   // IX: the invoice folder's lines type on (stations/slot.js, 14 cps)
        TT("invoice_send", w("invoice", 3), 14);
        cue("strike", w("send", 3));                              // the red strike through send_invoice
        cue("strike-mute", w("write", 3));                        // sound: none, the zing sat on "write memory"; write_memory struck, then memory_write typed on card 11 (stations/column.js)
        { const t0 = w("write", 3) + 0.4, t1 = w("memory", 10) + 0.3; TT("memory_write", t0, 12 / (t1 - t0)); cue("land", t1 + 0.9); }

        // sound pass: events the station code draws that had no cue, and clicks muted where they sat within 12 dB of the voice
        // inside a must-catch phrase ("invoice get/send", "write memory becomes memory write"); kinds outside the sound kit are skipped by sfx_earshot.py but still declared to forensics
        cue("thud", w("note", 1) + 0.1 + 0.42);                   // the lid falls shut and bounces (stations/toolbox.js CI), in the pause after "save a note"
        cue("blip", w("it", 1) - 0.1 + 1.8 + 0.25);               // the request card shrinks into the grommet and the box gulps (toolbox.js gulp)
        { const mute = new Set([3431, 3478, 3486, 3640, 3657]); BP.CUES.forEach((c) => { if (c.k === "type" && mute.has(Math.round(c.t * 30) + 1)) c.k = "type-mute"; }); }

        const clock3 = { t: 0 };
        tl.fromTo(clock3, { t: 0 }, { t: VO.END, duration: VO.END, ease: "none", immediateRender: false, onUpdate: () => { if (window.renderWorld) window.renderWorld(clock3.t); } }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module">
      import { buildWorld } from "./world.js";
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let ready; window.__hf.buildReady["world"] = new Promise((r) => (ready = r));
      const render = await buildWorld(document.getElementById("world"));
      window.renderWorld = render;
      window.addEventListener("hf-seek", (ev) => render(ev.detail.time));
      render(window.__hfThreeTime || 0);
      ready();
    </script>
  </body>
</html>
