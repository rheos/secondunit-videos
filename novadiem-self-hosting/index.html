    <script>
      // SH: the one scene every plate shares. The rented box, its one door, the edge, three app containers,
      // their routes, Coolify and the databases. Each part draws into a parent <g> and returns its nodes, so a
      // plate draws the parts it inherits as they are and animates the parts it introduces.
      // Facts: assistant/hosting-map.md, the contabo skill, rheos/rheo-infra traefik-dynamic/ (see BUILD-STATE.md).
      window.SH = (() => {
        const { el, text } = BP;
        const BOX = { x: 560, y: 150, w: 1080, h: 600 };
        const DOOR = [410, 480];
        const ROWS = [245, 445, 645];
        const APPS = [
          ["rheoStream", "RECALL"],
          ["RetainScore", "API"],
          ["GrowOperative", "API"],
        ];
        const HOSTS = ["recall.rheo.stream", "api.retainscore.com", "api.growoperative.app"];
        const EDGE = { x: 590, y: 390, w: 240, h: 110 };
        const APP_X = 940,
          APP_W = 300;

        function box(p) {
          const { x, y, w, h } = BOX;
          const wall = el("path", { class: "ln line", d: `M${x} ${DOOR[0]}V${y}H${x + w}V${y + h}H${x}V${DOOR[1]}` }, p);
          const posts = el("path", { class: "ln line-strong", d: `M${x - 12} ${DOOR[0]}H${x + 12}M${x - 12} ${DOOR[1]}H${x + 12}` }, p);
          const cap = text("ONE RENTED BOX · 8 CORES · 24 GB", { class: "mono cap", x, y: y - 16 }, p);
          return { wall, posts, cap };
        }
        function edge(p) {
          const { x, y, w, h } = EDGE;
          const frame = el("rect", { class: "ln line-strong", x, y, width: w, height: h }, p);
          const name = text("TRAEFIK", { class: "mono", x: x + w / 2, y: y + 48, "text-anchor": "middle" }, p);
          const sub = text("THE EDGE", { class: "mono cap", x: x + w / 2, y: y + 80, "text-anchor": "middle" }, p);
          return { frame, name, sub };
        }
        function app(p, i, subText) {
          const cy = ROWS[i];
          const g = el("g", {}, p);
          const frame = el("rect", { class: "ln line", x: APP_X, y: cy - 45, width: APP_W, height: 90 }, g);
          const name = text(APPS[i][0], { class: "mono", x: APP_X + APP_W / 2, y: cy - 4, "text-anchor": "middle" }, g);
          const sub = text(subText || APPS[i][1], { class: "mono cap", x: APP_X + APP_W / 2, y: cy + 24, "text-anchor": "middle" }, g);
          return { g, frame, name, sub };
        }
        const routeD = (i) => `M${EDGE.x + EDGE.w} 445C885 445 885 ${ROWS[i]} ${APP_X} ${ROWS[i]}`;
        function route(p, i) {
          return el("path", { class: "ln line", d: routeD(i) }, p);
        }
        function coolify(p) {
          const x = 590,
            y = 600,
            w = 240,
            h = 90;
          const frame = el("rect", { class: "ln line", x, y, width: w, height: h }, p);
          const name = text("COOLIFY", { class: "mono", x: x + w / 2, y: y + 40, "text-anchor": "middle" }, p);
          const sub = text("BUILDS · DEPLOYS", { class: "mono cap", x: x + w / 2, y: y + 68, "text-anchor": "middle" }, p);
          return { frame, name, sub };
        }
        function cylinder(p, cx, cy) {
          const top = el("path", { class: "ln line", d: `M${cx - 60} ${cy - 28}a60 12 0 1 0 120 0a60 12 0 1 0 -120 0` }, p);
          const body = el("path", { class: "ln line", d: `M${cx - 60} ${cy - 28}V${cy + 28}a60 12 0 0 0 120 0V${cy - 28}` }, p);
          return { top, body };
        }
        // rheoStream and RetainScore keep Postgres on the box; GrowOperative's lives on managed Postgres off it
        function db(p, i) {
          const cy = ROWS[i];
          const off = i === 2;
          const cx = off ? 1760 : 1410;
          const link = el("path", { class: "ln line", d: `M${APP_X + APP_W} ${cy}H${cx - 60}` }, p);
          const c = cylinder(p, cx, cy);
          const lab = text(off ? "MANAGED POSTGRES" : "POSTGRES", { class: "mono cap", x: cx, y: cy + 66, "text-anchor": "middle" }, p);
          return { link, top: c.top, body: c.body, lab };
        }
        // everything up to and including plate `upto` (1 box, 2 edge, 3 apps, 4 coolify, 5 databases), fully drawn
        function scene(p, upto) {
          const S = {};
          if (upto >= 1) S.box = box(p);
          if (upto >= 2) S.edge = edge(p);
          if (upto >= 3) {
            S.routes = [0, 1, 2].map((i) => route(p, i));
            S.apps = [0, 1, 2].map((i) => app(p, i));
          }
          if (upto >= 4) S.coolify = coolify(p);
          if (upto >= 5) S.dbs = [0, 1, 2].map((i) => db(p, i));
          return S;
        }
        return { BOX, DOOR, ROWS, APPS, HOSTS, EDGE, APP_X, APP_W, box, edge, app, route, routeD, coolify, cylinder, db, scene };
      })();
