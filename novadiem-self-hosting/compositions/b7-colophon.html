<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #b7 {
          position: absolute;
          inset: 0;
        }
        #b7 svg text.mono.faint {
          fill: var(--ink-dim);
          font-weight: 400;
        }
      </style>
      <div id="b7" data-composition-id="b7" data-width="1920" data-height="1080">
        <svg class="full" viewBox="0 0 1920 1080">
          <g id="b7-pipe"></g>
          <text id="b7-site" class="mono" x="960" y="560" text-anchor="middle">novadiem.com</text>
          <text id="b7-name" class="mono cap" x="960" y="596" text-anchor="middle">NOVADIEM STUDIO · SELF-HOSTING</text>
        </svg>
        <div id="b7-label-l" class="plate-label left" data-layout-allow-overlap data-layout-allow-occlusion>Plate VII</div>
        <div id="b7-label-r" class="plate-label right" data-layout-allow-overlap data-layout-allow-occlusion>Colophon</div>
        <div class="statement two" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="row"><span id="b7-st-a" class="phrase">One box. One door.</span></div>
          <div class="row"><span id="b7-st-b" class="phrase red">One push to deploy.</span></div>
        </div>
      </div>

      <script>
        (() => {
          const { el, text, kit } = window.BP;
          const tl = gsap.timeline({ paused: true });
          const K = kit(tl, 79.5);

          K.fade(K.$("b7-label-l"), K.T(79.44), 0.4);
          K.fade(K.$("b7-label-r"), K.T(79.44), 0.4);

          // one request's path, left as construction lines
          const pipe = K.$("b7-pipe");
          ["REQUEST", "EDGE", "ROUTE", "APP", "DATA"].forEach((s, i) => {
            const cx = 360 + i * 300;
            const box = el("rect", { class: "ln line construct", x: cx - 100, y: 330, width: 200, height: 80 }, pipe);
            const lab = text(s, { class: "mono faint", x: cx, y: 377, "text-anchor": "middle" }, pipe);
            const at = K.T(80.06) + i * 0.2;
            K.sweep(box, at, 0.4);
            K.fade(lab, at + 0.2, 0.3, 0.8);
            if (i < 4) {
              const arrow = el("path", { class: "ln line construct", d: `M${cx + 108} 370H${cx + 192}` }, pipe);
              K.sweep(arrow, at + 0.3, 0.25);
            }
          });

          K.reveal(K.$("b7-st-a"), K.T(80.69), 0.6);
          K.reveal(K.$("b7-st-b"), K.T(81.32), 0.8);
          K.fade(K.$("b7-site"), K.T(81.94), 0.5);
          K.fade(K.$("b7-name"), K.T(81.94) + 0.3, 0.5);

          window.__timelines["b7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
