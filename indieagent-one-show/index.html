<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        /* palette B, warm paper: indieagent.ai type, its light-theme red as the one accent */
        --paper: #F2EADB;
        --paper-edge: #E2D4BA;
        --line: #8A7350;
        --ink: #1E1A14;
        --label: #5E4E33;
        --accent: #C8341E;
        --accent-text: #A82B18;
        --card: #F5EEE1;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root {
        position: relative; width: 100%; height: 100%;
        background: radial-gradient(ellipse at 50% 45%, var(--paper) 55%, var(--paper-edge) 100%);
      }
      svg { position: absolute; inset: 0; }
      .line { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .hair { fill: none; stroke: var(--line); stroke-width: 1; }
      .perf { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-dasharray: 2 9; stroke-linecap: round; }
      .label { font-family: "Archivo", sans-serif; font-weight: 600; text-transform: uppercase; fill: var(--label); letter-spacing: 0.16em; }
      .mono { font-family: "JetBrains Mono", monospace; fill: var(--ink); }
      .big { font-family: "Archivo", sans-serif; font-weight: 800; fill: var(--ink); }
      #chapter { position: absolute; left: 120px; top: 96px; font: 600 20px "Archivo", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: var(--label); }
      #headline {
        position: absolute; left: 0; right: 0; top: 868px; text-align: center;
        font: 800 52px "Archivo", sans-serif; letter-spacing: -0.01em; color: var(--ink);
      }
      #headline .accent { color: var(--accent-text); }
      #counter { position: absolute; right: 120px; top: 958px; font: 500 22px "JetBrains Mono", monospace; color: var(--ink); letter-spacing: 0.08em; }
      #barlabel { position: absolute; left: 120px; top: 962px; font: 600 16px "Archivo", sans-serif; letter-spacing: 0.2em; text-transform: uppercase; color: var(--label); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <svg id="plate" class="clip" data-start="0" data-duration="12" data-track-index="0" viewBox="0 0 1920 1080">
        <defs>
          <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" />
            <feColorMatrix values="0 0 0 0 0.30  0 0 0 0 0.24  0 0 0 0 0.14  0 0 0 0.07 0" />
          </filter>
          <clipPath id="reveal-date"><rect id="rv-date" x="440" y="330" width="0" height="70" /></clipPath>
          <clipPath id="reveal-city"><rect id="rv-city" x="440" y="410" width="0" height="100" /></clipPath>
          <clipPath id="reveal-venue"><rect id="rv-venue" x="440" y="520" width="0" height="70" /></clipPath>
        </defs>
        <rect width="1920" height="1080" filter="url(#grain)" />
        <g id="border">
          <rect class="hair draw" x="60" y="56" width="1800" height="968" />
          <rect class="hair draw" x="72" y="68" width="1776" height="944" />
          <path class="line draw" d="M40 56 H84 M60 36 V80 M1836 56 H1880 M1860 36 V80 M40 1024 H84 M60 1004 V1048 M1836 1024 H1880 M1860 1004 V1048" />
        </g>
        <g id="pile"></g>
        <g id="ticket"></g>
        <g id="callouts"></g>
        <g id="scale"></g>
      </svg>
      <div id="chapter" class="clip" data-start="0" data-duration="12" data-track-index="1">Plate IV &middot; The Ticket</div>
      <div id="headline" class="clip" data-start="0" data-duration="12" data-track-index="2">One show, written down <span class="accent">once.</span></div>
      <div id="barlabel" class="clip" data-start="0" data-duration="12" data-track-index="3">Shows booked</div>
      <div id="counter" class="clip" data-start="0" data-duration="12" data-track-index="4"><span id="count">00</span> / 53</div>
    </div>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => {
        const n = document.createElementNS(NS, tag);
        for (const k in attrs) n.setAttribute(k, attrs[k]);
        parent.appendChild(n);
        return n;
      };

      // Ticket geometry: body plus a tear-off stub, notched at the perforation
      const X = 400, Y = 290, TW = 960, TH = 380, PX = 1100, R = 16;
      const stubPath = (dx, dy) => {
        const x = X + dx, y = Y + dy, px = PX + dx;
        return `M${x},${y} H${px - R} A${R} ${R} 0 0 0 ${px + R},${y} H${x + TW} V${y + TH} H${px + R} A${R} ${R} 0 0 0 ${px - R},${y + TH} H${x} Z`;
      };

      // 52 earlier tickets, piled down-left beneath the new one (oldest painted first)
      const pile = document.getElementById("pile");
      const ghosts = [];
      for (let i = 0; i < 52; i++) {
        const k = 52 - i; // distance below the top ticket
        // plain card edges: stacked notches read as a tube, so only the top ticket is notched
        ghosts.push(el("rect", { x: X - k * 0.45, y: Y + k * 1.2, width: TW, height: TH, fill: "var(--card)", stroke: "var(--line)", "stroke-width": 0.8, opacity: 0 }, pile));
      }

      // the new ticket, show 53
      const tk = document.getElementById("ticket");
      el("path", { d: stubPath(0, 0), fill: "var(--card)", stroke: "none", class: "card-fill" }, tk);
      const outline = el("path", { class: "line", d: stubPath(0, 0), "stroke-width": 2 }, tk);
      const perf = el("path", { class: "perf", d: `M${PX},${Y + R + 8} V${Y + TH - R - 8}` }, tk);
      const inner = el("rect", { class: "hair", x: X + 18, y: Y + 18, width: PX - X - 52, height: TH - 36 }, tk);

      const field = (txt, attrs, clip) => {
        const t = el("text", attrs, tk);
        t.textContent = txt;
        if (clip) t.setAttribute("clip-path", `url(#${clip})`);
        return t;
      };
      // 2026-11-12 falls on a Thursday
      field("THU · NOV 12 · 2026", { class: "mono", x: 440, y: 380, "font-size": 30, "letter-spacing": "0.06em" }, "reveal-date");
      field("NELSON, BC", { class: "big", x: 440, y: 490, "font-size": 84, "letter-spacing": "-0.01em" }, "reveal-city");
      field("THE ROYAL", { class: "big", x: 440, y: 566, "font-size": 40, "font-weight": 600, "letter-spacing": "0.04em" }, "reveal-venue");
      const admit = field("ADMIT ONE", { class: "label", x: PX + 40, y: Y + 70, "font-size": 18 });
      const noLbl = field("NO.", { class: "label", x: PX + 40, y: Y + 200, "font-size": 18 });
      const serial = field("053", { class: "mono", x: PX + 38, y: Y + 270, "font-size": 72, "font-weight": 500, style: "fill: var(--accent-text)" });

      // callouts: dimension mark above, leaders on the left, one under the stub
      const co = document.getElementById("callouts");
      const callTxt = (t, a) => { const n = el("text", Object.assign({ class: "label", "font-size": 16 }, a), co); n.textContent = t; return n; };
      el("path", { class: "hair draw", d: `M${X},${Y - 44} H${X + TW} M${X},${Y - 54} V${Y - 34} M${X + TW},${Y - 54} V${Y - 34}` }, co);
      callTxt("one show", { x: X + TW / 2, y: Y - 56, "text-anchor": "middle" });
      [["date", 368], ["city · region", 460], ["venue", 552]].forEach(([t, y]) => {
        el("circle", { cx: 426, cy: y, r: 3, fill: "var(--line)", class: "dot" }, co);
        el("path", { class: "hair draw", d: `M423,${y} H330` }, co);
        callTxt(t, { x: 318, y: y + 5, "text-anchor": "end" });
      });
      el("path", { class: "hair draw", d: `M${PX + 92},${Y + 290} V${Y + TH + 70}` }, co);
      callTxt("show no.", { x: PX + 92, y: Y + TH + 96, "text-anchor": "middle" });

      // bottom scale: 53 ticks, fill follows the shows booked
      const scale = document.getElementById("scale");
      el("path", { class: "hair draw", d: "M120 1000 H1800" }, scale);
      const ticks = [];
      for (let i = 0; i < 53; i++) {
        const x = 120 + (i * 1680) / 52;
        ticks.push(el("path", { class: "line", d: `M${x} 1000 V${i % 10 === 0 ? 982 : 990}`, opacity: 0 }, scale));
      }
      const fill = el("path", { d: "M120 1000 H1800", stroke: "var(--accent)", "stroke-width": 4, fill: "none" }, scale);

      const prep = (n) => { const L = n.getTotalLength(); n.style.strokeDasharray = L; n.style.strokeDashoffset = L; return n; };
      document.querySelectorAll(".draw").forEach(prep);
      prep(outline);
      const fillLen = 1680; fill.style.strokeDasharray = fillLen; fill.style.strokeDashoffset = fillLen;

      const tl = gsap.timeline({ paused: true });
      const count = { n: 0 };
      const countEl = document.getElementById("count");
      const showCount = () => (countEl.textContent = String(Math.round(count.n)).padStart(2, "0"));

      // 0-1.6 plate frame
      tl.to("#border .draw", { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut", stagger: 0.1 }, 0);
      tl.from("#chapter", { opacity: 0, x: -16, duration: 0.8, ease: "power2.out" }, 0.5);
      tl.from("#barlabel, #counter", { opacity: 0, duration: 0.6 }, 0.8);
      tl.to("#scale .draw", { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 0.6);
      // 1.4-5.0 the season so far: 52 tickets pile up, counter follows
      tl.to(ghosts, { opacity: 1, duration: 0.2, stagger: 3.4 / 52 }, 1.4);
      tl.to(ticks.slice(0, 52), { opacity: 1, duration: 0.2, stagger: 3.4 / 52 }, 1.4);
      tl.to(fill, { strokeDashoffset: fillLen * (1 - 52 / 53), duration: 3.6, ease: "none" }, 1.4);
      tl.to(count, { n: 52, duration: 3.6, ease: "none", onUpdate: showCount }, 1.4);
      // 5.0-8.4 the new ticket draws itself, then its details write in
      tl.fromTo(".card-fill", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 5.0);
      tl.to(outline, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 5.0);
      tl.from([perf, inner], { opacity: 0, duration: 0.6, stagger: 0.2 }, 5.9);
      tl.from(admit, { opacity: 0, duration: 0.5 }, 6.2);
      tl.to("#rv-date", { attr: { width: 760 }, duration: 0.7, ease: "steps(22)" }, 6.4);
      tl.to("#rv-city", { attr: { width: 760 }, duration: 0.6, ease: "power2.out" }, 7.0);
      tl.to("#rv-venue", { attr: { width: 760 }, duration: 0.5, ease: "power2.out" }, 7.5);
      tl.to("#callouts .draw", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.12 }, 6.6);
      tl.from("#callouts text, #callouts .dot", { opacity: 0, duration: 0.5, stagger: 0.1 }, 6.9);
      // 8.4-9.8 its number is 53
      tl.from(noLbl, { opacity: 0, duration: 0.4 }, 8.4);
      tl.from(serial, { opacity: 0, y: 10, duration: 0.5, ease: "power2.out" }, 8.6);
      tl.to(ticks[52], { opacity: 1, stroke: "var(--accent)", duration: 0.2 }, 8.8);
      tl.to(fill, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 8.7);
      tl.to(count, { n: 53, duration: 0.3, onUpdate: showCount }, 8.8);
      // 9.8-12 headline
      tl.from("#headline", { opacity: 0, y: 14, duration: 0.8, ease: "power2.out" }, 9.8);
      tl.to({}, { duration: 0.01 }, 11.99);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
